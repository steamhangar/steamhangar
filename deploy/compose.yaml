# SteamHangar -- Docker Compose deployment (Phase 1, WP 1.9).
#
#   cd deploy
#   cp .env.example .env      # then set VAULT_API_KEY
#   docker compose up -d
#
# Everything configurable lives in deploy/.env (Compose reads it automatically
# from this directory). NO SECRETS IN THIS FILE -- VAULT_API_KEY is referenced,
# never defaulted: `${VAULT_API_KEY:?...}` makes Compose refuse to run at all if
# it is unset or empty, which is the intended behaviour for the one value that
# guards every non-health endpoint.
#
# Full walkthrough, including the one-time interactive SteamPrefill login and the
# port-80 / dedicated-IP story: deploy/README.md.

name: steamhangar

# --- Log rotation ------------------------------------------------------------
# Applied to every service below. This is what closes core/README.md's open "log
# rotation" caveat from WP 1.1: all three containers log to stdout/stderr, and
# the json-file driver caps what that costs on disk -- 10 MB per file, 5 files,
# so at most ~50 MB per service, ~150 MB total, enforced by the daemon with no
# logrotate, no cron and no SIGUSR1 reopen dance. Raise VAULT_LOG_MAX_SIZE /
# VAULT_LOG_MAX_FILE in .env if you want longer history (vault-core logs one line
# per depot request, so a busy prefill can churn through 10 MB quickly).
x-vault-logging: &vault-logging
  driver: json-file
  options:
    max-size: "${VAULT_LOG_MAX_SIZE:-10m}"
    max-file: "${VAULT_LOG_MAX_FILE:-5}"

# ==============================================================================
# THE EGRESS LOCK (WP EG-1, ADR-0011). READ THIS BEFORE ANYTHING ELSE BELOW.
#
# vault-api's own container has NO default route for an ARBITRARY outbound
# TCP/UDP connection. Every line that makes that true (and that carves out
# the one path it still has) is named explicitly here -- this comment IS the
# audit surface, not a summary of it, so checking these claims means reading
# these exact lines, not trusting this paragraph. Two things this does NOT
# close are named at the end, deliberately, not omitted: read those too.
#
#   1. `networks:` below defines `vault-lan` (a bridge network with Docker's
#      outbound NAT/masquerade rule turned OFF for it) and `vault-egress`
#      (`internal: true` -- Docker refuses to route it anywhere outside
#      itself at all, not even with masquerade on).
#   2. vault-api's own `networks:` list (in its service block below) attaches
#      it to EXACTLY those two networks -- no `default`, no third network.
#      `vault-lan` still carries its published port (inbound keeps working;
#      Docker's port-publish DNAT is independent of the masquerade rule
#      `vault-lan` disables -- measured, deploy/README.md's "verify in five
#      minutes" section), and a direct OUTBOUND connection to an ARBITRARY
#      WAN or other-LAN-device address times out (masquerade is a blanket
#      "leaving this bridge" rule with no destination-based exception -- see
#      deploy/README.md for the measurement and why this answers the "what
#      about a LAN-destined webhook" question the same way for both).
#   3. `vault-egress` is shared with exactly one other container:
#      `vault-proxy`, below. vault-api's `HTTP_PROXY`/`HTTPS_PROXY` env lines
#      point at it BY NAME -- the only route this container has to anything
#      beyond the LAN runs through those two lines, into that one container.
#   4. `vault-proxy` is dual-attached: `vault-egress` (to talk to vault-api)
#      and `default` (a normal, masquerading network -- its real route to
#      Valve, the manifest oracle, or a webhook receiver, LAN or WAN). It
#      refuses every destination not in its rendered filter file
#      (`deploy/proxy/docker-entrypoint.sh`, built from `VAULT_EGRESS_ALLOW`
#      plus one baked-in host) -- a CONNECT or GET to anything else gets a
#      real `403 Filtered` from the proxy itself, not a silent drop.
#
# TWO CHANNELS SURVIVE THIS LOCK, MEASURED AND ACCEPTED, NOT OVERSIGHTS
# (docs/adr/0011-egress-lock.md has the full argument for both):
#   - DNS resolution from inside vault-api still reaches the real internet
#     (Docker's embedded resolver answers from the HOST's own network
#     namespace, not the container's -- vault-lan's masquerade-disable is
#     irrelevant to it). A compromised process can exfiltrate data one DNS
#     label at a time this way. No code change closes this without also
#     removing vault-api's own name resolution.
#   - The Docker host's own non-loopback address(es), and anything any
#     container has published on 0.0.0.0 (vault-core:80 in this file),
#     remain directly reachable, bypassing HTTP_PROXY entirely -- a reply
#     from the host to a container needs no masquerade either way.
#
# What this does NOT lock down, by design (ADR-0011 has the full argument):
# `vault-runner` (broad Steam CM/CDN egress is the entire reason the S-track
# split it out of vault-api in the first place) and `vault-core` (its own,
# separate, already-narrower Host-allowlist mechanism, ADR-0001 req 4) are
# UNCHANGED by this block -- neither gets a `networks:` line here, so both
# keep the plain, fully-routed `default` network they always had.
# ==============================================================================

networks:
  # No masquerade: outbound packets sourced from a container on this network
  # get NO NAT as they leave the bridge, so they carry an address nothing
  # outside Docker can route a reply to -- a real connection attempt just
  # times out (measured, WP EG-1: a direct socket to a public IP from a
  # container on a network configured exactly like this one). Inbound stays
  # unaffected: Docker's published-port DNAT is a completely separate
  # iptables rule from the masquerade one this switch disables.
  #
  # enable_ipv6: false on vault-lan AND vault-egress, explicitly (WP
  # DEPLOY-FIX-2, ADR-0011 addendum 2026-10-01): a Docker daemon may give new
  # networks an IPv6 subnet by default (measured on a real host: vault-egress
  # got a ULA /64 next to its IPv4 /24). The masquerade switch above only
  # removes IPv4 NAT; IPv6 has no NAT to remove, so on a host with a routed
  # IPv6 prefix and IPv6 forwarding vault-api could reach the internet over
  # IPv6 directly, bypassing the proxy. No IPv6 on these two networks means
  # vault-api has no IPv6 address to send from at all. The `default` network
  # (vault-proxy's, vault-runner's and vault-core's real route out) is left
  # as the daemon configures it: those services are allowed out anyway.
  vault-lan:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # internal: true is Docker's own, stronger guarantee: no route out of this
  # network exists AT ALL, to anything, regardless of masquerade -- verified
  # directly (WP EG-1): even DNS resolution of an outside name fails from a
  # container attached only here, not merely the eventual TCP connect. A
  # fixed subnet (not Compose's auto-picked one) is pinned deliberately, so
  # `deploy/proxy/tinyproxy.conf`'s own `Allow` directive (who may USE the
  # proxy -- a different allowlist from the destination one) can name an
  # exact, auditable CIDR instead of a guessed RFC1918 range.
  #
  # Configurable since WP DEPLOY-FIX-2 (ADR-0011 addendum 2026-10-01): the
  # project `name:` scopes this network's NAME, but not its subnet, so a second
  # SteamHangar stack (or anything else) on the same host that already holds
  # 172.30.238.0/24 makes `up -d` fail with "Pool overlaps". Set
  # VAULT_EGRESS_SUBNET in deploy/.env to another private /24 in that case.
  # The colon form `:-` is deliberate: a BLANK value must fall back to the
  # default too, because a blank subnet is invalid. vault-proxy gets the same
  # expression below and renders its client `Allow` line from it.
  vault-egress:
    internal: true
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${VAULT_EGRESS_SUBNET:-172.30.238.0/24}

services:

  # ===========================================================================
  # vault-core -- the cache. Plain HTTP on port 80, LAN only.
  # ===========================================================================
  vault-core:
    build:
      context: ../core
      dockerfile: Dockerfile
    image: ghcr.io/steamhangar/vault-core:${VAULT_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      # Upstream DNS resolver nginx uses to resolve Steam CDN hostnames at
      # request time (ADR-0001 req 4). MUST NOT point at vault-dns: vault-dns
      # answers *.steamcontent.com with vault-core's own address, which would
      # make every cache miss proxy back into this container: the boot
      # preflight then refuses to start, and a rewrite that appears after
      # boot gets every miss answered 508 Loop Detected after one hop.
      VAULT_RESOLVER: ${VAULT_RESOLVER:-1.1.1.1}
      # Optional cache-event log (WP 3.10, ADR-0008; core/README.md
      # "Cache-event log"). Empty (the default from core/Dockerfile) means
      # OFF: core/docker/25-vault-eventlog.sh strips the access_log
      # directives entirely, so nothing is created or written. Same
      # default-empty passthrough pattern as CACHE_IP below for vault-dns.
      # The consumer is WP 3.11's sweeper (miss-triggered prefill
      # completion, per-client hit stats, bypass detection -- requirement
      # A12): vault-api's matching VAULT_EVENT_LOG_PATH is set a few lines
      # down. .env.example ships both uncommented as of the 2026-08-17
      # packaging work package -- see it before turning this back off. When
      # set, it must be a path under /vault/; see the volume note on
      # vault-api's /vault mount below for why no extra mount is needed here
      # for vault-api to read it later.
      VAULT_EVENT_LOG: ${VAULT_EVENT_LOG:-}
      # Container local time (WP TH-1b). nginx evaluates
      # VAULT_UPSTREAM_RATE_WINDOW below against `$time_iso8601`, i.e. this
      # container's local clock, so vault-core must see the same TZ the
      # scheduler in vault-api uses. Same `:-` form as vault-api and
      # vault-runner, for the same reason (blank TZ == UTC, see vault-api).
      TZ: ${TZ:-UTC}
      # Optional upstream (Steam CDN -> vault) rate cap (WP TH-1a/TH-1b,
      # ADR-0015, core/README.md "Upstream rate cap"). ONE aggregate limit in
      # bytes/s, nginx size syntax (k = 1024, m = 1048576), divided per
      # request by the live request count. Empty or unset = no cap. An
      # invalid value stops vault-core's boot (fail-closed). Env-only:
      # recreate vault-core after a change.
      VAULT_UPSTREAM_RATE: ${VAULT_UPSTREAM_RATE-}
      # Full speed INSIDE this HH:MM-HH:MM window, capped outside it.
      # DELIBERATELY THE NO-COLON FORM, twice (docs/LEARNINGS.md, the
      # `${VAR-}` vs `${VAR:-}` entry): UNSET follows VAULT_SCHEDULE_WINDOW
      # (with the same `03:00-07:00` default as vault-api's line, so the
      # cap lifts exactly when the scheduler's window opens); explicitly
      # BLANK passes through as "" = the cap applies around the clock. A
      # blank VAULT_SCHEDULE_WINDOW (scheduler disabled) with this one unset
      # therefore also caps around the clock. Only the ENV window is
      # followed: a window stored via `PATCH /v1/settings` is invisible to
      # vault-core. Nested interpolation `${A-${B-c}}` is part of the
      # Compose specification; verified on Compose 2.40.3, older Compose v2
      # releases may not support nested defaults. The deploy-static CI job
      # only checks that this file is accepted; the resolved values (unset,
      # blank, set, for both variables) are checked by verify-stack.sh step
      # 3e-ter.
      VAULT_UPSTREAM_RATE_WINDOW: ${VAULT_UPSTREAM_RATE_WINDOW-${VAULT_SCHEDULE_WINDOW-03:00-07:00}}
      # HTTPS passthrough on port 443 (WP CORE-FIX-3, ADR-0020): TLS for
      # *.steamcontent.com SNI names is copied to Valve unchanged (no
      # certificate, nothing cached), everything else is closed at once.
      # Needed when DNS rewrites *.steamcontent.com to this cache: Steam
      # tools fetch some files (SteamPrefill: depot manifests) over HTTPS
      # from those same names. ON by default; 0/false/off/no switches the
      # listener off, any other value stops vault-core's boot. The `:-`
      # form on purpose: a blank line in .env means the default (on), so
      # "off" always needs an explicit 0. Whether the LAN can REACH it is
      # the separate VAULT_TLS_BIND below.
      VAULT_TLS_PASSTHROUGH: ${VAULT_TLS_PASSTHROUGH:-1}
      # Optional upstream keepalive pool (WP CORE-FEAT-1, ADR-0017,
      # core/README.md and deploy/README.md "Upstream keepalive pool").
      # Space-separated Steam CDN edge host names; vault-core renders one
      # nginx `upstream` group per name at boot and reuses a few pooled TCP
      # connections per edge (at most 8 idle) across cache MISSes instead of
      # opening one new connection per chunk (the CGNAT port-quota fix,
      # stage 2). Empty or unset = no pool, every MISS
      # opens its own connection as before; a name that is not listed keeps
      # that path too. Rules, checked fail-closed by
      # core/docker/28-vault-upstream-pool.sh (an invalid list stops the boot
      # with `28-vault-upstream-pool.sh: FATAL` naming the value): lowercase,
      # no scheme or port, each name inside one of the two Host-allowlist
      # families (`*.steamcontent.com`, `*.steamserver.net`; the marker
      # `lancache.steamcontent.com` itself is refused, list the edge it maps
      # to), no duplicates, AT MOST 4 names (keepalive 8 idle connections per
      # edge, 32 in total, ADR-0017 decision 3A). Env-only, baked at container
      # start: recreate vault-core after a change (`docker compose up -d
      # vault-core`, decision 4B), the same contract as VAULT_UPSTREAM_RATE
      # above and the same `-` form (blank passes through as "" = off).
      # deploy/.env.example ships a seed list (decision 2B).
      VAULT_UPSTREAM_POOL_HOSTS: ${VAULT_UPSTREAM_POOL_HOSTS-}
      # One pooled upstream edge for EVERY cache MISS plus a global upstream
      # connection cap (WP CORE-FIX-4, ADR-0021, core/README.md "Upstream edge
      # and connection cap"). ON out of the box: the default is the edge the
      # Steam client's discovery marker maps to. With an edge set, every
      # allowed MISS is dialled on that ONE name over keepalive connections,
      # whatever Host the client sent, and VAULT_UPSTREAM_POOL_HOSTS above is
      # ignored. ROLLBACK to the per-name path: set VAULT_UPSTREAM_EDGE= EMPTY
      # in .env. This is the `-` form on purpose: unset takes the default (on),
      # an explicit blank passes through as "" (legacy mode). Exactly one
      # lowercase host name in the Host-allowlist families; anything else
      # stops the boot (`28-vault-upstream-pool.sh: FATAL`). Env-only: recreate
      # vault-core after a change.
      VAULT_UPSTREAM_EDGE: ${VAULT_UPSTREAM_EDGE-dist-fra1.discovery.steamserver.net}
      # The global cap C on concurrent upstream connections (both modes),
      # whole number 1..64, NO off switch; over the cap vault-core answers
      # 503. Empty or unset = 16 (the hook's default, so `-` and `:-` agree).
      # Below VAULT_PREFILL_MAX_THREADS the boot is refused.
      VAULT_UPSTREAM_MAX_CONNS: ${VAULT_UPSTREAM_MAX_CONNS-}
      # Read here only for that floor check (the prefill threads of vault-api
      # and vault-runner are what the cap must not starve). Same variable and
      # default as on those services; empty counts as 8.
      VAULT_PREFILL_MAX_THREADS: ${VAULT_PREFILL_MAX_THREADS:-8}
    ports:
      # PORT 80 IS NOT NEGOTIABLE FOR REAL CLIENTS. Steam CDN traffic is plain
      # HTTP and the Steam client will only ever ask for port 80 -- a cache on
      # another port simply never gets used (docs/PROJECT_PLAN.md §10).
      #
      # If something else on this host already owns port 80, do NOT move
      # SteamHangar to another port -- give it its own address instead (§10):
      #   * an IP alias on the existing NIC:
      #       ip addr add 192.168.1.50/24 dev eth0
      #       VAULT_CORE_BIND=192.168.1.50   in .env
      #   * or a macvlan / dedicated VLAN interface for the container.
      # Then point your DNS rewrite (or vault-dns's CACHE_IP) at that address.
      #
      # Default 0.0.0.0 is deliberate and correct HERE and only here: every LAN
      # client must be able to reach the cache. It is still a LAN-only service --
      # never port-forward it, never put it behind a public reverse proxy
      # (§10: "never expose vault-core/port 80"). It has no authentication, by
      # design: the Steam client cannot present any.
      - "${VAULT_CORE_BIND:-0.0.0.0}:${VAULT_CORE_PORT:-80}:80"
      # Port 443, the HTTPS passthrough (WP CORE-FIX-3, ADR-0020). Published
      # on the LAN ONLY when VAULT_TLS_BIND is set, and only on that address:
      #   VAULT_TLS_BIND=192.168.1.50   -> 192.168.1.50:443  (set it to the
      #                                    same address as VAULT_CORE_BIND)
      #   unset or blank                -> 127.0.0.1:<random port>, i.e.
      #                                    not reachable from the LAN and
      #                                    never colliding with a host port
      # It deliberately does NOT follow VAULT_CORE_BIND (unset = 0.0.0.0):
      # port 443 is far more often taken on the host than port 80 (NAS web
      # UIs, reverse proxies), and an upgrade must not suddenly bind it, or
      # bind 443 on every interface. 0.0.0.0 happens only if you write
      # VAULT_TLS_BIND=0.0.0.0 yourself. VAULT_TLS_PORT moves the HOST port
      # (testing only: clients always connect to 443, like port 80 above).
      # `${VAR:+...}` (Compose spec: "replacement if set and non-empty")
      # leaves the host port EMPTY when the bind is unset or blank, so
      # Docker picks a random loopback port. Resolved per case by
      # deploy/tests/verify-stack.sh step 3q (measured on Compose 2.38.1).
      - "${VAULT_TLS_BIND:-127.0.0.1}:${VAULT_TLS_BIND:+${VAULT_TLS_PORT:-443}}:443"
    volumes:
      # ONE volume, mounted at /vault, containing BOTH cache/ and tmp/.
      # This is a correctness requirement, not tidiness: proxy_store completes
      # every cached object by rename()-ing it out of tmp/ into cache/depot/...,
      # which is atomic only within a single filesystem (core/README.md
      # "Same-filesystem requirement"). Do not split these into two mounts --
      # the container's preflight compares st_dev and refuses to start if you do.
      #
      # VAULT_CACHE_PATH (deploy/.env, empty by default) is the dedicated-cache-
      # mount knob: leave it unset and this resolves to the plain string
      # "vault-cache", i.e. the Docker-managed named volume declared under
      # `volumes:` below -- byte-for-byte what this line always was, so a
      # deployment that never touches VAULT_CACHE_PATH sees ZERO behaviour
      # change. Set it to an ABSOLUTE host path (e.g. a ZFS dataset mount point)
      # and Compose's short-syntax volume source disambiguates on the leading
      # "/": the same string now bind-mounts that host directory at /vault
      # instead -- cache/ AND tmp/ move together as one unit, because it is the
      # single /vault mount point that is being redirected, not a sub-path
      # underneath it. This is deliberate: the same-filesystem constraint above
      # is only satisfiable by moving both at once, never one at a time.
      # vault-api mounts the same source a few lines down (plus `nocopy` in
      # named-volume mode only, so this service is the volume's only seeder;
      # see there) -- both services must resolve to the SAME location,
      # named-volume or bind-mount.
      # See deploy/README.md "Using a dedicated cache mount" for the required
      # host-side `mkdir` + `chown 101:101` before first start.
      - ${VAULT_CACHE_PATH:-vault-cache}:/vault
    security_opt:
      # nginx's master drops privileges to uid 101 for its workers; nothing here
      # ever needs to gain privileges via a setuid binary.
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # SEC-FIX-1 (WP 5.3 review S-1). Unlike every other service here,
      # vault-core STARTS as root: the image entrypoint, its hooks and the
      # nginx master run as root, and only the workers (uid 101) serve
      # requests. Each capability below is what one of those root steps
      # needs; the workers lose all of them at their setuid().
      #
      # NET_BIND_SERVICE: the master binds port 80 (and 443 for the HTTPS
      #   passthrough, WP CORE-FIX-3). (Docker >= 20.10 sets
      #   net.ipv4.ip_unprivileged_port_start=0 in a container's own network
      #   namespace, so it may be redundant on this engine. Kept so the
      #   bind does not depend on that default.)
      # SETUID, SETGID: the master's setgid()/initgroups()/setuid() to the
      #   `nginx` user for each worker, and busybox `su` in
      #   21-vault-volume-ownership.sh (probes AS uid 101 that it can create
      #   nothing in /vault, cache/, tmp/, logs/) and 40-vault-preflight.sh
      #   (probes that uid 101 can write cache/depot and tmp/proxy).
      # CHOWN: 21-vault-volume-ownership.sh migrates /vault, cache/, tmp/ and
      #   logs/ to root:root and creates cache/depot and the nginx temp dirs
      #   owned by 101 (WP SEC-FIX-5); 25-vault-eventlog.sh chowns the
      #   event-log FILE to 101:101; the master chown()s a temp dir only if
      #   it is not already the worker's.
      # DAC_OVERRIDE: since SEC-FIX-5 root owns every directory it writes
      #   in, so the one remaining need is the master opening the 101-owned
      #   event log (0644) for appending at start (event log ON, as
      #   deploy/.env.example ships it).
      #
      # Deliberately NOT granted: FOWNER (no root step chmods or utimes a
      # file it does not own: 21- chowns to root before chmod, and chmods a
      # new 101-owned dir before handing it over; nginx only chmods a temp
      # dir that lacks u+rwx, and they are created 0700), KILL (the master signals its uid-101
      # workers over its channel socket for quit/reload; kill() is only a
      # fallback, e.g. SIGKILL after a SIGTERM stop times out), and NET_RAW,
      # MKNOD, SETPCAP, SETFCAP, FSETID, SYS_CHROOT, AUDIT_WRITE (nothing
      # here uses them). verify-stack.sh step 4c checks the resulting
      # CapEff/CapBnd of the master and of a worker.
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    logging: *vault-logging

  # ===========================================================================
  # vault-api -- control plane + SteamPrefill host. API-key authenticated.
  # ===========================================================================
  vault-api:
    build:
      # Repo ROOT, not ../api (packaging work package, docs/PROJECT_PLAN.md
      # §7 Phase 5, 2026-08-17: user decision -- bake the web UI into the
      # image rather than a mount-only fix, because a mount-only fix cannot
      # survive `docker pull` of a published image, WP 5.5). api/Dockerfile
      # now COPYs web/ in too, and web/ is a repo-root SIBLING of api/, not a
      # child of it -- an api/-only context could never reach it. The root
      # .dockerignore keeps this wider context from also sending app/ (the
      # Android tree), poc/ (Phase-0 evidence) and every other component's
      # own directory to the daemon on every build -- measured 9.734 MB ->
      # 1.54 MB (84% smaller) on the checkout this was built against
      # (.dockerignore has the "Sending build context" numbers). vault-core
      # and vault-dns below are UNCHANGED: each keeps its own directory as
      # build context, unaffected by this.
      context: ..
      dockerfile: api/Dockerfile
    image: ghcr.io/steamhangar/vault-api:${VAULT_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      # Required. No default anywhere in the stack: Compose refuses to start
      # without it, and vault-api itself refuses to boot without it.
      VAULT_API_KEY: ${VAULT_API_KEY:?set VAULT_API_KEY in deploy/.env (see .env.example)}
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL:-INFO}
      # WP SWEEP-1 follow-up (ADR-0014 §"Shipping an enabled nightly
      # schedule"): the scheduler's window (below) is interpreted on the
      # CONTAINER's own local wall clock (vault_api/scheduler.py's
      # `local_now()`), and a container's local time IS its `TZ` -- with none
      # set, that is UTC. Deliberately `UTC`, not a guessed populated zone
      # (e.g. `Europe/Berlin`): this is a public project shipped to operators
      # in every timezone, and a non-UTC guess would be silently wrong for
      # most of them. `UTC` is the one value that is honestly correct for
      # everyone by construction (the offset is always +00:00), at the cost
      # of the shipped 03:00-07:00 window (below) not actually landing at
      # 3 AM local for an operator who never sets this. vault-api logs the
      # resolved offset/zone and the next window opening in both local and
      # UTC time once at startup specifically so a wrong TZ is visible, not
      # silent -- see PrefillScheduler.start()'s own log line and
      # deploy/.env.example's TZ entry for the filled-in example. Measured in
      # the built image (python:3.13.14-slim-trixie ships tzdata): unset ->
      # `date` prints UTC; `TZ=Europe/Berlin` -> correct, DST-aware local
      # time. Also forwarded to vault-runner below, for log-timestamp
      # consistency only (it has no scheduling logic of its own).
      #
      # DELIBERATELY KEPT AS THE COLON FORM (review round 2, R2-B1's
      # decision point, considered and NOT changed): unlike
      # VAULT_SCHEDULE_WINDOW below, an explicitly blank TZ and this
      # variable's own default (UTC) are not two different states -- POSIX
      # `tzset()` treats an empty TZ as UTC too, so `${TZ:-UTC}` substituting
      # the literal string for a blank value changes nothing observable:
      # both paths land on UTC. There is no "blank means something else"
      # claim to protect here the way there was for the window, so the
      # simpler, more common `:-` form stays.
      TZ: ${TZ:-UTC}
      VAULT_PREFILL_TIMEOUT_SECONDS: ${VAULT_PREFILL_TIMEOUT_SECONDS:-14400}
      # WP CORE-FIX-2: SteamPrefill's --max-threads (concurrent chunk
      # requests per prefill, 1..64). Read here only in subprocess mode; the
      # shipped queue mode reads vault-runner's copy below. Same variable and
      # default on both services, like the timeout above. The colon form on
      # purpose: config.py treats blank as unset too, so `:-` and `-` agree.
      VAULT_PREFILL_MAX_THREADS: ${VAULT_PREFILL_MAX_THREADS:-8}
      VAULT_WORKER_POLL_SECONDS: ${VAULT_WORKER_POLL_SECONDS:-1.0}
      # WP S-2 (ADR-0012): the api-side half of the runner split's mode
      # switch. **Deliberately NOT the same default as vault_api/config.py's
      # own built-in one** (that default is 'subprocess', see
      # api/README.md "Queue mode" and DEFAULT_PREFILL_MODE-equivalent
      # constant PREFILL_MODE_SUBPROCESS) -- this compose file SHIPS queue
      # mode, because the vault-runner service a few blocks down only does
      # anything useful once vault-api actually hands work off to it, and
      # because EG-1's whole point (locking vault-api's container to
      # LAN-only egress) only works once every deployment that uses this
      # compose file already runs in queue mode. The bare-metal/native dev
      # path (api/README.md's "Quickstart") has no second process to run a
      # runner in at all, and keeps config.py's own 'subprocess' default by
      # never setting this variable -- that divergence is intentional, not
      # drift, and is pinned by api/tests/test_p1_compose_env_defaults.py's
      # own comment on this key. Must also be set on vault-runner below
      # (identical value): vault-api needs it to know to hand jobs off,
      # vault-runner's Settings loader parses/validates the same variable
      # through the same code path even though prefill_runner.py's own logic
      # never branches on it (Settings.from_env is one loader for every
      # setting, ADR-0012 §2's "one validation path" reasoning) -- a queue
      # hand-off with no runner listening, and a runner with no hand-offs
      # to claim, are both real misconfigurations, which is why the value is
      # required on both sides rather than inferred from one.
      VAULT_PREFILL_MODE: ${VAULT_PREFILL_MODE:-queue}
      # Queue mode only (ADR-0012 §4): how stale vault-runner's lease
      # (jobs.run_heartbeat_at) must be before vault-api's worker gives up
      # waiting on it and fails the job. Consumed ONLY here -- vault-runner
      # itself never reads this value (it writes the heartbeat on its own
      # VAULT_RUNNER_HEARTBEAT_SECONDS cadence below; deciding when a
      # heartbeat counts as stale is vault-api's call to make, the same side
      # that is actually waiting). Default matches config.py's own default
      # byte-for-byte.
      VAULT_RUNNER_LEASE_TIMEOUT_SECONDS: ${VAULT_RUNNER_LEASE_TIMEOUT_SECONDS:-30.0}
      VAULT_SIZE_CACHE_TTL: ${VAULT_SIZE_CACHE_TTL:-60.0}
      VAULT_AGENT_REPORT_KEEP: ${VAULT_AGENT_REPORT_KEEP:-20}
      # WP SWEEP-1 follow-up (ADR-0014 §"Shipping an enabled nightly
      # schedule", operator decision after the S3 review finding: the
      # cached-sweep/auto-GC pairing above needs the scheduler actually
      # RUNNING to mean anything, and no version of this file had ever
      # forwarded a window before). `03:00-07:00` is a SUGGESTED default, not
      # a claim about any particular operator's actual quiet hours -- it is
      # in the container's `TZ` above (UTC unless you set it), so read this
      # together with that variable. An existing deployment that already set
      # its own VAULT_SCHEDULE_WINDOW (env or `PATCH /v1/settings`) is
      # UNCHANGED by this line -- the substitution below only resolves for
      # an UNSET variable.
      #
      # DELIBERATELY THE NO-COLON FORM (review round 2, blocker R2-B1,
      # measured): `${VAR:-default}` (a colon) substitutes the default for
      # BOTH unset AND an explicitly blank value -- measured directly, a
      # `.env` containing `VAULT_SCHEDULE_WINDOW=` still rendered
      # `03:00-07:00` under that form, which made "set it blank to disable"
      # a documented lie: no `.env` expression of "disabled" existed at all.
      # `${VAR-default}` (no colon) only substitutes for UNSET; an
      # explicitly blank value passes through as `""`, which
      # `config.Settings.from_env` already treats as "scheduler disabled" --
      # the config-parsing side of this was always correct, only the
      # Compose-substitution side was wrong. Blank an explicitly-set
      # VAULT_SCHEDULE_WINDOW= to restore the pre-2026-08-22 disabled
      # scheduler. Also still DB-overridable at runtime via
      # `PATCH /v1/settings` (ADR-0009, applies "next_sweep") exactly as
      # before -- this line only changes what an operator who touches
      # neither gets.
      VAULT_SCHEDULE_WINDOW: ${VAULT_SCHEDULE_WINDOW-03:00-07:00}
      # Manifest-based GC (WP 3.8b/3.12, api/README.md "The recently-stored
      # grace window" / "Auto-GC"). Defaults match vault-api's own built-in
      # defaults byte-for-byte -- WP SWEEP-1 (ADR-0014, operator decision
      # 2026-08-22) flipped VAULT_AUTO_GC's OWN default from `off` to
      # `execute`, paired with VAULT_SWEEP_INCLUDE_CACHED below also flipping
      # to `true`, so this line's default changed WITH it, not independently
      # of it -- see docs/adr/0014-sweep-cached-and-auto-gc-default-on.md for
      # the pairing argument and the real upgrade-behaviour-change this is on
      # an existing deployment that never set either variable. Set either
      # line back to its pre-ADR-0014 value (`off` / `false`) to restore the
      # old behaviour.
      VAULT_GC_GRACE_DAYS: ${VAULT_GC_GRACE_DAYS:-14}
      VAULT_AUTO_GC: ${VAULT_AUTO_GC:-execute}
      # WP SWEEP-1 (ADR-0014). Through WP P1 (`da79aca`) this key was
      # DELIBERATELY not forwarded here at all: it is DB-overridable at
      # runtime via `PATCH /v1/settings` (ADR-0009), which was considered the
      # one supported path to change it while its default was the safe `off`
      # value. That reasoning inverted the moment the default became `true`
      # (this ADR): an operator running the documented, supported
      # `VAULT_SETTINGS_READONLY=1` headless/GitOps mode has `PATCH` refused
      # with `403` and, without this line, no way to reach
      # VAULT_SWEEP_INCLUDE_CACHED at all -- a real deployment shape that
      # would have had no way to turn the now-default-on cached sweep back
      # off. Forwarded here for exactly that reason, pinned by
      # tests/test_p1_compose_env_defaults.py the same way every other
      # forwarded key already is; PATCH /v1/settings remains the OTHER
      # supported way to change it once the stack is up (unaffected by this
      # line -- ADR-0009's db > env > default precedence still applies, this
      # is only the ENV half of that chain).
      VAULT_SWEEP_INCLUDE_CACHED: ${VAULT_SWEEP_INCLUDE_CACHED:-true}
      # How many archived manifest .bin files prune_archive keeps PER DEPOT
      # (WP 3.2, api/README.md "Manifest archive"). Default matches
      # config.py's own built-in default byte-for-byte.
      VAULT_MANIFEST_KEEP: ${VAULT_MANIFEST_KEEP:-3}
      # vault-api's READ side of the cache-event log vault-core writes via
      # VAULT_EVENT_LOG above (WP 3.10/3.11, ADR-0008; packaging WP gap
      # closed 2026-08-17 -- this key existed in config.py since WP 3.11 but
      # was never forwarded here, so the miss-triggered prefill completion,
      # per-client hit stats and bypass detection it drives (requirement
      # A12) were unreachable in the shipped stack; see LEARNINGS.md
      # "Containers" for the general shape of this class of bug). Empty
      # (default) keeps the sweeper off even if VAULT_EVENT_LOG is set on
      # vault-core -- both variables must name the SAME path under the
      # shared /vault volume both services already mount, see .env.example.
      VAULT_EVENT_LOG_PATH: ${VAULT_EVENT_LOG_PATH:-}
      # The rest of the WP 3.11 event-sweep tuning knobs -- same audit finding
      # as VAULT_EVENT_LOG_PATH above (present in config.py, never forwarded
      # here before the packaging WP's B1 fix-round). Defaults match
      # config.py's own built-in defaults byte-for-byte; see .env.example for
      # what each one actually does.
      VAULT_EVENT_SWEEP_INTERVAL_MINUTES: ${VAULT_EVENT_SWEEP_INTERVAL_MINUTES:-5}
      VAULT_MISS_TRIGGER_COOLDOWN_MINUTES: ${VAULT_MISS_TRIGGER_COOLDOWN_MINUTES:-60}
      VAULT_MISS_TRIGGER_MAX_PER_SWEEP: ${VAULT_MISS_TRIGGER_MAX_PER_SWEEP:-5}
      VAULT_BYPASS_WINDOW_DAYS: ${VAULT_BYPASS_WINDOW_DAYS:-3}
      VAULT_CLIENT_STATS_KEEP: ${VAULT_CLIENT_STATS_KEEP:-48}
      # Truncate the event log past this size (api/README.md "Rotation --
      # best-effort..."). In the shipped containers rotation works: since WP
      # SEC-FIX-5 /vault/logs is root-only but event.log itself is 101:101,
      # and vault-api (uid 101) truncates it in place (verify-stack checks
      # the write-open). Where a deployment denies it, every sweep past this
      # size warns and increments truncate_denied_count -- setting this to 0
      # (disables truncation attempts entirely) is the documented way to
      # silence that and rotate externally instead. Default matches
      # config.py's own built-in default byte-for-byte (64 MiB).
      VAULT_EVENT_LOG_MAX_BYTES: ${VAULT_EVENT_LOG_MAX_BYTES:-67108864}
      # Opt-in manifest oracle (WP 3.9, ADR-0007 addendum B). Empty/off by
      # default -- see .env.example for the privacy note (queries leave the
      # LAN) before setting this. Same forwarding gap as above until the
      # packaging WP: present in config.py, never wired through here.
      VAULT_MANIFEST_ORACLE: ${VAULT_MANIFEST_ORACLE:-}
      # The oracle's URL and per-request timeout -- forwarding these is NOT
      # optional once VAULT_MANIFEST_ORACLE is on: .env.example's privacy note
      # tells operators to point VAULT_MANIFEST_ORACLE_URL at their own
      # private mirror/proxy instead of the public default, and that advice
      # is a no-op without this line (B1 reviewer finding -- the exact
      # "advertised but unreachable" bug this audit exists to close).
      # Defaults match config.py's own built-in defaults byte-for-byte.
      VAULT_MANIFEST_ORACLE_URL: ${VAULT_MANIFEST_ORACLE_URL:-https://api.steamcmd.net/v1/info}
      VAULT_MANIFEST_ORACLE_TIMEOUT: ${VAULT_MANIFEST_ORACLE_TIMEOUT:-10.0}
      # Per-attempt delivery timeout for the webhook feature (WP 3.13). Unlike
      # VAULT_WEBHOOK_URL/VAULT_WEBHOOK_EVENTS (DB-overridable at runtime via
      # PATCH /v1/settings, ADR-0009 -- see settings_store.OVERRIDABLE_SPECS),
      # this one has no DB-backed path, so env forwarding is the ONLY way to
      # reach it. Default matches config.py's own built-in default
      # byte-for-byte.
      VAULT_WEBHOOK_TIMEOUT_SECONDS: ${VAULT_WEBHOOK_TIMEOUT_SECONDS:-5.0}
      # WP 4h.0 (ADR-0010): the privacy gate for the Steam relay's
      # playtime_forever / rtime_last_played fields (api/README.md "Steam
      # Web API relay"). Env-only, on purpose and UNLIKE VAULT_AUTO_GC/
      # VAULT_SWEEP_INCLUDE_CACHED above (which ARE DB-overridable): the
      # settings table lives in the vault-db volume below, and a setting
      # whose only failure mode is "silently resumes collecting personal
      # data after the volume is lost" cannot be backed by that volume
      # (docs/adr/0010-*.md has the full argument). Forwarded HERE, not left
      # to a compose.override.yaml recipe, because this project has three
      # times now shipped a README sentence telling an operator to set a
      # variable that the stack never actually forwarded
      # (docs/LEARNINGS.md "Containers") -- see
      # tests/test_p1_compose_env_defaults.py, which fails if either line
      # below is ever removed. Off by default (config.py's
      # DEFAULT_RELAY_EXPOSE_PLAYTIME/_LAST_PLAYED) -- turning either on
      # requires editing this file (or deploy/.env) and restarting the
      # container; there is no runtime switch.
      VAULT_RELAY_EXPOSE_PLAYTIME: ${VAULT_RELAY_EXPOSE_PLAYTIME:-false}
      VAULT_RELAY_EXPOSE_LAST_PLAYED: ${VAULT_RELAY_EXPOSE_LAST_PLAYED:-false}
      # Settings-API operator hard-lock (ADR-0009 decision 3; api/README.md
      # "The operator hard-lock"). Env-only BY DEFINITION: a lock on the
      # settings-write API can never be unlockable through that same API
      # (ADR-0009 decision 3), so env forwarding is the ONLY path that
      # reaches it at all. A shipped compose file that omitted this line
      # could never actually enable the hard-lock api/README.md documents as
      # a supported headless/GitOps deployment mode -- see
      # tests/test_p1_compose_env_defaults.py, which fails if this line is
      # ever removed. Off (read-write) by default, matching config.py's own
      # default.
      VAULT_SETTINGS_READONLY: ${VAULT_SETTINGS_READONLY:-false}
      # The five remaining settings-API keys (settings_store.OVERRIDABLE_SPECS:
      # vault_name, schedule_interval_minutes, schedule_client_stale_days,
      # webhook_url, webhook_events). Through the pre-freeze review these
      # were DELIBERATELY not forwarded here, on the reasoning that PATCH
      # /v1/settings (ADR-0009) is the supported way to set them. That
      # reasoning has the same hole ADR-0014 already closed for
      # VAULT_SWEEP_INCLUDE_CACHED and VAULT_SCHEDULE_WINDOW above: under
      # VAULT_SETTINGS_READONLY=1 every PATCH is refused with 403, and with
      # no line here the five keys were unreachable in the shipped stack --
      # a headless/GitOps deployment could never name its vault, tune the
      # sweep cadence, or configure a webhook at all (pre-freeze project
      # review, finding S3). PATCH /v1/settings remains the OTHER supported
      # way to change them once the stack is up (db > env > default, ADR-0009
      # -- this is only the ENV half of that chain).
      #
      # NO-COLON FORM WITH AN EMPTY DEFAULT, on purpose: none of the five has
      # a compose-side default to hand-copy. Unset or blank both reach
      # vault-api as "" and config.Settings.from_env then applies its OWN
      # built-in default (DEFAULT_SCHEDULE_INTERVAL_MINUTES /
      # DEFAULT_SCHEDULE_CLIENT_STALE_DAYS for the two integers; "no name",
      # "no webhook", "all events" for the three strings) -- one source of
      # truth, nothing here to drift. The no-colon form is chosen so a
      # future edit that DOES add a default here cannot silently reintroduce
      # the R2-B1 trap documented on VAULT_SCHEDULE_WINDOW above (a blank
      # .env value must never become that default). Pinned structurally by
      # tests/test_p1_compose_env_defaults.py.
      VAULT_NAME: ${VAULT_NAME-}
      VAULT_SCHEDULE_INTERVAL_MINUTES: ${VAULT_SCHEDULE_INTERVAL_MINUTES-}
      VAULT_SCHEDULE_CLIENT_STALE_DAYS: ${VAULT_SCHEDULE_CLIENT_STALE_DAYS-}
      VAULT_WEBHOOK_URL: ${VAULT_WEBHOOK_URL-}
      VAULT_WEBHOOK_EVENTS: ${VAULT_WEBHOOK_EVENTS-}
      # WP API-FEAT-1: the library SteamID64 (settings key
      # steam_library_steamid). Same reasoning and same no-colon, empty-
      # default form as the five keys above: unset or blank = not set.
      VAULT_STEAM_LIBRARY_STEAMID: ${VAULT_STEAM_LIBRARY_STEAMID-}
      # --- WP EG-1 (ADR-0011): the egress lock. See the big banner comment
      # above the top-level `networks:` block for the full mechanism; these
      # four lines are that mechanism's vault-api-side half. ---
      #
      # vault-api's own outbound-HTTP code (steam_relay.py, oracle.py,
      # webhooks.py) makes ZERO code changes for this: all three build their
      # urllib opener from `urllib.request.build_opener(SomeRedirectHandler)`
      # or call `urllib.request.urlopen` directly, neither of which
      # overrides the DEFAULT `ProxyHandler` build_opener always adds --
      # that handler reads exactly these two variables (verified, WP EG-1).
      HTTP_PROXY: http://vault-proxy:8888
      HTTPS_PROXY: http://vault-proxy:8888
      # ONLY loopback -- not operator-configurable, and NOT a place to list
      # LAN webhook receivers "to skip the proxy for local traffic": measured
      # (WP EG-1) that vault-api's own network (`vault-lan`, no masquerade)
      # has no working direct route to an ARBITRARY WAN or other-LAN-device
      # address once attached the way this file attaches it, because Docker's
      # masquerade rule is a blanket "leaving this bridge" rule with no
      # destination-based exception. TWO narrow, named exceptions remain and
      # are documented as accepted open channels (ADR-0011 "does not defend
      # against", .env.example, deploy/README.md "Two channels this does NOT
      # close"): the DOCKER HOST's own address (replies need no masquerade,
      # so host-bound listeners incl. published ports stay reachable) and DNS
      # resolution (Docker's resolver forwards from the host namespace).
      # Neither is a reason to list a webhook host here: adding a LAN host to
      # NO_PROXY would not make it reachable directly, it would only stop it
      # being reachable through the proxy too -- see deploy/README.md
      # "verify in five minutes" for the measurement and the full argument,
      # and its own note on what this means for the webhook feature
      # specifically ("if your webhook stops firing after this update, that
      # is the lock working" -- add its host to VAULT_EGRESS_ALLOW instead).
      #
      # 127.0.0.1/localhost ARE excluded, and this is not the same class of
      # exception as a LAN host would be: a request to 127.0.0.1 can only
      # ever reach a listener inside THIS SAME container's own network
      # namespace, never anything vault-egress/vault-lan would otherwise
      # block -- excluding it costs nothing security-wise. It is also not
      # optional in practice: measured directly (WP EG-1) -- api/Dockerfile's
      # own HEALTHCHECK (`urlopen('http://127.0.0.1:8080/v1/health')`) is
      # itself a plain urllib call from inside vault-api, and with NO_PROXY
      # empty it was ALSO routed through HTTP_PROXY -- tinyproxy correctly
      # filtered "127.0.0.1" as an un-allowlisted host (403 Filtered), which
      # made the container FAIL ITS OWN HEALTHCHECK forever
      # ("FailingStreak" climbing, `docker inspect`'s Health.Log showing the
      # 403 verbatim) -- not a hypothetical, this is what a first, naive
      # `NO_PROXY: ""` actually did the first time this was run end to end
      # against a real container.
      NO_PROXY: "127.0.0.1,localhost"
      # The proxy's own allowlist of extra hosts, forwarded here too (not
      # only to vault-proxy below) so vault_api/config.py's own startup
      # check can cross-reference it against VAULT_MANIFEST_ORACLE: turning
      # the oracle on with its host missing from this list refuses to boot,
      # rather than booting clean and then failing every oracle query with a
      # filtered-403 forever. Empty by default -- the lock ships default-on
      # with an empty allowlist, not a wide-open one (the two documented,
      # real cases needing an entry are the manifest oracle's host, and any
      # webhook receiver -- deploy/.env.example has the full explanation).
      VAULT_EGRESS_ALLOW: ${VAULT_EGRESS_ALLOW:-}
      # VAULT_DB_PATH, VAULT_CACHE_ROOT, VAULT_STEAMPREFILL_PATH and
      # VAULT_WEB_DIR are baked into the image (they describe the image's own
      # layout, not a deployment choice) -- see api/Dockerfile. Every
      # settings-API key (ADR-0009) is now forwarded above: VAULT_SCHEDULE_
      # WINDOW near VAULT_GC_GRACE_DAYS/VAULT_AUTO_GC (ADR-0014 §"Shipping an
      # enabled nightly schedule"), the other five directly under
      # VAULT_SETTINGS_READONLY (pre-freeze review finding S3) -- the
      # "PATCH /v1/settings is the supported path, so no .env line" reasoning
      # that used to keep them out of this file does not survive
      # VAULT_SETTINGS_READONLY=1, see the comment there.
      # VAULT_MANIFEST_ARCHIVE_DIR and VAULT_STEAMPREFILL_CACHE_DIR are
      # genuine path overrides tied to volume layout, not general-purpose
      # tuning knobs -- left env-only and documented via the
      # compose.override.yaml recipe in deploy/examples/tuned-setup.md
      # rather than a bare .env line, because a wrong value here silently
      # loses persistence with no volume backing it, unlike the numeric
      # knobs above where a wrong value at worst picks a different (still
      # valid) number.
    ports:
      # LAN-only, like everything else here. This is the interface the Android
      # app and vault-agent talk to. For access from outside the LAN do NOT
      # port-forward this: put it on Tailscale/Twingate, or behind your own
      # TLS reverse proxy with forward-auth on top of the API key
      # (docs/PROJECT_PLAN.md §10 "Remote access").
      - "${VAULT_API_BIND:-0.0.0.0}:${VAULT_API_PORT:-8080}:8080"
    volumes:
      # The same cache volume vault-core writes: vault-api reads it for per-game
      # sizes and deletes depot directories from it. Both containers use uid 101
      # so this works without loosening permissions.
      #
      # Same VAULT_CACHE_PATH source as vault-core above -- see the comment
      # there. Both services must agree on named-volume vs. bind-mount and on the
      # exact path; the only deliberate difference is the `nocopy` option
      # explained below, which this line carries in named-volume mode only.
      #
      # This is ALSO where the cache-event log lives when VAULT_EVENT_LOG is
      # set on vault-core above: core/Dockerfile pre-creates /vault/logs/
      # inside this same one volume, next to cache/ and tmp/. Because this
      # line already mounts the identical /vault volume into vault-api, no
      # additional volume or mount is needed for vault-api to read
      # /vault/logs/event.log -- WP 3.11's sweeper (this service's
      # VAULT_EVENT_LOG_PATH env var above) reads it straight off this same
      # mount. Deliberately not narrowed to a read-only logs/-only bind
      # here: WP 3.11 owns the cursor/truncation contract (core/README.md
      # "Rotation and the USR1 contract") and decided its own access shape
      # (read, never truncate) rather than one imposed by the mount.
      #
      # `nocopy`, named-volume mode: both images carry /vault/cache/depot and
      # /vault/tmp, and Docker copies image content into an EMPTY named volume
      # when a container is created with it. Compose creates vault-core and
      # vault-api concurrently, so on a fresh volume both copied at once and
      # one create failed with "mkdir .../_data/tmp: file exists" (observed in
      # a verify run). With nocopy, vault-core is the only seeder (layout and
      # ownership -- root:root 0755 with only cache/depot 101:101 since WP
      # SEC-FIX-5 -- come from core/Dockerfile), whatever the creation
      # order: Docker seeds only an empty volume, and a nocopy mount leaves it
      # empty. vault-api needs nothing under /vault at boot (VAULT_CACHE_ROOT
      # is read per request).
      #
      # Bind-mount mode (VAULT_CACHE_PATH set): there is no copy-up for a
      # bind, and the option must be ABSENT, not ignored. Docker 28.3 /
      # Compose 2.38 pass this short-syntax string to the daemon as a legacy
      # bind, which refuses "/path:/vault:rw,nocopy" with 'invalid mount
      # config for type "bind": field VolumeOptions must not be specified'
      # (WP DEPLOY-FIX-3, found by a real rollout).
      #
      # How one line does both, with only the two operators every Compose v2
      # release and POSIX sh agree on (no nesting):
      #   unset/blank: ${..:-vault-cache:/vault:nocopy} -> the whole default,
      #                ${..:+:/vault}                    -> ""
      #                = "vault-cache:/vault:nocopy" (unchanged from before)
      #   set to P:    ${..:-...}                        -> "P",
      #                ${..:+:/vault}                    -> ":/vault"
      #                = "P:/vault" (a plain bind, no options)
      # api/tests/test_compose_volume_race.py renders both modes statically;
      # deploy/tests/verify-stack.sh 3p (Docker-rendered) and 9 (live bind)
      # prove them against a real daemon.
      - ${VAULT_CACHE_PATH:-vault-cache:/vault:nocopy}${VAULT_CACHE_PATH:+:/vault}
      # SQLite database (mapping, jobs, agent reports). Small; back this up.
      - vault-db:/data
      # SteamPrefill's Config/ (the Steam SESSION) is NOT mounted here anymore
      # as of WP S-2 (ADR-0012 §5) -- it moved to the vault-runner service
      # below. Evidence, not assumption: in VAULT_PREFILL_MODE=queue (this
      # file's shipped default), PrefillWorker._run_prefill_via_queue calls
      # only jobs.handoff_run + prefill_queue.await_run_result
      # (vault_api/worker.py) -- neither touches prefill.run_prefill,
      # prefill.resolve_executable, or anything under Config/; the ONLY
      # caller of resolve_executable/run_prefill left in queue mode is
      # vault_api/prefill_runner.py, running in the OTHER container. So
      # vault-api genuinely has no remaining use for VAULT_STEAMPREFILL_PATH
      # or a Config/ mount once queue mode is the shipped default -- keeping
      # the credential-bearing volume here too would just be a second copy
      # of a Steam session with no reader, which is a strictly worse
      # posture for EG-1's upcoming egress lock to inherit than not having
      # it at all. (settings_store.py's EnvOnlySpec("steamprefill_path", ...)
      # still reflects the env value through GET/PATCH /v1/settings for
      # operator visibility -- that is a string round-trip, not filesystem
      # access, and needs no volume.)
      #
      # HOME for the container user IS still mounted here, and this is new
      # reasoning as of WP S-2, not a leftover: SteamPrefill's own manifest
      # temp-cache directory (VAULT_STEAMPREFILL_CACHE_DIR, WP 3.2) defaults
      # to a path UNDER HOME (config._default_steamprefill_cache_dir --
      # "$HOME/.cache/SteamPrefill/v1" on Linux), and manifest ingestion
      # (vault_api/manifest_ingest.py's ingest_after_prefill, called from
      # worker.py's _finalize_prefill_result) stays vault-api-side even in
      # queue mode (ADR-0012 §1: only the run_prefill CALL moves). SteamPrefill
      # now WRITES those .bin files from inside vault-runner's container, so
      # vault-api can only read them back if this volume is the SAME one
      # mounted at the SAME path in both containers -- exactly the
      # filesystem-equivalence argument ADR-0012 §3 already makes for the
      # shared SQLite file, applied here to a plain file read instead of a
      # WAL-mode database. Dropping this mount from EITHER service silently
      # breaks manifest ingestion for every queue-mode prefill from then on
      # (manifest_ingest.py's own cache_dir_unavailable path: "not found or
      # unreadable... Not an error" -- it warns into the job log and moves
      # on, it does not fail the job, which is exactly why this is easy to
      # miss without the check verify-stack.sh now has for it). Also still
      # NOT optional plumbing for the reason WP 1.9 found originally:
      # SteamPrefill's AppConfig static constructor creates a directory under
      # HOME before it parses a single argument, so an unwritable HOME kills
      # every SteamPrefill invocation with a TypeInitializationException
      # (that binary now runs in vault-runner, but the same fact applies
      # there -- see this same volume on that service below).
      - vault-steamprefill-home:/opt/steamprefill/home
    networks:
      # WP EG-1 (ADR-0011). See the banner comment above the top-level
      # `networks:` block for the full mechanism -- in short, `default` is
      # DELIBERATELY ABSENT from this list: vault-api never talks to
      # vault-core, vault-runner or vault-dns over the network at all (every
      # cross-container fact it needs comes from a shared VOLUME --
      # vault-core's event log, the sqlite jobs table -- never a socket), so
      # dropping `default` costs it nothing and is exactly what makes the
      # lock real rather than cosmetic.
      - vault-lan
      - vault-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      # Runs as uid 101 on an unprivileged port and touches nothing but its own
      # volumes -- it needs no Linux capabilities at all.
      - ALL
    logging: *vault-logging

  # ===========================================================================
  # vault-runner -- the SteamPrefill runner (WP S-2, ADR-0012). Broad Steam
  # CM/CDN egress lives HERE now, not in vault-api, so EG-1 can later lock
  # vault-api's own container to LAN-only without breaking prefill. Same
  # image, same codebase as vault-api (`python -m vault_api.prefill_runner`
  # is a second entrypoint into it, api/vault_api/prefill_runner.py) --
  # deliberately no separate `build:` block: vault-api's build above already
  # produces this exact image tag, and this service just runs it with a
  # different CMD. No ports: this process never serves HTTP, never
  # authenticates a request, and has no legitimate use for VAULT_API_KEY
  # (api/README.md "Queue mode": Settings.from_env(require_api_key=False) --
  # see api/vault_api/config.py's docstring on that parameter for the full
  # argument). Started unconditionally, like every other service here: it is
  # a genuine no-op, idling on its poll loop, on an install that still has
  # VAULT_PREFILL_MODE=subprocess on the vault-api side above (nothing is
  # ever handed off for it to claim in that mode) -- see
  # vault_api/prefill_runner.py's own module docstring.
  # ===========================================================================
  vault-runner:
    image: ghcr.io/steamhangar/vault-api:${VAULT_IMAGE_TAG:-0.1.0}
    command: ["python", "-m", "vault_api.prefill_runner"]
    restart: unless-stopped
    # A stable, project-scoped name for the one documented interactive step
    # that targets this container directly (deploy/README.md "First run":
    # `docker exec` into it for the one-time SteamPrefill login,
    # ADR-0012 §5). Deliberately NOT a bare "vault-runner" literal:
    # ${COMPOSE_PROJECT_NAME} is how Compose exposes the ALREADY-RESOLVED
    # project name (the `name: steamhangar` key at the top of this file, or
    # whatever `-p`/COMPOSE_PROJECT_NAME overrides it to) back into this
    # file's own variable interpolation -- confirmed empirically with
    # `docker compose config` both with no override (renders
    # "steamhangar-vault-runner") and with `-p steamhangar-verify` (renders
    # "steamhangar-verify-vault-runner"). A literal container_name would
    # collide across two Compose projects on the same host, which is exactly
    # the isolation deploy/tests/verify-stack.sh's own header comment
    # promises ("uses its own Compose project name ... so it can never touch
    # a real deployment's containers or volumes") -- container_name is a
    # HOST-global namespace, unlike the project-scoped names Compose picks
    # on its own for every service that (like the other three in this file)
    # has no explicit container_name, so a real deployment and a verify run
    # on the same host would otherwise fight over one literal name.
    container_name: ${COMPOSE_PROJECT_NAME:-steamhangar}-vault-runner
    # Empirically found running this package (not a hypothetical): on a
    # genuinely FRESH `vault-db` volume, vault-api's schema creation
    # (vault_api/db.py's init_db, called from create_app() BEFORE uvicorn
    # ever binds its port -- so /v1/health can only ever succeed once it has
    # already run) races vault-runner's first poll tick. Observed directly,
    # real containers, real fresh volume: vault-runner's first `claim_run`
    # hit `sqlite3.OperationalError: no such table: jobs`, crashed (uncaught
    # -- this is not a retry loop), and only came up clean on Docker's
    # `restart: unless-stopped` retry a moment later, once vault-api had
    # caught up. Self-healing, but a needless crash-and-alarming-traceback
    # on every first-ever start otherwise. `condition: service_healthy`
    # removes the race entirely rather than papering over it with a fixed
    # delay: vault-api's healthcheck cannot report healthy before init_db
    # has already completed, by construction, so this is a real ordering
    # guarantee, not a timing guess.
    depends_on:
      vault-api:
        condition: service_healthy
    environment:
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL:-INFO}
      # WP SWEEP-1 follow-up. NOT because this container has any scheduling
      # logic of its own -- it does not; the window is evaluated entirely on
      # vault-api's side (ADR-0012 §1: prefill_runner.py never reads
      # VAULT_SCHEDULE_WINDOW or anything scheduler-shaped). Forwarded here
      # purely so this container's own log timestamps agree with vault-api's
      # when an operator is reading both side by side (e.g. correlating a
      # scheduled sweep's enqueue on vault-api with the SteamPrefill run it
      # produced here) -- same value, same default, for the same reason
      # VAULT_PREFILL_MODE/VAULT_PREFILL_TIMEOUT_SECONDS above are kept in
      # sync across both services even though only one side's code branches
      # on them.
      TZ: ${TZ:-UTC}
      # See the long comment on this same key over on vault-api above --
      # this is the identical variable, required on BOTH services. Settings
      # here does not need require_api_key, but it does go through the same
      # strict-enum validation as vault-api's copy (config.py's single
      # Settings.from_env loader, ADR-0012 §2).
      VAULT_PREFILL_MODE: ${VAULT_PREFILL_MODE:-queue}
      # Consumed directly by prefill_runner.py's _execute -> prefill.run_prefill
      # (the timeout that used to apply to vault-api's OWN subprocess call now
      # applies to this container's). Same variable, same default, as
      # vault-api's copy above -- both need to agree with each other, since an
      # operator tuning one without the other would get a confusing mismatch
      # between "the worker's queue-mode wait" (bounded by
      # VAULT_RUNNER_LEASE_TIMEOUT_SECONDS on vault-api, not this) and "how
      # long SteamPrefill itself is allowed to run" (this one, here).
      VAULT_PREFILL_TIMEOUT_SECONDS: ${VAULT_PREFILL_TIMEOUT_SECONDS:-14400}
      # WP CORE-FIX-2: SteamPrefill's --max-threads, consumed by
      # prefill_runner.py's _execute -> prefill.run_prefill. The default 8
      # keeps a prefill from exhausting a carrier-grade NAT's port mappings
      # (DS-Lite: "113: Host is unreachable" in vault-core's log, see
      # deploy/README.md "Troubleshooting"). Same variable and default as
      # vault-api's copy above.
      VAULT_PREFILL_MAX_THREADS: ${VAULT_PREFILL_MAX_THREADS:-8}
      # Queue mode only. How often this process refreshes its lease
      # (jobs.run_heartbeat_at) while a job is running, piggybacked on
      # prefill.run_prefill's existing 0.2s subprocess poll tick and
      # throttled to this interval (prefill_runner.py's
      # stop_request_with_heartbeat). vault-api's copy of the RELATED
      # staleness margin (VAULT_RUNNER_LEASE_TIMEOUT_SECONDS) lives on the
      # vault-api service above, not here -- see that key's own comment for
      # why deciding staleness is the waiting side's job, not the heartbeat
      # writer's. Default matches config.py's own default byte-for-byte.
      VAULT_RUNNER_HEARTBEAT_SECONDS: ${VAULT_RUNNER_HEARTBEAT_SECONDS:-5.0}
      # How often this process polls the jobs table for a hand-off to claim
      # when idle. Runner-only by design (api/README.md "Queue mode":
      # vault-api's worker reuses VAULT_WORKER_POLL_SECONDS for its OWN
      # wait-on-hand-off loop instead of this variable) -- setting this on
      # vault-api above would be silently ignored, so it is deliberately not
      # duplicated there. Default matches config.py's own default
      # byte-for-byte.
      VAULT_RUNNER_POLL_SECONDS: ${VAULT_RUNNER_POLL_SECONDS:-1.0}
      # Deliberately NOT forwarded here: VAULT_API_KEY (this process never
      # serves HTTP or authenticates anything -- see the section header
      # comment above and Settings.from_env's require_api_key=False). Also
      # deliberately NOT forwarded: VAULT_WORKER_POLL_SECONDS,
      # VAULT_RUNNER_LEASE_TIMEOUT_SECONDS and every setting below the
      # prefill/queue-mode ones on vault-api's block above (size cache,
      # agent reports, manifest archive/GC tuning, scheduler, auto-GC,
      # cache-event sweep, webhooks, the Steam relay privacy gate, the
      # settings-API hard-lock) -- none of them are read by
      # vault_api/prefill_runner.py, which imports nothing from worker.py
      # and touches none of that job-lifecycle logic (ADR-0012 §1).
      # VAULT_DB_PATH, VAULT_CACHE_ROOT, VAULT_STEAMPREFILL_PATH and
      # VAULT_WEB_DIR are baked into the image exactly as they are for
      # vault-api (see api/Dockerfile) -- same reasoning as vault-api's own
      # comment on this: they describe the image's own layout, not a
      # per-deployment choice, and this service uses the identical image.
      # (VAULT_CACHE_ROOT is still parsed and non-blank-validated by
      # Settings.from_env here even though prefill_runner.py's own logic
      # never reads settings.cache_root -- one validation path for every
      # setting, ADR-0012 §2 -- but the baked image default already
      # satisfies that check with no compose-level override needed.)
    volumes:
      # Deliberately NOT mounted here (review round 2, should-fix S3):
      # ${VAULT_CACHE_PATH:-vault-cache}:/vault, the depot cache vault-core
      # and vault-api share, is intentionally ABSENT from vault-runner.
      # Evidence check run for this package, stated plainly: neither
      # prefill_runner.py nor prefill.py's run_prefill reads
      # VAULT_CACHE_ROOT or touches anything under it directly --
      # SteamPrefill talks to vault-core over HTTP, and scanning depot
      # signatures before/after a run (prefill.scan_depots) is worker.py's
      # job, staying vault-api-side in every mode -- so this container has
      # no FUNCTIONAL need for it. An earlier draft of this file mounted it
      # anyway "for consistency" and called that harmless; that argument
      # only weighed ownership (uid 101 agrees on both sides regardless),
      # never BLAST RADIUS -- and blast radius is the one property that
      # actually matters here, once EG-1 locks this container to broad
      # Steam CM/CDN egress (the entire reason the runner split exists,
      # ADR-0012). A read-write mount of the ENTIRE served cache inside the
      # one deliberately broad-egress container turns a SteamPrefill-side
      # compromise into cache poisoning of everything this LAN downloads --
      # a strictly worse posture than the diagnostic convenience
      # (`docker exec vault-runner ls /vault/cache`) it bought. Use
      # `docker exec vault-api ...` for that instead; vault-api still has
      # this mount and always will (it is the one that deletes from and
      # sizes the cache, plan §3/§4).
      # jobs.claim_run / record_run_heartbeat / record_run_result all write
      # here (vault_api/prefill_runner.py's whole reason for existing) --
      # the SAME sqlite file vault-api's worker reads/writes, verified as a
      # genuine two-real-process WAL race in
      # api/tests/test_sqlite_wal_multiprocess.py (ADR-0012 §3).
      - vault-db:/data
      # SteamPrefill's Config/ -- the Steam SESSION now lives HERE, not on
      # vault-api (ADR-0012 §5, moved from that service above this WP).
      # Treat it as sensitive: it is a logged-in Steam session, and this is
      # now the ONE container that holds it. vault-api itself still never
      # sees or stores Steam credentials either way (ADR-0004) -- nothing
      # about that guarantee changes, only which container the already-
      # authenticated CLI's own session directory lives in.
      - vault-steamprefill:/opt/steamprefill/Config
      # HOME for this container's uid 101, and now SHARED with vault-api
      # (same volume, same path, mounted on vault-api above too) -- see the
      # long comment on vault-api's copy of this line for why: SteamPrefill
      # (running HERE now) writes its manifest temp-cache under this
      # directory, and vault-api's manifest-ingestion step (which stays
      # vault-api-side, ADR-0012 §1) can only read those files back if both
      # containers agree on the same underlying volume. Still also the
      # WP 1.9 HOME-must-be-real-and-writable requirement unchanged by the
      # split: SteamPrefill's AppConfig static constructor throws before
      # parsing a single argument if HOME is not writable, and that binary
      # runs HERE now.
      - vault-steamprefill-home:/opt/steamprefill/home
    security_opt:
      - no-new-privileges:true
    cap_drop:
      # Same posture as vault-api: runs as uid 101, needs no Linux
      # capability to do its job. EG-1 (not this package) is what actually
      # restricts this container's NETWORK egress -- this is the orthogonal,
      # already-uncontroversial half of "runs with the least it needs".
      - ALL
    # Bounded time to shut down cleanly on SIGTERM (docker compose stop /
    # down, or a restart), reviewed here because ADR-0012 §4's own nitpick
    # asks for it explicitly: an orphaned SteamPrefill behind a stopped
    # runner is only bounded by CONTAINER lifecycle, so that lifecycle must
    # actually give the in-process shutdown path time to run rather than
    # racing it. prefill_runner.py's main() already installs a SIGTERM
    # handler (signal.signal(signal.SIGTERM, _handle_signal) -> runner.stop()
    # -> the run_forever loop's threading.Event) -- this is not a "no
    # handler exists" gap. The worst-case teardown budget it needs, added up
    # from prefill.py's own constants: up to _POLL_INTERVAL_SECONDS (0.2s)
    # before the current wait tick notices should_abort() is True, then
    # _stop_process()'s terminate()-wait-kill-wait sequence, each half
    # bounded by _TERMINATE_GRACE_SECONDS (5.0s) -- 0.2 + 5.0 + 5.0 = 10.2s
    # worst case before the child is reaped and record_run_result can write.
    # Docker Compose's own default stop_grace_period is 10s, which does not
    # comfortably clear that budget (a slow WAL fsync or a loaded host could
    # push the real number past it), so a SIGKILL could arrive mid-teardown
    # and turn a clean "aborted" result into a hard kill with nothing
    # recorded. 20s gives roughly 2x the computed worst case.
    # Not covered by that budget: with a LOCKED database each result-write
    # attempt can block for the full busy_timeout (5s per attempt), so
    # prefill_runner._record_result's retries can outlast the 20s grace. The
    # SIGKILL then has the same outcome as the runner giving up on its own
    # (no result stored, lease expires, job failed as runner_lost).
    stop_grace_period: 20s
    # The image's baked HEALTHCHECK (api/Dockerfile) probes
    # http://127.0.0.1:8080/v1/health -- this process never listens on that
    # port or serves HTTP at all, so inheriting it unmodified would make
    # `docker compose ps` show this container permanently unhealthy despite
    # working correctly, which is worse than no healthcheck (a real failure
    # would be indistinguishable from this expected-false-positive noise).
    # Liveness for this service is proven differently -- by its own poll-tick
    # log line (see deploy/tests/verify-stack.sh's smoke check) -- rather
    # than by a probe with nothing meaningful to ask over HTTP.
    healthcheck:
      disable: true
    logging: *vault-logging

  # ===========================================================================
  # vault-proxy -- the egress-lock allowlist proxy (WP EG-1, ADR-0011). See
  # the big banner comment above the top-level `networks:` block for the
  # full mechanism this service is one half of; deploy/proxy/Dockerfile,
  # tinyproxy.conf and docker-entrypoint.sh have the implementation detail.
  # Started unconditionally, like every other service here (no profile, no
  # lock-toggle env -- the operator's decision, ADR-0011: default-on, not an
  # opt-in profile).
  # ===========================================================================
  vault-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: ghcr.io/steamhangar/vault-proxy:${VAULT_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      # The ONLY operator-facing knob this service has. Rendered into a
      # tinyproxy filter file at container start (docker-entrypoint.sh) --
      # see that script's own comment for the one host baked in ahead of
      # this value, and deploy/.env.example for the two real cases that
      # need an entry here (the manifest oracle's host, webhook receivers).
      # Same variable, same value, as vault-api's copy above -- vault-api
      # cross-checks it against VAULT_MANIFEST_ORACLE at its own boot
      # (vault_api/config.py), which is a reason for that copy to exist,
      # not a reason this one could be dropped: this is the copy that
      # actually enforces anything.
      VAULT_EGRESS_ALLOW: ${VAULT_EGRESS_ALLOW:-}
      # The vault-egress subnet, with the SAME expression as the top-level
      # `networks:` block's ipam config (WP DEPLOY-FIX-2): the entrypoint
      # renders tinyproxy's client `Allow` line from it, so the proxy always
      # admits exactly the range vault-api actually sits in. Strictly
      # validated as IPv4 CIDR (prefix 8-30) at start; anything else refuses
      # to start. Colon form for the same reason as above.
      VAULT_EGRESS_SUBNET: ${VAULT_EGRESS_SUBNET:-172.30.238.0/24}
    networks:
      # vault-egress: talks to vault-api (the only other container ever on
      # this network -- `internal: true`, see the top-level banner comment).
      # default: its own real route out, for the destinations its filter
      # file actually allows -- an ordinary, masquerading bridge network,
      # unaffected by anything vault-lan/vault-egress restrict.
      - vault-egress
      - default
    # No `ports:` -- this process is reached only from vault-api, over
    # vault-egress, and never needs to be reachable from the LAN or the
    # host at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      # Never runs as root at any point (Dockerfile's `USER tinyproxy`, no
      # privilege-drop dance the way vault-core's nginx has -- tinyproxy's
      # listen port, 8888, is unprivileged) -- there is no capability this
      # process ever legitimately holds.
      - ALL
    logging: *vault-logging

  # ===========================================================================
  # vault-dns -- OPTIONAL. Only for LANs with no existing DNS server.
  #   docker compose --profile dns up -d
  # If you already run AdGuard Home / Pi-hole / dnsmasq / Unbound, use that
  # instead (dns/README.md, "When NOT to use vault-dns") -- one less container
  # and no second thing fighting over port 53.
  # ===========================================================================
  vault-dns:
    profiles: ["dns"]
    build:
      context: ../dns
      dockerfile: Dockerfile
    image: ghcr.io/steamhangar/vault-dns:${VAULT_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      # REQUIRED when this profile is enabled: the LAN IPv4 address of the host
      # running vault-core. No default -- the entrypoint fails fast with an
      # explanation if it is empty. (It is not written as `${CACHE_IP:?...}`
      # because Compose interpolates this whole file for EVERY command, which
      # would make a plain `docker compose up` fail for people who never enable
      # this profile.)
      CACHE_IP: ${CACHE_IP:-}
      UPSTREAM_DNS_1: ${UPSTREAM_DNS_1:-1.1.1.1}
      UPSTREAM_DNS_2: ${UPSTREAM_DNS_2:-8.8.8.8}
    ports:
      # *** OPEN-RESOLVER WARNING -- THE MOST DANGEROUS TWO LINES IN THIS FILE ***
      # vault-dns forwards arbitrary queries upstream and has NO source-address
      # ACL (dns/README.md "Exposure"). Published on a WAN-reachable interface it
      # is an open recursive resolver: a DNS amplification/reflection weapon
      # aimed at third parties, using your bandwidth and your IP's reputation.
      #
      # Publish it on ONE specific LAN address. In production that looks like:
      #
      #     - "192.168.1.50:53:53/udp"
      #     - "192.168.1.50:53:53/tcp"
      #
      # NEVER like this:
      #
      #     - "53:53/udp"            # <-- Docker binds 0.0.0.0: EVERY interface,
      #     - "53:53/tcp"            #     including any WAN-facing one.
      #
      # Set VAULT_DNS_BIND=<your LAN IP> in .env to get the safe form above.
      # The 127.0.0.1 fallback below is intentional: if the variable is unset or
      # empty this fails CLOSED (no client can reach it, you notice immediately)
      # rather than silently publishing to the world.
      - "${VAULT_DNS_BIND:-127.0.0.1}:${VAULT_DNS_PORT:-53}:53/udp"
      - "${VAULT_DNS_BIND:-127.0.0.1}:${VAULT_DNS_PORT:-53}:53/tcp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # dnsmasq binds the privileged port 53 and then drops to the unprivileged
      # 'dnsmasq' account; that is the complete list of what it needs. It is
      # explicitly NOT granted NET_ADMIN (DHCP server duties) -- vault-dns does
      # DNS only.
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    logging: *vault-logging

volumes:
  # This entry stays declared even when VAULT_CACHE_PATH is set: it is what the
  # VAULT_CACHE_PATH-driven /vault mount lines above fall back to by
  # name when the variable is empty. Named volumes (not bind mounts) are the
  # default because Docker creates them with the right ownership for uid 101
  # automatically (the image seeds a fresh one -- see core/Dockerfile). To put
  # the cache on a specific disk (e.g. a dedicated ZFS dataset), set
  # VAULT_CACHE_PATH to that ABSOLUTE host path in deploy/.env instead of
  # editing this file -- see deploy/README.md "Using a dedicated cache mount":
  # you must mkdir + chown the host directory to 101:101 yourself first, and it
  # always covers cache/ AND tmp/ together (one mount point, never split).
  vault-cache:
  vault-db:
  vault-steamprefill:
  vault-steamprefill-home:
