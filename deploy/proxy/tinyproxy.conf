# SteamHangar vault-proxy -- tinyproxy configuration (WP EG-1, ADR-0011).
#
# Together with docker-entrypoint.sh (which renders the Filter file this
# points at) and deploy/compose.yaml's `vault-lan`/`vault-egress` network
# block, this file is the entire mechanism behind the egress lock. Every
# directive below is commented for that reason -- deploy/README.md's "verify
# in five minutes" section walks an operator through checking these claims
# against a real, running container rather than trusting this comment.

# --- identity ----------------------------------------------------------------
# Never actually exercised: the container itself runs as this account from
# the moment it starts (Dockerfile's `USER tinyproxy:tinyproxy`, no root phase
# to drop out of, unlike vault-core's nginx). Left in place anyway so this
# file states its own intended identity rather than relying on the Dockerfile
# alone -- if a future edit ever removed the Dockerfile's USER line, tinyproxy
# would still refuse to run as root silently.
User tinyproxy
Group tinyproxy

# Unprivileged on purpose (>1024): the one reason vault-core's nginx needs a
# root phase at all (binding :80) does not apply here, so this container
# never needs it either.
Port 8888
Listen 0.0.0.0

# Generous but bounded -- a hung upstream (a webhook receiver that accepts
# the TCP connection and then never answers) must not tie up a proxy slot
# forever.
Timeout 600

# Neither LogFile nor Syslog is set below -- tinyproxy's own documented
# fallback ("If neither Syslog nor LogFile are specified, output goes to
# stdout") is what this container relies on, DELIBERATELY, rather than an
# explicit `LogFile "/dev/stdout"` line: measured directly (WP EG-1), tinyproxy
# 1.11.3 refuses to start against that literal path --
# "tinyproxy: The file /dev/stdout has been changed before it could be
# opened" (its own log-file safety check trips on /dev/stdout's symlink
# behaviour inside a container) -- so the explicit line is not merely
# redundant with the default, it is actively wrong here. This container's
# `logging:` block in deploy/compose.yaml is the same json-file driver +
# rotation every other service uses; relying on the stdout default is what
# makes that apply to this service too.
LogLevel Info

PidFile "/run/tinyproxy/tinyproxy.pid"

# This proxy serves exactly one client container (vault-api) making, at most,
# a handful of concurrent outbound calls (the manifest oracle, the Steam Web
# API relay, one webhook delivery at a time -- webhooks.py's own delivery
# thread is single-threaded by design). Tiny pool, deliberately -- a larger
# one buys nothing here. MinSpareServers/MaxSpareServers/StartServers are
# deliberately NOT set: tinyproxy 1.11.3's own stock tinyproxy.conf no longer
# mentions them at all (the prefork-pool model they configured is gone from
# this version) -- setting them anyway produced "WARNING: obsolete config
# item" for each, measured directly against this exact pinned package.
MaxClients 20

# --- who may USE this proxy (the CLIENT allowlist -- not to be confused with
# the DESTINATION allowlist, "Filter", below) -----------------------------
# 127.0.0.1 -- loopback; not used by anything today, kept only so a future
# `docker exec vault-proxy` debugging session can reach the proxy from
# inside its own container without also needing network-level access.
# 172.30.238.0/24 -- the STATIC DEFAULT of vault-egress's subnet
# (deploy/compose.yaml: `${VAULT_EGRESS_SUBNET:-172.30.238.0/24}`, an exact
# subnet, not a guessed RFC1918 range). Since WP DEPLOY-FIX-2 this file is a
# template: docker-entrypoint.sh replaces this one `Allow a.b.c.d/n` line with
# the validated VAULT_EGRESS_SUBNET at every start and refuses to start unless
# the result has exactly this loopback line plus one line equal to that value.
# Keep exactly ONE CIDR-shaped Allow line here, and keep it equal to compose's
# default (api/tests/test_eg1_egress_lock.py pins both). vault-egress is
# declared `internal: true` with exactly two containers ever attached to it
# (vault-api and this one) -- so this line is belt-and-braces, not the only
# thing standing between this proxy and the wider LAN; the network's own
# `internal: true` flag is what actually makes it structurally unreachable
# from anywhere else.
Allow 127.0.0.1
Allow 172.30.238.0/24

# --- WHERE requests may go (the actual egress lock) --------------------------
# docker-entrypoint.sh renders this file (next to the rendered copy of this
# config, in /run/tinyproxy/) at container start from
# VAULT_EGRESS_ALLOW plus one baked-in host (see that script's own comment
# for exactly which, and why it is not gated behind the env var).
Filter "/run/tinyproxy/filter"

# The one directive that makes "Filter" an ALLOWLIST rather than a blocklist:
# without this, an unlisted host would be let through by default and the
# filter file would only be removing hosts, not restricting to them.
FilterDefaultDeny Yes

# Explicit, not relied-on-as-default (tinyproxy defaults to "bre" too, but a
# security-relevant matching mode belongs on this line, not in an unstated
# default a future tinyproxy upgrade could change). Each line the entrypoint
# renders is an ANCHORED, dot-escaped POSIX basic regular expression
# (`^host\.name$`) -- anchoring matters because an unanchored pattern matches
# as a SUBSTRING anywhere in the target, and escaping matters because an
# unescaped "." in a BRE also matches any other single character, which would
# let e.g. "apiXsteampoweredXcom" through a pattern meant to allow only the
# literal "api.steampowered.com".
FilterType bre

# DNS names are case-insensitive (RFC 4343); the rendered filter file's
# patterns are lowercase, and a request naming an upper/mixed-case host must
# still match.
FilterCaseSensitive No

# Filtering the DOMAIN (Host header / CONNECT target), not the full request
# URL -- an allowlisted host must be reachable at any path, and this project
# has no per-path distinction to enforce (the operator's own choice of oracle
# mirror or webhook receiver is trusted once its HOST is allowlisted, per
# ADR-0011).
FilterURLs Off
