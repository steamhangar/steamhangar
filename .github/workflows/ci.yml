name: CI

# WP 5.1 (Phase 5, release track) + WP CI-1 + WP CI-2. Two tiers:
#
#   1. Fast build/test gates on every push/PR: api-tests, agent-go,
#      core-nginx-config, powershell-syntax, web-tests, android-tests,
#      deploy-static (shellcheck + `docker compose config`, pre-freeze
#      project review S4), image-build (WP CI-FIX-1: `docker build` of every
#      image publish.yml ships, for every platform it ships, nothing
#      pushed). NO image publishing and NO ghcr.io pushes here -- that is
#      publish.yml (WP CI-3), tag-gated.
#
#   2. verify-stack: the real-Docker, real-Steam-CDN integration suite
#      (deploy/tests/verify-stack.sh -- see its own header for the full
#      rationale). It builds all four images, brings up a live compose
#      stack, and talks to the ACTUAL Steam CDN and a public resolver --
#      there is no mock, by design. That makes it valuable signal, but also
#      means it can fail on Steam-side or network flakiness this repo does
#      not control, which is exactly the kind of failure a PR gate must not
#      depend on (an innocent PR must never go red on a Steam-CDN hiccup).
#      It therefore runs on its OWN schedule (nightly cron, the `schedule:`
#      trigger below) and via `workflow_dispatch` (the manual "Run
#      workflow" button) ONLY -- see that job's own `if:` guard -- and
#      NEVER on push or pull_request.
#
# Real-MACHINE tests that need a real Windows box (Task Scheduler, the
# system hosts file, or a WSL2-hosted dnsmasq instance) -- core/tests/
# test-core.ps1, agent/packaging/windows/tests/test-install-uninstall.ps1,
# agent/tests/sandbox/*, dns/tests/test-dnsmasq-config.ps1 -- are a
# DIFFERENT case from verify-stack above: unlike verify-stack, nothing in
# this workflow runs them, not even on the nightly schedule; they stay
# local-only, run-by-hand harnesses, documented at their own doc comments.
# (core/tests/test-core.ps1 in particular exercises the same real-Steam-CDN
# nginx behaviour as verify-stack's own section 5, natively on Windows
# rather than in a Linux container -- verify-stack running nightly does not
# make this one redundant to keep local-only, since it is the only place
# that native-Windows-plus-real-CDN combination is exercised at all.) The
# two PowerShell ones are still parse-checked (never executed) by the
# powershell-syntax job below.

on:
  push:
    # wp/** = work-package branches: the maintainer merges them into main
    # only after this workflow is green on the branch itself (2026-10-01),
    # so the gate must run on the branch push, not only on a pull request.
    branches: [main, "wp/**"]
  pull_request:
  schedule:
    # 04:00 UTC -- outside US/EU business hours, when both the real Steam
    # CDN and shared GitHub-hosted-runner capacity are quieter. Only
    # verify-stack listens for this event; see its `if:` guard below.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Only the read access every job below actually needs (checkout). No job
# publishes anything, so nothing needs write permissions anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The jobs below, up to and including image-build, are the fast PR gate
  # (seven before WP CI-FIX-1 added image-build): push, pull_request, and a
  # manual workflow_dispatch run all trigger them (unchanged from before
  # WP CI-1 for push/pull_request; workflow_dispatch is new -- it lets a
  # human re-run the whole fast suite on demand). The nightly `schedule`
  # event does NOT match this guard, so these do not re-run overnight
  # -- every push/PR already exercises them, so a nightly re-run would add
  # no signal, only cost. android-tests (WP CI-2) belongs here, not with
  # verify-stack below: it is a deterministic JVM unit-test + lint run (no
  # device/emulator, no flaky external service). It DOES fetch dependencies
  # from services.gradle.org / Google Maven / Maven Central on a cold cache
  # (measured: ~1.15 GB, recurring on every change to a `*.gradle*` file,
  # `gradle-wrapper.properties`, or the version catalog -- all part of the
  # cache key below -- and on the cache's 7-day eviction) -- so "fully
  # offline" would overstate it. What actually matters for tier placement is
  # narrower and still true: those are the same class of package-registry
  # dependency api-tests (PyPI), agent-go (Go module proxy) and web-tests
  # (npm via setup-node) already have in this fast tier, not the real Steam
  # CDN that is specifically what makes verify-stack unsafe to gate a PR on.
  api-tests:
    name: api / pytest
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the interpreter pinned in api/Dockerfile
          # (python:3.13.14-slim-trixie) -- keep both in sync.
          python-version: "3.13"
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: api
        # -ra: a compact summary line per skip/xfail at the end, so a skip
        # is visible in the log instead of only showing up as a bare count.
        run: python -m pytest -v -ra

  agent-go:
    name: agent / go (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # WP SEC-FIX-2: same Go selection as publish.yml's agent-binaries
      # (see the comment there): newest patch of go.mod's minor line, so CI
      # tests with the stdlib the release binaries are built with.
      - name: Derive Go release line from go.mod
        id: gover
        shell: bash
        run: |
          set -eu
          line="$(sed -n 's/^go[[:space:]]\{1,\}\([0-9]\{1,\}\.[0-9]\{1,\}\).*/\1/p' agent/go/go.mod)"
          if [ -z "$line" ]; then
            echo "::error::no go directive found in agent/go/go.mod" >&2
            exit 1
          fi
          echo "line=${line}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gover.outputs.line }}.x
          check-latest: true
      - name: go build ./...
        working-directory: agent/go
        run: go build ./...
      - name: go vet ./...
        working-directory: agent/go
        run: go vet ./...
      - name: go test ./...
        working-directory: agent/go
        # -v surfaces the t.Skip()s that fire on this OS (e.g. hostsfile's
        # admin/root-only and Windows-vs-POSIX branches, agentconfig's
        # $HOME-dependent case) so a skip is visible in the log, not silent.
        run: go test -v ./...

  core-nginx-config:
    name: core / nginx -t (rendered container config)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        # Preinstalled on ubuntu-latest (actions/runner-images) -- lints
        # this job's own script before spending time on docker pull/run.
        # WP CORE-FIX-3: tls-sni-probe.sh at warning level -- its info-tier
        # output is SC2059/SC2317 on the deliberate printf-format byte
        # builder.
        run: |
          shellcheck .github/scripts/verify-core-nginx.sh
          shellcheck --severity=warning .github/scripts/tls-sni-probe.sh
      - name: Render core/docker/nginx.conf.template and run nginx -t
        run: bash .github/scripts/verify-core-nginx.sh

  powershell-syntax:
    name: agent / PowerShell 5.1 syntax
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parser + pure-ASCII check (real Windows PowerShell 5.1)
        # Explicit Windows PowerShell (5.1), not pwsh/PowerShell 7 --
        # agent/packaging/windows's real deployment target only ever has
        # 5.1 available, so the parser check must run under 5.1's own
        # parser. Also covers core/tests/test-core.ps1 and dns/tests/
        # test-dnsmasq-config.ps1 (parse-only, never executed -- see the
        # script's own header).
        shell: powershell
        run: .\.github\scripts\verify-ps-parse.ps1
      - name: PSUseCompatibleSyntax(5.1) check (pwsh)
        # Split from the parser check (review round 2, S5): this rule
        # analyzes against stored version-profile data, not the host's own
        # edition, so it doesn't need to run under 5.1 itself -- and pwsh is
        # where PSScriptAnalyzer is reliably discoverable on this runner
        # image. See verify-ps-analyze.ps1's header for the full reasoning.
        shell: pwsh
        run: ./.github/scripts/verify-ps-analyze.ps1

  web-tests:
    name: web / node --test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # web/tests/README.md: verified on Node v24.12.0 (v24.x, "Krypton"
          # LTS) -- "24" resolves to the newest available v24.x on the
          # runner, matching that family exactly.
          node-version: "24"
      - name: node --test
        # The explicit glob, not the bare-directory form: web/tests/README.md
        # documents that `node --test web/tests` (no glob) fails hard with a
        # CJS MODULE_NOT_FOUND instead of discovering the files inside it.
        run: node --test "web/tests/*.test.js"

  android-tests:
    name: app / gradle unit tests + lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Cold-cache Gradle (wrapper distribution + AGP/Kotlin/Compose dependency
    # resolution, none of it warm on a fresh runner) is slower than the
    # pytest/go/node jobs above, though nowhere near verify-stack's
    # build-four-images-and-run-a-live-stack scope -- 20 minutes gives a cold
    # run headroom without reaching into the heavier tier's 30.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          # Temurin 17, matching the major version app/README.md's pinned
          # local toolchain uses. ubuntu-latest's own default JDK happens to
          # be this exact build today (actions/runner-images Ubuntu 24.04
          # readme, Java section: Temurin 17.0.20+8) but `java-version: "17"`
          # itself only floats within the 17.x line, same looseness as this
          # file's own python-version/go-version (go.mod-derived)/node-version pins --
          # pinned explicitly anyway so a future runner-image default bump
          # can't silently change what this job builds with.
          distribution: temurin
          java-version: "17"
          # setup-java's own built-in Gradle cache: ~/.gradle/caches +
          # ~/.gradle/wrapper, keyed on a hash that includes
          # gradle/libs.versions.toml (the version catalog) alongside every
          # other *.gradle*/gradle-wrapper.properties file, and restored via
          # an EXACT key match only -- setup-java sets no `restoreKeys`
          # fallback, so a version bump anywhere in that key can only ever
          # produce a cache MISS (a fresh, correct download), never a stale
          # HIT masquerading as current. This repo's Gradle build itself has
          # no build cache configured (no `org.gradle.caching`, confirmed by
          # every task reporting `executed`, never `FROM-CACHE`, on both a
          # cold and a warm run) -- so this cache can only shorten dependency
          # downloads, it can never skip compiling or running a single test.
          # One residual worth naming: a cache HIT restores the wrapper
          # distribution and dependency jars without re-verifying
          # `distributionSha256Sum` or Gradle's dependency-verification
          # metadata (that check only runs against what was actually
          # downloaded) -- bounded, since only the same branch's own prior
          # writes populate this cache and a fork PR cannot write to it, but
          # it is a real, narrower integrity bar than a cold run gets.
          cache: gradle
      - name: gradlew assembleDebug testDebugUnitTest testReleaseUnitTest lintDebug
        # bash, not `./gradlew` -- same "invoke the interpreter explicitly"
        # convention core-nginx-config's and verify-stack's own script steps
        # above/below already follow, and load-bearing here specifically:
        # the checked-out gradlew file carries no executable bit (git blob
        # mode 100644, a Windows-authored repo), so `./gradlew` alone would
        # fail with Permission denied on this Linux runner. No
        # app/local.properties is generated or needed: ubuntu-latest
        # ships its Android SDK preinstalled with ANDROID_HOME/
        # ANDROID_SDK_ROOT already pointing at it and android-35 (rev 2) +
        # build-tools 35.0.0 already installed (same readme as above) --
        # exactly the compileSdk/targetSdk 35 + build-tools 35.0.0 app/ pins
        # -- so gradlew resolves the SDK from those env vars the same way it
        # was verified to do locally with local.properties absent. The task
        # list matches app/README.md's own WP 4h.4 verification command
        # (`testDebugUnitTest testReleaseUnitTest lintDebug`) plus
        # `assembleDebug`: the one task here that actually packages an APK,
        # catching a dex-merge/manifest-merge/resource-packaging regression
        # the three test/lint tasks never touch. It needs no keystore --
        # app/app/build.gradle.kts's `gradle.taskGraph.whenReady` guard only
        # fires for `assembleRelease`/`bundleRelease`/`installRelease`/
        # `packageRelease`/`packageReleaseBundle`, and debug builds use
        # AGP's own auto-generated debug key regardless -- verified locally
        # (no keystore.properties present, no prompt or failure).
        #
        # WP CI-FIX-2: the token-less public API shows a failed run's
        # check-run annotations but not its log, so the output is teed to
        # $RUNNER_TEMP/android-gradle.log for the `if: failure()` annotation
        # steps below. Fail-closed: `shell: bash` runs this under
        # `-eo pipefail` and the script sets pipefail again explicitly, so
        # gradlew's exit status -- not tee's 0 -- is the step's result
        # (pinned by api/tests/test_ci_fix_2_android_annotate.py).
        # stop-commands: Gradle/test output is untrusted data (a PR decides
        # what a test prints); between the random-token stop and its resume
        # the runner parses no `::` workflow command out of it. The EXIT
        # trap resumes even when gradlew fails, so later steps' commands are
        # processed again; it does not change the exit status.
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          stop_token="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          trap 'echo "::${stop_token}::"' EXIT
          echo "::stop-commands::${stop_token}"
          bash gradlew assembleDebug testDebugUnitTest testReleaseUnitTest lintDebug --console=plain 2>&1 \
            | tee "${RUNNER_TEMP}/android-gradle.log"
      # WP CI-FIX-2: one step per category, because GitHub keeps at most 10
      # error annotations per step (and 50 per job: 4 x 10 fits). Each step
      # only adds information -- it runs after the job already failed and
      # exits 0 on any input it can read. The script escapes all log-derived
      # text (see its docstring) and appends to $GITHUB_STEP_SUMMARY.
      - name: "annotate: Kotlin compile errors"
        if: failure()
        shell: bash
        run: python3 .github/scripts/android-annotate.py kotlin --log "${RUNNER_TEMP}/android-gradle.log"
      - name: "annotate: failed unit tests"
        if: failure()
        shell: bash
        run: >-
          python3 .github/scripts/android-annotate.py junit
          --results-dir app/app/build/test-results
          --test-root app/app/src/test/java
          --test-root app/app/src/test/kotlin
      - name: "annotate: lint issues"
        if: failure()
        shell: bash
        run: >-
          python3 .github/scripts/android-annotate.py lint
          --lint-xml app/app/build/reports/lint-results-debug.xml
          --lint-txt app/app/build/reports/lint-results-debug.txt
          --project-dir app/app
      - name: "annotate: Gradle failure summary"
        if: failure()
        shell: bash
        run: python3 .github/scripts/android-annotate.py gradle --log "${RUNNER_TEMP}/android-gradle.log"

  # Pre-freeze project review, S4: until this job existed the PR gate
  # never rendered deploy/compose.yaml at all and shellcheck'd exactly one
  # shell script (core-nginx-config's own helper). A YAML typo or an
  # interpolation error in compose.yaml -- the file every operator runs --
  # was caught only by the nightly verify-stack run, i.e. after merge.
  deploy-static:
    name: deploy / shellcheck + compose config
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (every shell script the stack ships or tests with)
        # `--severity=warning`: the info/style tier is dominated by SC2016
        # ("expressions don't expand in single quotes") on grep patterns
        # that deliberately match a literal `${`, and by SC1091 on sourced
        # files -- all reviewed, all intentional, and the two of those files
        # outside this package's footprint could not be annotated in-line.
        # `-e SC1007`: core/docker/check-config-drift.sh uses the portable
        # `CDPATH= cd` idiom (a real POSIX idiom, shellcheck's warning is a
        # false positive) and core/ is not this package's to edit;
        # deploy/tests/verify-stack.sh's own two occurrences were rewritten
        # to `CDPATH='' cd`, which shellcheck accepts. Drop the exclusion
        # once core/'s copy is rewritten the same way.
        run: |
          shellcheck --severity=warning -e SC1007 \
            deploy/tests/verify-stack.sh \
            deploy/proxy/*.sh \
            dns/docker-entrypoint.sh \
            core/docker/*.sh
      - name: docker compose config (render the shipped compose file, dns profile included)
        # `-q`: exit status only -- a rendered config is not a useful log
        # line, a refused one is. VAULT_API_KEY=x satisfies the file's own
        # `${VAULT_API_KEY:?...}` guard (the one required variable; it is
        # never used for anything here). `--profile dns` pulls vault-dns's
        # block into the render too, so a mistake there is not hidden by
        # the profile. No `.env` exists on the runner, so this is exactly
        # the "stock checkout, every default" render.
        run: VAULT_API_KEY=x docker compose -f deploy/compose.yaml --profile dns config -q

  # WP CI-FIX-1: until this job existed, no push/PR ever built a release
  # image -- only publish.yml did, on a v* tag, and verify-stack only
  # nightly and amd64-only. A `.dockerignore` that excluded a file
  # core/Dockerfile COPYs was green here and would first have failed at tag
  # time (docs/LEARNINGS.md, WP RC7-INT). The Dockerfiles also carry
  # build-time self-checks (core: the nginx stream-module check, the
  # upstream-pool hook self-check; api: the SteamPrefill `--max-threads`
  # probe; dns/proxy: running the installed dnsmasq/tinyproxy binary) that
  # only a real build runs.
  #
  # Same matrix as publish.yml's `publish` job, entry for entry (image,
  # context, dockerfile, platforms). The list is duplicated on purpose,
  # not shared through a reusable workflow or a JSON file: either would
  # have to restructure publish.yml's release job (its per-image digest
  # outputs, `packages: write`, login and manifest checks) just to share
  # four rows. api/tests/test_ci_image_build.py instead pins the two
  # matrices equal and pins the action SHAs equal, so drift fails the
  # api-tests job on the same push.
  #
  # Platforms: every platform publish ships, on every push -- including the
  # QEMU-emulated arm64 legs. All three arm64 images are alpine bases with
  # one pinned `apk add` and shell self-checks, no compile step, so
  # emulation costs minutes, not the tens of minutes that would justify an
  # amd64-only fast tier with the full matrix deferred to the nightly run.
  # Building arm64 here is the point: the self-checks then run on arm64
  # too, and an arm64-only break is caught on the push that causes it.
  #
  # No layer cache (no `cache-from`/`cache-to: type=gha`), deliberately:
  # publish.yml builds cold, and api/Dockerfile's `apt-get install libicu76`
  # is not version-pinned, so a cached layer could keep this job green on a
  # change that publish's cold build would fail on -- the exact gap this job
  # exists to close.
  #
  # No push and no login: `push: false`, no tags, no output -- buildx builds
  # every platform and discards the result, the same thing publish.yml's own
  # non-tag workflow_dispatch path does. The job needs nothing beyond the
  # workflow's `contents: read`.
  image-build:
    name: image / docker build ${{ matrix.image }} (${{ matrix.platforms }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Same budget as publish.yml's build of the same matrix.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vault-core
            context: core
            dockerfile: core/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: vault-api
            # Repo root: api/Dockerfile COPYs both api/ and web/ (see the
            # matrix comment in publish.yml for why it is amd64-only).
            context: .
            dockerfile: api/Dockerfile
            platforms: linux/amd64
          - image: vault-dns
            context: dns
            dockerfile: dns/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: vault-proxy
            context: deploy/proxy
            dockerfile: deploy/proxy/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU (arm64 emulation for cross-building)
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # WP VER-1: the same build-arg KEYS publish.yml passes, with values
      # that can never be mistaken for a release (ci-<short sha>). The
      # values differ on purpose; api/tests/test_ci_image_build.py pins the
      # keys equal and these values.
      - name: Compute CI build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "version=ci-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.image }} (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          build-args: |
            VAULT_VERSION=${{ steps.version.outputs.version }}
            VAULT_COMMIT=${{ steps.version.outputs.commit }}

  verify-stack:
    name: deploy / verify-stack
    runs-on: ubuntu-latest
    # Nightly cron + manual workflow_dispatch ONLY -- never push or
    # pull_request. See the top-of-file header for why: this suite talks to
    # the real Steam CDN and a public resolver, and a PR gate must not
    # depend on infrastructure this repo does not control. (Do not add
    # continue-on-error here instead -- the point is that a Steam-side
    # hiccup never touches a PR's status at all, not that it touches it
    # softly.)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Builds four images from scratch and exercises a live stack against the
    # real Steam CDN -- deliberately slower than the other jobs above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deploy/tests/verify-stack.sh
        # The script computes its own repo_root from $0 (deploy/tests/../..),
        # so running it from the repo root -- this job's default working
        # directory -- is exactly its documented usage. ubuntu-latest ships
