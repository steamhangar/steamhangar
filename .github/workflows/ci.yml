name: CI

# WP 5.1 (Phase 5, release track) + WP CI-1 + WP CI-2. Two tiers:
#
#   1. Fast build/test gates on every push/PR: api-tests, agent-go,
#      core-nginx-config, powershell-syntax, web-tests, android-tests,
#      deploy-static (shellcheck + `docker compose config`, pre-freeze
#      project review S4), image-build (WP CI-FIX-1: `docker build` of every
#      image publish.yml ships, for every platform it ships, nothing
#      pushed). NO image publishing and NO ghcr.io pushes here -- that is
#      publish.yml (WP CI-3), tag-gated.
#
#   2. verify-stack: the real-Docker, real-Steam-CDN integration suite
#      (deploy/tests/verify-stack.sh -- see its own header for the full
#      rationale). It builds all four images, brings up a live compose
#      stack, and talks to the ACTUAL Steam CDN and a public resolver --
#      there is no mock, by design. That makes it valuable signal, but also
#      means it can fail on Steam-side or network flakiness this repo does
#      not control, which is exactly the kind of failure a PR gate must not
#      depend on (an innocent PR must never go red on a Steam-CDN hiccup).
#      It therefore runs on its OWN schedule (nightly cron, the `schedule:`
#      trigger below) and via `workflow_dispatch` (the manual "Run
#      workflow" button) ONLY -- see that job's own `if:` guard -- and
#      NEVER on push or pull_request.
#
# Real-MACHINE tests that need a real Windows box (Task Scheduler, the
# system hosts file, or a WSL2-hosted dnsmasq instance) -- core/tests/
# test-core.ps1, agent/packaging/windows/tests/test-install-uninstall.ps1,
# agent/tests/sandbox/*, dns/tests/test-dnsmasq-config.ps1 -- are a
# DIFFERENT case from verify-stack above: unlike verify-stack, nothing in
# this workflow runs them, not even on the nightly schedule; they stay
# local-only, run-by-hand harnesses, documented at their own doc comments.
# (core/tests/test-core.ps1 in particular exercises the same real-Steam-CDN
# nginx behaviour as verify-stack's own section 5, natively on Windows
# rather than in a Linux container -- verify-stack running nightly does not
# make this one redundant to keep local-only, since it is the only place
# that native-Windows-plus-real-CDN combination is exercised at all.) The
# two PowerShell ones are still parse-checked (never executed) by the
# powershell-syntax job below. That job DOES execute one PowerShell test:
# agent/packaging/windows/tests/test-packaging-unit.ps1 (WP AGENT-FIX-2),
# which is hermetic by design (temp directory only, installer under
# -WhatIf) and needs no real machine state.

on:
  push:
    # wp/** = work-package branches: the maintainer merges them into main
    # only after this workflow is green on the branch itself (2026-10-01),
    # so the gate must run on the branch push, not only on a pull request.
    branches: [main, "wp/**"]
  pull_request:
  schedule:
    # 04:00 UTC -- outside US/EU business hours, when both the real Steam
    # CDN and shared GitHub-hosted-runner capacity are quieter. Only
    # verify-stack listens for this event; see its `if:` guard below.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Only the read access every job below actually needs (checkout). No job
# publishes anything. The two exceptions, android-goldens-push (WP
# APP-TEST-2) and web-goldens-push (WP WEB-GOLDENS-1), grant themselves
# contents: write at job level to push refreshed screenshot goldens back to
# a wp/*-goldens branch; neither runs any build code. Every other job stays
# read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The jobs below, up to and including image-build, are the fast PR gate
  # (seven before WP CI-FIX-1 added image-build): push, pull_request, and a
  # manual workflow_dispatch run all trigger them (unchanged from before
  # WP CI-1 for push/pull_request; workflow_dispatch is new -- it lets a
  # human re-run the whole fast suite on demand). The nightly `schedule`
  # event does NOT match this guard, so these do not re-run overnight
  # -- every push/PR already exercises them, so a nightly re-run would add
  # no signal, only cost. android-tests (WP CI-2) belongs here, not with
  # verify-stack below: it is a deterministic JVM unit-test + lint run (no
  # device/emulator, no flaky external service). It DOES fetch dependencies
  # from services.gradle.org / Google Maven / Maven Central on a cold cache
  # (measured: ~1.15 GB, recurring on every change to a `*.gradle*` file,
  # `gradle-wrapper.properties`, or the version catalog -- all part of the
  # cache key below -- and on the cache's 7-day eviction) -- so "fully
  # offline" would overstate it. What actually matters for tier placement is
  # narrower and still true: those are the same class of package-registry
  # dependency api-tests (PyPI), agent-go (Go module proxy) and web-tests
  # (npm via setup-node) already have in this fast tier, not the real Steam
  # CDN that is specifically what makes verify-stack unsafe to gate a PR on.
  api-tests:
    name: api / pytest
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the interpreter pinned in api/Dockerfile
          # (python:3.13.14-slim-trixie) -- keep both in sync.
          python-version: "3.13"
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: api
        # -ra: a compact summary line per skip/xfail at the end, so a skip
        # is visible in the log instead of only showing up as a bare count.
        run: python -m pytest -v -ra

  agent-go:
    name: agent / go (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # WP SEC-FIX-2: same Go selection as publish.yml's agent-binaries
      # (see the comment there): newest patch of go.mod's minor line, so CI
      # tests with the stdlib the release binaries are built with.
      - name: Derive Go release line from go.mod
        id: gover
        shell: bash
        run: |
          set -eu
          line="$(sed -n 's/^go[[:space:]]\{1,\}\([0-9]\{1,\}\.[0-9]\{1,\}\).*/\1/p' agent/go/go.mod)"
          if [ -z "$line" ]; then
            echo "::error::no go directive found in agent/go/go.mod" >&2
            exit 1
          fi
          echo "line=${line}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gover.outputs.line }}.x
          check-latest: true
      - name: go build ./...
        working-directory: agent/go
        run: go build ./...
      - name: go vet ./...
        working-directory: agent/go
        run: go vet ./...
      - name: go test ./...
        working-directory: agent/go
        # -v surfaces the t.Skip()s that fire on this OS (e.g. hostsfile's
        # admin/root-only and Windows-vs-POSIX branches, agentconfig's
        # $HOME-dependent case) so a skip is visible in the log, not silent.
        run: go test -v ./...

  core-nginx-config:
    name: core / nginx -t (rendered container config)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        # Preinstalled on ubuntu-latest (actions/runner-images) -- lints
        # this job's own script before spending time on docker pull/run.
        # WP CORE-FIX-3: tls-sni-probe.sh at warning level -- its info-tier
        # output is SC2059/SC2317 on the deliberate printf-format byte
        # builder.
        run: |
          shellcheck .github/scripts/verify-core-nginx.sh
          shellcheck --severity=warning .github/scripts/tls-sni-probe.sh
          shellcheck .github/scripts/apk-cert-digest.sh
      - name: Render core/docker/nginx.conf.template and run nginx -t
        run: bash .github/scripts/verify-core-nginx.sh

  powershell-syntax:
    name: agent / PowerShell 5.1 syntax
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parser + pure-ASCII check (real Windows PowerShell 5.1)
        # Explicit Windows PowerShell (5.1), not pwsh/PowerShell 7 --
        # agent/packaging/windows's real deployment target only ever has
        # 5.1 available, so the parser check must run under 5.1's own
        # parser. Also covers core/tests/test-core.ps1 and dns/tests/
        # test-dnsmasq-config.ps1 (parse-only, never executed -- see the
        # script's own header).
        shell: powershell
        run: .\.github\scripts\verify-ps-parse.ps1
      - name: PSUseCompatibleSyntax(5.1) check (pwsh)
        # Split from the parser check (review round 2, S5): this rule
        # analyzes against stored version-profile data, not the host's own
        # edition, so it doesn't need to run under 5.1 itself -- and pwsh is
        # where PSScriptAnalyzer is reliably discoverable on this runner
        # image. See verify-ps-analyze.ps1's header for the full reasoning.
        shell: pwsh
        run: ./.github/scripts/verify-ps-analyze.ps1
      - name: Packaging unit tests (real Windows PowerShell 5.1)
        # WP AGENT-FIX-2. Unlike the real-machine harness next to it, this
        # one is hermetic and IS executed: it touches only a throwaway
        # %TEMP% directory (no Scheduled Task, no registry write, no
        # network) -- install-task.ps1 runs with -WhatIf only. See the
        # script's own header for what it pins.
        shell: powershell
        run: .\agent\packaging\windows\tests\test-packaging-unit.ps1

  web-tests:
    name: web / node --test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # web/tests/README.md: verified on Node v24.12.0 (v24.x, "Krypton"
          # LTS) -- "24" resolves to the newest available v24.x on the
          # runner, matching that family exactly.
          node-version: "24"
      - name: node --test
        # The explicit glob, not the bare-directory form: web/tests/README.md
        # documents that `node --test web/tests` (no glob) fails hard with a
        # CJS MODULE_NOT_FOUND instead of discovering the files inside it.
        #
        # WP CI-FIX-4: two reporters -- `spec` to stdout for the log, `junit`
        # to a file for the annotation step below (the token-less public API
        # shows annotations, not the log). node's exit status is unchanged
        # by the reporters: non-zero when any test fails, so this step still
        # fails the job (pinned by api/tests/test_ci_fix_4_node_junit_annotate.py).
        shell: bash
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination="${RUNNER_TEMP}/web-junit.xml"
          "web/tests/*.test.js"
      # WP CI-FIX-4: only adds information after the test step failed; exits
      # 0 on any input. At most 10 annotations (GitHub's per-step cap); all
      # test-derived text is escaped (see the script's docstring).
      - name: "annotate: failed web tests"
        if: failure()
        shell: bash
        run: python3 .github/scripts/node-junit-annotate.py "${RUNNER_TEMP}/web-junit.xml"

  # WP WEB-GOLDENS-1: screenshot goldens for the web UI, the web twin of
  # android-tests' Roborazzi goldens. tools/web-serve.mjs serves web/ with
  # vault-api's SPA fallback (no Docker here), tools/web-shot.mjs drives the
  # Playwright Chromium build over CDP in demo mode with a frozen clock, and
  # tools/png-diff.mjs compares the PNGs with web/tests/goldens/. Chromium
  # is the exact build the pinned playwright-core version downloads (same
  # build the devbox renders with); fonts-liberation plus the repo's own
  # fontconfig (tools/web-shot-fonts.conf) fix the typeface and hinting, so
  # the pixels do not depend on the runner image's font set. A screenshot
  # without a golden is a notice, not a failure (first run after a page is
  # added); a golden without a screenshot, a size change or more than 0.2 %
  # differing pixels fail the job, with the diff images as an artifact.
  # Skipped on wp/*-goldens pushes exactly like android-tests: there
  # web-goldens-record re-records the set instead.
  web-goldens:
    name: web / goldens
    runs-on: ubuntu-latest
    needs: web-tests
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'push'
      && github.ref_type == 'branch'
      && startsWith(github.ref, 'refs/heads/wp/')
      && endsWith(github.ref, '-goldens')
      && !github.event.repository.fork)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: "goldens: install fonts and Chromium"
        # playwright-core 1.63.0 pins Chromium build 1243 (153.0.8010.12) --
        # the revision tools/README.md documents; bump both together.
        # Version-pinned, not integrity-pinned; acceptable because this job is read-only.
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-liberation
          npx --yes playwright-core@1.63.0 install --with-deps chromium
      - name: "goldens: serve web/"
        shell: bash
        run: |
          node tools/web-serve.mjs --port 8787 > "${RUNNER_TEMP}/web-serve.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null http://127.0.0.1:8787/library && break
            sleep 0.2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8787/library
      - name: "goldens: shoot"
        shell: bash
        run: node tools/web-shot.mjs --base http://127.0.0.1:8787 --out "${RUNNER_TEMP}/web-shots"
      - name: "goldens: verify"
        shell: bash
        run: >-
          node tools/png-diff.mjs --expected web/tests/goldens --actual "${RUNNER_TEMP}/web-shots"
          --diff "${RUNNER_TEMP}/web-shots-diff" --missing warn --github
      - name: "goldens: upload screenshots"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/web-shots/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: "goldens: upload diffs"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-screenshots-diff
          path: ${{ runner.temp }}/web-shots-diff/*.png
          if-no-files-found: ignore
          retention-days: 14

  android-tests:
    name: app / gradle unit tests + lint
    runs-on: ubuntu-latest
    # WP APP-TEST-2: not on a push to wp/*-goldens -- android-goldens-record
    # below re-records the goldens and runs this job's task list in verify
    # mode on the result; here it would verify against the goldens being
    # replaced. The predicate is the refresh jobs' own, negated (no regex in
    # expressions; their guard step enforces the single-segment shape).
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'push'
      && github.ref_type == 'branch'
      && startsWith(github.ref, 'refs/heads/wp/')
      && endsWith(github.ref, '-goldens')
      && !github.event.repository.fork)
    # Cold-cache Gradle (wrapper distribution + AGP/Kotlin/Compose dependency
    # resolution, none of it warm on a fresh runner) is slower than the
    # pytest/go/node jobs above, though nowhere near verify-stack's
    # build-four-images-and-run-a-live-stack scope -- 20 minutes gave a cold
    # run headroom without reaching into the heavier tier's 30. WP
    # APP-TEST-1 raised it to 25: the screenshot tests make Robolectric
    # fetch its SDK 35 android-all jar from Maven Central into ~/.m2 on
    # EVERY run (setup-java's gradle cache covers ~/.gradle only) and render
    # with native graphics; the first CI run is the measurement.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          # Temurin 17, matching the major version app/README.md's pinned
          # local toolchain uses. ubuntu-latest's own default JDK happens to
          # be this exact build today (actions/runner-images Ubuntu 24.04
          # readme, Java section: Temurin 17.0.20+8) but `java-version: "17"`
          # itself only floats within the 17.x line, same looseness as this
          # file's own python-version/go-version (go.mod-derived)/node-version pins --
          # pinned explicitly anyway so a future runner-image default bump
          # can't silently change what this job builds with.
          distribution: temurin
          java-version: "17"
          # setup-java's own built-in Gradle cache: ~/.gradle/caches +
          # ~/.gradle/wrapper, keyed on a hash that includes
          # gradle/libs.versions.toml (the version catalog) alongside every
          # other *.gradle*/gradle-wrapper.properties file, and restored via
          # an EXACT key match only -- setup-java sets no `restoreKeys`
          # fallback, so a version bump anywhere in that key can only ever
          # produce a cache MISS (a fresh, correct download), never a stale
          # HIT masquerading as current. This repo's Gradle build itself has
          # no build cache configured (no `org.gradle.caching`, confirmed by
          # every task reporting `executed`, never `FROM-CACHE`, on both a
          # cold and a warm run) -- so this cache can only shorten dependency
          # downloads, it can never skip compiling or running a single test.
          # One residual worth naming: a cache HIT restores the wrapper
          # distribution and dependency jars without re-verifying
          # `distributionSha256Sum` or Gradle's dependency-verification
          # metadata (that check only runs against what was actually
          # downloaded) -- bounded, since only the same branch's own prior
          # writes populate this cache and a fork PR cannot write to it, but
          # it is a real, narrower integrity bar than a cold run gets.
          cache: gradle
      - name: gradlew assembleDebug testDebugUnitTest testReleaseUnitTest lintDebug
        # bash, not `./gradlew` -- same "invoke the interpreter explicitly"
        # convention core-nginx-config's and verify-stack's own script steps
        # above/below already follow, and load-bearing here specifically:
        # the checked-out gradlew file carries no executable bit (git blob
        # mode 100644, a Windows-authored repo), so `./gradlew` alone would
        # fail with Permission denied on this Linux runner. No
        # app/local.properties is generated or needed: ubuntu-latest
        # ships its Android SDK preinstalled with ANDROID_HOME/
        # ANDROID_SDK_ROOT already pointing at it and android-35 (rev 2) +
        # build-tools 35.0.0 already installed (same readme as above) --
        # exactly the compileSdk/targetSdk 35 + build-tools 35.0.0 app/ pins
        # -- so gradlew resolves the SDK from those env vars the same way it
        # was verified to do locally with local.properties absent. The task
        # list matches app/README.md's own WP 4h.4 verification command
        # (`testDebugUnitTest testReleaseUnitTest lintDebug`) plus
        # `assembleDebug`: the one task here that actually packages an APK,
        # catching a dex-merge/manifest-merge/resource-packaging regression
        # the three test/lint tasks never touch. It needs no keystore --
        # app/app/build.gradle.kts's `gradle.taskGraph.whenReady` guard only
        # fires for `assembleRelease`/`bundleRelease`/`installRelease`/
        # `packageRelease`/`packageReleaseBundle`, and debug builds use
        # AGP's own auto-generated debug key regardless -- verified locally
        # (no keystore.properties present, no prompt or failure).
        #
        # WP CI-FIX-2: the token-less public API shows a failed run's
        # check-run annotations but not its log, so the output is teed to
        # $RUNNER_TEMP/android-gradle.log for the `if: failure()` annotation
        # steps below. Fail-closed: `shell: bash` runs this under
        # `-eo pipefail` and the script sets pipefail again explicitly, so
        # gradlew's exit status -- not tee's 0 -- is the step's result
        # (pinned by api/tests/test_ci_fix_2_android_annotate.py).
        # stop-commands: between the random-token stop and its resume the
        # runner parses no `::` workflow command out of the Gradle output,
        # so command-like text that trusted code prints (a test message, a
        # compiler or lint message containing `::`) stays plain log text.
        # It is NOT a defence against a malicious pull request: that PR's
        # build code runs in this same step with the runner's files at hand
        # ($GITHUB_ENV, $GITHUB_OUTPUT, the inputs of the annotate steps), so
        # it does not need workflow commands in its stdout at all. The EXIT trap resumes even when gradlew fails, so later
        # steps' commands are processed again; it does not change the exit
        # status.
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          stop_token="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          trap 'echo "::${stop_token}::"' EXIT
          echo "::stop-commands::${stop_token}"
          bash gradlew assembleDebug testDebugUnitTest testReleaseUnitTest lintDebug --console=plain 2>&1 \
            | tee "${RUNNER_TEMP}/android-gradle.log"
      # WP APP-TEST-1: the library screenshot tests run inside
      # testDebugUnitTest above (Roborazzi on Robolectric, no emulator). Per
      # image they VERIFY against a checked-in golden
      # (app/app/src/testDebug/screenshots/) -- a pixel difference fails the
      # test and with it the gradle step -- or, when no golden exists yet,
      # RECORD into build/outputs/roborazzi/new-goldens/ and pass. These two
      # steps only report and publish what the tests left behind; neither
      # can turn a red job green or a green one red. `!cancelled()` instead
      # of `always()`: after a failed gradle step the diff images are the
      # point, after a cancel there is nothing worth keeping.
      - name: "screenshots: summary"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          out=app/app/build/outputs/roborazzi
          new=0
          changed=0
          if [ -d "$out/new-goldens" ]; then
            new="$(find "$out/new-goldens" -type f -name '*.png' | wc -l | tr -d ' ')"
          fi
          if [ -d "$out/diffs" ]; then
            changed="$(find "$out/diffs" -type f -name '*_compare.png' | wc -l | tr -d ' ')"
          fi
          {
            echo "### Android screenshots"
            echo ""
            echo "- recorded without a golden (new): ${new}"
            echo "- differing from their golden (failed): ${changed}"
            echo ""
            echo "Images: workflow artifact \`app-screenshots\`. How goldens get checked in: app/README.md, \"Screenshot tests\"."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$new" -gt 0 ]; then
            echo "::notice title=Screenshot goldens missing::${new} screenshot(s) have no golden yet and were recorded instead of verified. Review them in the app-screenshots artifact and check them in (app/README.md)."
          fi
          if [ "$changed" -gt 0 ]; then
            echo "::error title=Screenshots changed::${changed} screenshot(s) differ from their golden. Compare images are in the app-screenshots artifact (diffs/)."
          fi
      - name: "screenshots: upload artifact"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-screenshots
          path: app/app/build/outputs/roborazzi/
          # Nothing to upload is the normal case once every golden exists
          # and all of them match -- not a warning, not a failure.
          if-no-files-found: ignore
          retention-days: 14
      # WP CI-FIX-2: one step per category, because GitHub keeps at most 10
      # error annotations per step (and 50 per job: 4 x 10 fits). Each step
      # only adds information -- it runs after the job already failed and
      # exits 0 on any input it can read. The script escapes all log-derived
      # text (see its docstring) and appends to $GITHUB_STEP_SUMMARY.
      - name: "annotate: Kotlin compile errors"
        if: failure()
        shell: bash
        run: python3 .github/scripts/android-annotate.py kotlin --log "${RUNNER_TEMP}/android-gradle.log"
      - name: "annotate: failed unit tests"
        if: failure()
        shell: bash
        run: >-
          python3 .github/scripts/android-annotate.py junit
          --results-dir app/app/build/test-results
          --test-root app/app/src/test/java
          --test-root app/app/src/test/kotlin
          --test-root app/app/src/testDebug/java
      - name: "annotate: lint issues"
        if: failure()
        shell: bash
        run: >-
          python3 .github/scripts/android-annotate.py lint
          --lint-xml app/app/build/reports/lint-results-debug.xml
          --lint-txt app/app/build/reports/lint-results-debug.txt
          --project-dir app/app
      - name: "annotate: Gradle failure summary"
        if: failure()
        shell: bash
        run: python3 .github/scripts/android-annotate.py gradle --log "${RUNNER_TEMP}/android-gradle.log"

  # WP APP-TEST-2: golden refresh by CI (decision 2026-10-13,
  # docs/handover/post-0.1.0-roadmap.md wave plan item 5). Screenshot
  # goldens can only be rendered here (no Android SDK or emulator in the
  # devbox), so a push to a branch named wp/<name>-goldens runs two jobs:
  #
  #   android-goldens-record (contents: read, runs Gradle):
  #     1. deletes the goldens and re-records every screenshot in record
  #        mode, so the directory mirrors the test's shots exactly,
  #     2. runs android-tests' full task list in VERIFY mode on that tree
  #        (a second render must match the first pixel for pixel) -- this
  #        is the verify of the bot commit: a push made with GITHUB_TOKEN
  #        never triggers another workflow run (GitHub's loop protection),
  #        so the commit gets no CI run of its own and is verified here,
  #        before it exists; it differs from the CI-tested head only by PNGs,
  #     3. uploads the PNGs, and nothing else, as an artifact.
  #   android-goldens-push (contents: write, runs NO build code):
  #     4. checks out the same commit, downloads the PNGs, accepts them only
  #        as exactly the set of shot names (`shoot("...")`) in the
  #        *ScreenshotTest.kt classes under app/app/src/testDebug (APP-TEST-2),
  #        each a real PNG,
  #     5. commits them as github-actions[bot] if anything changed and
  #        pushes fast-forward to the SAME branch (a branch that moved
  #        meanwhile is rejected; the newer run takes over).
  #
  # The write token exists only in the job that executes no Gradle, no
  # dependency and no repository build code: a job that runs Gradle cannot
  # keep a token away from that code, so it gets none. A -goldens branch
  # accepts EVERY visual change its push renders -- the guards for the
  # images themselves are the human review of the bot commit and the full
  # CI run (android-tests included) on the merge to main.
  #
  # android-tests is skipped on these pushes (see its `if:`): it would
  # verify against the goldens being replaced and go red by design; step 2
  # runs the same Gradle tasks instead.
  #
  # Branch shape: GitHub expressions have no regex, so the three jobs share
  # one textually identical prefix/suffix predicate (pinned by
  # api/tests/test_app_test_2_golden_refresh_ci.py) and android-tests is
  # skipped exactly when the refresh jobs start. The exact shape
  # refs/heads/wp/<one segment>-goldens is then enforced by the first step
  # of BOTH jobs, fail-closed: wp/a/b-goldens runs red, never silently
  # green. Never on pull_request (never fork code), main, tags, or in a
  # fork of the repository.
  android-goldens-record:
    name: app / record screenshot goldens
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'branch'
      && startsWith(github.ref, 'refs/heads/wp/')
      && endsWith(github.ref, '-goldens')
      && !github.event.repository.fork
    permissions:
      contents: read
    concurrency:
      group: android-goldens-record-${{ github.ref }}
      cancel-in-progress: true
    # Two Gradle passes (record, then the full android-tests task list).
    timeout-minutes: 40
    steps:
      - name: "goldens: guard branch"
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::golden refresh runs on branch pushes only (event=${GITHUB_EVENT_NAME}, ref type=${GITHUB_REF_TYPE})"
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/wp/[^/]+-goldens$'; then
            echo "::error::golden refresh runs on wp/<name>-goldens branches only, not ${GITHUB_REF}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          # Same toolchain and cache as android-tests; reasons there.
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: "goldens: record"
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          stop_token="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          trap 'echo "::${stop_token}::"' EXIT
          rm -f app/src/testDebug/screenshots/*.png
          echo "::stop-commands::${stop_token}"
          bash gradlew testDebugUnitTest --tests '*ScreenshotTest' \
            -Psteamhangar.screenshots.record=true --console=plain 2>&1 \
            | tee "${RUNNER_TEMP}/android-gradle.log"
      - name: "goldens: verify (android-tests task list)"
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          stop_token="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          trap 'echo "::${stop_token}::"' EXIT
          echo "::stop-commands::${stop_token}"
          bash gradlew assembleDebug testDebugUnitTest testReleaseUnitTest lintDebug --console=plain 2>&1 \
            | tee -a "${RUNNER_TEMP}/android-gradle.log"
      - name: "goldens: upload recorded goldens"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-screenshot-goldens
          path: app/app/src/testDebug/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: "goldens: upload render output"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-screenshots-goldens-diffs
          path: app/app/build/outputs/roborazzi/
          # Only a failed verify pass leaves diffs behind.
          if-no-files-found: ignore
          retention-days: 14
      # Same annotation steps as android-tests (WP CI-FIX-2), over the log
      # of both Gradle passes.
      - name: "annotate: Kotlin compile errors"
        if: failure()
        shell: bash
        run: python3 .github/scripts/android-annotate.py kotlin --log "${RUNNER_TEMP}/android-gradle.log"
      - name: "annotate: failed unit tests"
        if: failure()
        shell: bash
        run: >-
          python3 .github/scripts/android-annotate.py junit
          --results-dir app/app/build/test-results
          --test-root app/app/src/test/java
          --test-root app/app/src/test/kotlin
          --test-root app/app/src/testDebug/java
      - name: "annotate: lint issues"
        if: failure()
        shell: bash
        run: >-
          python3 .github/scripts/android-annotate.py lint
          --lint-xml app/app/build/reports/lint-results-debug.xml
          --lint-txt app/app/build/reports/lint-results-debug.txt
          --project-dir app/app
      - name: "annotate: Gradle failure summary"
        if: failure()
        shell: bash
        run: python3 .github/scripts/android-annotate.py gradle --log "${RUNNER_TEMP}/android-gradle.log"

  android-goldens-push:
    name: app / push screenshot goldens
    runs-on: ubuntu-latest
    needs: android-goldens-record
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'branch'
      && startsWith(github.ref, 'refs/heads/wp/')
      && endsWith(github.ref, '-goldens')
      && !github.event.repository.fork
    # The only write access in this workflow. Everything this job runs is
    # in the steps below: git, coreutils, the artifact download. No Gradle,
    # no setup-java, no cache restore, no repository script.
    permissions:
      contents: write
    concurrency:
      group: android-goldens-push-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: "goldens: guard branch"
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::golden refresh runs on branch pushes only (event=${GITHUB_EVENT_NAME}, ref type=${GITHUB_REF_TYPE})"
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/wp/[^/]+-goldens$'; then
            echo "::error::golden refresh runs on wp/<name>-goldens branches only, not ${GITHUB_REF}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: "goldens: download recorded goldens"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: app-screenshot-goldens
          path: ${{ runner.temp }}/goldens
      - name: "goldens: validate and copy"
        shell: bash
        run: |
          export LC_ALL=C
          # APP-TEST-2: every *ScreenshotTest.kt class (regular files only)
          # defines shots; the allowlist is the union of their names.
          testroot=app/app/src/testDebug/java
          mapfile -t srcs < <(find "$testroot" -type f -name '*ScreenshotTest.kt' | sort)
          goldens=app/app/src/testDebug/screenshots
          dl="${RUNNER_TEMP:?}/goldens"
          fail() { echo "::error title=Golden refresh rejected::$1"; exit 1; }
          [ "${#srcs[@]}" -gt 0 ] || fail "no *ScreenshotTest.kt under $testroot"
          { [ -d "$dl" ] && [ ! -L "$dl" ]; } || fail "no downloaded goldens"
          expected="$(grep -ohE '\bshoot\("[^"]+"' "${srcs[@]}" | sed -E 's/^shoot\("//; s/"$//' | sort)"
          [ -n "$expected" ] || fail "no shoot(\"...\") calls found in ${srcs[*]}"
          [ "$expected" = "$(printf '%s\n' "$expected" | sort -u)" ] || fail "duplicate shot names across ${srcs[*]}"
          actual="$(find "$dl" -mindepth 1 -printf '%P\n' | sort)"
          [ -n "$actual" ] || fail "the artifact is empty"
          while IFS= read -r f; do
            printf '%s' "$f" | grep -Eq '^[a-z0-9_]+\.png$' || fail "unexpected name in the artifact: ${f}"
            { [ -f "$dl/$f" ] && [ ! -L "$dl/$f" ]; } || fail "not a regular file: ${f}"
            sig="$(head -c 8 "$dl/$f" | od -An -tx1 | tr -d ' \n')"
            [ "$sig" = "89504e470d0a1a0a" ] || fail "not a PNG: ${f}"
          done <<< "$actual"
          [ "$(printf '%s\n' "$actual" | sed 's/\.png$//' | sort)" = "$expected" ] \
            || fail "artifact files do not match the shots in the *ScreenshotTest.kt classes"
          mkdir -p "$goldens"
          find "$goldens" -maxdepth 1 -type f -name '*.png' -delete
          while IFS= read -r f; do cp -- "$dl/$f" "$goldens/$f"; done <<< "$actual"
      - name: "goldens: commit locally"
        id: commit
        shell: bash
        run: |
          goldens=app/app/src/testDebug/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$goldens"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Screenshot goldens: unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Screenshot goldens: refreshed"
            echo ""
            git diff --cached --name-status -- "$goldens" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -q -m "test(app): refresh screenshot goldens from CI" \
            -m "Recorded and verified by workflow run ${GITHUB_RUN_ID} on ${GITHUB_SHA}."
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: "goldens: push to the same branch"
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c core.hooksPath=/dev/null \
            -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${GITHUB_REF}"

  # WP WEB-GOLDENS-1: the web twin of the two jobs above, same contract.
  #   web-goldens-record (contents: read, runs Node and Chromium):
  #     1. deletes web/tests/goldens/*.png and re-records every page the
  #        served app has (tools/web-shot.mjs skips a page the server does
  #        not know -- a golden for a page that does not exist yet cannot
  #        be recorded by accident),
  #     2. renders a second time and compares against the fresh set with
  #        png-diff (missing = fail here) -- the verify of the bot commit,
  #     3. uploads the PNGs, and nothing else, as an artifact.
  #   web-goldens-push (contents: write, runs NO build code -- no node, no
  #   npx, no repository script):
  #     4. accepts exactly names of the form <page>-<width>.png for the
  #        pages and widths tools/web-shot.mjs declares (DEFAULT_PAGES /
  #        DEFAULT_WIDTHS, grepped from the source), every width of a
  #        recorded page present, each a real PNG,
  #     5. commits them as github-actions[bot] and pushes fast-forward to
  #        the SAME branch. It runs after android-goldens-push (whatever
  #        that job's outcome) because both push to the same branch: if the
  #        branch tip moved, the move must be the recorded commit plus
  #        Android golden PNGs only -- then the web commit is rebased onto
  #        it; any other movement means a newer push happened, and the
  #        newer run takes over.
  web-goldens-record:
    name: web / record screenshot goldens
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'branch'
      && startsWith(github.ref, 'refs/heads/wp/')
      && endsWith(github.ref, '-goldens')
      && !github.event.repository.fork
    permissions:
      contents: read
    concurrency:
      group: web-goldens-record-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - name: "goldens: guard branch"
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::golden refresh runs on branch pushes only (event=${GITHUB_EVENT_NAME}, ref type=${GITHUB_REF_TYPE})"
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/wp/[^/]+-goldens$'; then
            echo "::error::golden refresh runs on wp/<name>-goldens branches only, not ${GITHUB_REF}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: "goldens: install fonts and Chromium"
        # Identical to web-goldens' step: the recorded pixels must come from
        # the same Chromium build and the same fonts the verify job uses.
        # Version-pinned, not integrity-pinned; acceptable because this job is read-only.
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-liberation
          npx --yes playwright-core@1.63.0 install --with-deps chromium
      - name: "goldens: serve web/"
        shell: bash
        run: |
          node tools/web-serve.mjs --port 8787 > "${RUNNER_TEMP}/web-serve.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null http://127.0.0.1:8787/library && break
            sleep 0.2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8787/library
      - name: "goldens: record"
        shell: bash
        run: |
          rm -f web/tests/goldens/*.png
          node tools/web-shot.mjs --base http://127.0.0.1:8787 --out web/tests/goldens
      - name: "goldens: verify (second render)"
        shell: bash
        run: |
          node tools/web-shot.mjs --base http://127.0.0.1:8787 --out "${RUNNER_TEMP}/web-shots"
          node tools/png-diff.mjs --expected web/tests/goldens --actual "${RUNNER_TEMP}/web-shots" \
            --diff "${RUNNER_TEMP}/web-shots-diff" --github
      - name: "goldens: upload recorded goldens"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-screenshot-goldens
          path: web/tests/goldens/*.png
          if-no-files-found: error
          retention-days: 14
      - name: "goldens: upload diffs"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-screenshots-goldens-diffs
          path: ${{ runner.temp }}/web-shots-diff/*.png
          if-no-files-found: ignore
          retention-days: 14

  web-goldens-push:
    name: web / push screenshot goldens
    runs-on: ubuntu-latest
    needs: [web-goldens-record, android-goldens-push]
    # `!cancelled()` so a failed or skipped Android refresh does not block
    # the web one; the record job itself must have succeeded.
    if: >-
      !cancelled() && needs.web-goldens-record.result == 'success'
      && github.event_name == 'push'
      && github.ref_type == 'branch'
      && startsWith(github.ref, 'refs/heads/wp/')
      && endsWith(github.ref, '-goldens')
      && !github.event.repository.fork
    permissions:
      contents: write
    concurrency:
      group: web-goldens-push-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: "goldens: guard branch"
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::golden refresh runs on branch pushes only (event=${GITHUB_EVENT_NAME}, ref type=${GITHUB_REF_TYPE})"
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/wp/[^/]+-goldens$'; then
            echo "::error::golden refresh runs on wp/<name>-goldens branches only, not ${GITHUB_REF}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: "goldens: download recorded goldens"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-screenshot-goldens
          path: ${{ runner.temp }}/web-goldens
      - name: "goldens: validate and copy"
        shell: bash
        run: |
          export LC_ALL=C
          tool=tools/web-shot.mjs
          goldens=web/tests/goldens
          dl="${RUNNER_TEMP:?}/web-goldens"
          fail() { echo "::error title=Golden refresh rejected::$1"; exit 1; }
          [ -f "$tool" ] || fail "no $tool"
          pages="$({ grep -E '^export const DEFAULT_PAGES = \[[^]]+\];$' "$tool" || true; } | grep -oE '"[a-z-]+"' | tr -d '"' || true)"
          widths="$({ grep -E '^export const DEFAULT_WIDTHS = \[[^]]+\];$' "$tool" || true; } | grep -oE '[0-9]+' || true)"
          { [ -n "$pages" ] && [ -n "$widths" ]; } || fail "cannot read DEFAULT_PAGES / DEFAULT_WIDTHS from $tool"
          nwidths="$(printf '%s\n' "$widths" | wc -l | tr -d ' ')"
          allowed="$(for p in $pages; do for w in $widths; do echo "$p-$w.png"; done; done | sort)"
          { [ -d "$dl" ] && [ ! -L "$dl" ]; } || fail "no downloaded goldens"
          actual="$(find "$dl" -mindepth 1 -printf '%P\n' | sort)"
          [ -n "$actual" ] || fail "the artifact is empty"
          while IFS= read -r f; do
            printf '%s' "$f" | grep -Eq '^[a-z-]+-[0-9]+\.png$' || fail "unexpected name in the artifact: ${f}"
            printf '%s\n' "$allowed" | grep -qxF "$f" || fail "not a page/width ${tool} records: ${f}"
            { [ -f "$dl/$f" ] && [ ! -L "$dl/$f" ]; } || fail "not a regular file: ${f}"
            sig="$(head -c 8 "$dl/$f" | od -An -tx1 | tr -d ' \n')"
            [ "$sig" = "89504e470d0a1a0a" ] || fail "not a PNG: ${f}"
          done <<< "$actual"
          for p in $pages; do
            have="$(printf '%s\n' "$actual" | grep -c "^${p}-" || true)"
            { [ "$have" -eq 0 ] || [ "$have" -eq "$nwidths" ]; } || fail "page ${p}: ${have} of ${nwidths} widths recorded"
          done
          mkdir -p "$goldens"
          find "$goldens" -maxdepth 1 -type f -name '*.png' -delete
          while IFS= read -r f; do cp -- "$dl/$f" "$goldens/$f"; done <<< "$actual"
      - name: "goldens: commit locally"
        id: commit
        shell: bash
        run: |
          goldens=web/tests/goldens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$goldens"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Web screenshot goldens: unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Web screenshot goldens: refreshed"
            echo ""
            git diff --cached --name-status -- "$goldens" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -q -m "test(web): refresh screenshot goldens from CI" \
            -m "Recorded and verified by workflow run ${GITHUB_RUN_ID} on ${GITHUB_SHA}."
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: "goldens: push to the same branch"
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git_auth() {
            git -c core.hooksPath=/dev/null \
              -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" "$@"
          }
          git_auth fetch -q origin "${GITHUB_REF}"
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            # The branch moved. Allowed: android-goldens-push's commit(s) on
            # top of the recorded commit, touching Android goldens only.
            git merge-base --is-ancestor "$GITHUB_SHA" "$tip" \
              || { echo "::error::branch ${GITHUB_REF} no longer contains ${GITHUB_SHA}; the newer run takes over"; exit 1; }
            moved="$(git diff --name-only "$GITHUB_SHA" "$tip" | grep -Ev '^app/app/src/testDebug/screenshots/[a-z0-9_]+\.png$' || true)"
            if [ -n "$moved" ]; then
              echo "::error::branch ${GITHUB_REF} moved beyond a golden refresh (${moved}); the newer run takes over"
              exit 1
            fi
            git -c core.hooksPath=/dev/null rebase -q "$tip"
          fi
          git_auth push origin "HEAD:${GITHUB_REF}"

  # Pre-freeze project review, S4: until this job existed the PR gate
  # never rendered deploy/compose.yaml at all and shellcheck'd exactly one
  # shell script (core-nginx-config's own helper). A YAML typo or an
  # interpolation error in compose.yaml -- the file every operator runs --
  # was caught only by the nightly verify-stack run, i.e. after merge.
  deploy-static:
    name: deploy / shellcheck + compose config
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (every shell script the stack ships or tests with)
        # `--severity=warning`: the info/style tier is dominated by SC2016
        # ("expressions don't expand in single quotes") on grep patterns
        # that deliberately match a literal `${`, and by SC1091 on sourced
        # files -- all reviewed, all intentional, and the two of those files
        # outside this package's footprint could not be annotated in-line.
        # `-e SC1007`: core/docker/check-config-drift.sh uses the portable
        # `CDPATH= cd` idiom (a real POSIX idiom, shellcheck's warning is a
        # false positive) and core/ is not this package's to edit;
        # deploy/tests/verify-stack.sh's own two occurrences were rewritten
        # to `CDPATH='' cd`, which shellcheck accepts. Drop the exclusion
        # once core/'s copy is rewritten the same way.
        run: |
          shellcheck --severity=warning -e SC1007 \
            deploy/tests/verify-stack.sh \
            deploy/proxy/*.sh \
            dns/docker-entrypoint.sh \
            core/docker/*.sh
      - name: docker compose config (render the shipped compose file, dns profile included)
        # `-q`: exit status only -- a rendered config is not a useful log
        # line, a refused one is. VAULT_API_KEY=x satisfies the file's own
        # `${VAULT_API_KEY:?...}` guard (the one required variable; it is
        # never used for anything here). `--profile dns` pulls vault-dns's
        # block into the render too, so a mistake there is not hidden by
        # the profile. No `.env` exists on the runner, so this is exactly
        # the "stock checkout, every default" render.
        run: VAULT_API_KEY=x docker compose -f deploy/compose.yaml --profile dns config -q

  # WP CI-FIX-1: until this job existed, no push/PR ever built a release
  # image -- only publish.yml did, on a v* tag, and verify-stack only
  # nightly and amd64-only. A `.dockerignore` that excluded a file
  # core/Dockerfile COPYs was green here and would first have failed at tag
  # time (docs/LEARNINGS.md, WP RC7-INT). The Dockerfiles also carry
  # build-time self-checks (core: the nginx stream-module check, the
  # upstream-pool hook self-check; api: the SteamPrefill `--max-threads`
  # probe; dns/proxy: running the installed dnsmasq/tinyproxy binary) that
  # only a real build runs.
  #
  # Same matrix as publish.yml's `publish` job, entry for entry (image,
  # context, dockerfile, platforms). The list is duplicated on purpose,
  # not shared through a reusable workflow or a JSON file: either would
  # have to restructure publish.yml's release job (its per-image digest
  # outputs, `packages: write`, login and manifest checks) just to share
  # four rows. api/tests/test_ci_image_build.py instead pins the two
  # matrices equal and pins the action SHAs equal, so drift fails the
  # api-tests job on the same push.
  #
  # Platforms: every platform publish ships, on every push -- including the
  # QEMU-emulated arm64 legs. All three arm64 images are alpine bases with
  # one pinned `apk add` and shell self-checks, no compile step, so
  # emulation costs minutes, not the tens of minutes that would justify an
  # amd64-only fast tier with the full matrix deferred to the nightly run.
  # Building arm64 here is the point: the self-checks then run on arm64
  # too, and an arm64-only break is caught on the push that causes it.
  #
  # No layer cache (no `cache-from`/`cache-to: type=gha`), deliberately:
  # publish.yml builds cold, and api/Dockerfile's `apt-get install libicu76`
  # is not version-pinned, so a cached layer could keep this job green on a
  # change that publish's cold build would fail on -- the exact gap this job
  # exists to close.
  #
  # No push and no login: `push: false`, no tags, no output -- buildx builds
  # every platform and discards the result, the same thing publish.yml's own
  # non-tag workflow_dispatch path does. The job needs nothing beyond the
  # workflow's `contents: read`.
  image-build:
    name: image / docker build ${{ matrix.image }} (${{ matrix.platforms }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Same budget as publish.yml's build of the same matrix.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vault-core
            context: core
            dockerfile: core/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: vault-api
            # Repo root: api/Dockerfile COPYs both api/ and web/ (see the
            # matrix comment in publish.yml for why it is amd64-only).
            context: .
            dockerfile: api/Dockerfile
            platforms: linux/amd64
          - image: vault-dns
            context: dns
            dockerfile: dns/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: vault-proxy
            context: deploy/proxy
            dockerfile: deploy/proxy/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU (arm64 emulation for cross-building)
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # WP VER-1: the same build-arg KEYS publish.yml passes, with values
      # that can never be mistaken for a release (ci-<short sha>). The
      # values differ on purpose; api/tests/test_ci_image_build.py pins the
      # keys equal and these values.
      - name: Compute CI build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "version=ci-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.image }} (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          build-args: |
            VAULT_VERSION=${{ steps.version.outputs.version }}
            VAULT_COMMIT=${{ steps.version.outputs.commit }}

  verify-stack:
    name: deploy / verify-stack
    runs-on: ubuntu-latest
    # Nightly cron + manual workflow_dispatch ONLY -- never push or
    # pull_request. See the top-of-file header for why: this suite talks to
    # the real Steam CDN and a public resolver, and a PR gate must not
    # depend on infrastructure this repo does not control. (Do not add
    # continue-on-error here instead -- the point is that a Steam-side
    # hiccup never touches a PR's status at all, not that it touches it
    # softly.)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Builds four images from scratch and exercises a live stack against the
    # real Steam CDN -- deliberately slower than the other jobs above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deploy/tests/verify-stack.sh
        # The script computes its own repo_root from $0 (deploy/tests/../..),
        # so running it from the repo root -- this job's default working
        # directory -- is exactly its documented usage. ubuntu-latest ships
        # Docker, the Compose v2 plugin, dnsutils (dig) and Python 3
        # preinstalled, which is everything the script needs; no extra
        # package installs.
        run: bash deploy/tests/verify-stack.sh
