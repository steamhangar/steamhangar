name: Publish

# WP CI-3 (Phase 5 release track) -- the last CI building block ci.yml's own
# header names by an earlier work-package number ("NO image publishing here
# -- that is WP 5.5", docs/WORKPACKAGES.md's WP 5.5 entry, same package).
# This is a DELIBERATELY SEPARATE workflow file from ci.yml, not a new job
# bolted onto it -- read the reasoning below before adding a job here to
# ci.yml instead.
#
# --- Why a second file, not a new job in ci.yml ------------------------------
# ci.yml's own header states its two-tier design plainly: the fast jobs
# (six when this was written, eight since WP CI-FIX-1 added image-build) guard
# on `github.event_name == 'push' || 'pull_request' ||
# 'workflow_dispatch'` against ONE shared, workflow-wide `on:` block whose
# `push:` trigger is `branches: [main, "wp/**"]` only -- it has no `tags:`
# filter.
# Publishing needs a git-tag push to fire at all. The only way to make a tag
# push visible to *any* job in that file is adding a `tags:` filter to that
# same shared `push:` trigger -- and doing so would silently widen every one
# of those fast jobs' actual trigger surface too, even with their own `if:`
# text left character-for-character unchanged, because none of those
# guards inspects `github.ref` -- only `github.event_name`. A tag push is
# still `event_name == 'push'`, so all of them would start firing on release
# tags as an unintended side effect of a change made only for this job's
# sake, which is exactly the "existing six fast jobs ... unaffected"
# requirement this package (WP CI-3) was given. A second file with its OWN `on:`
# block sidesteps the problem entirely: ci.yml is not touched at all, so
# nothing about it can regress, and this file's `on:` names exactly the two
# events that should ever build/push an image -- nothing else is even
# capable of reaching the job below, so the job-level `if:` guard added
# anyway is belt-and-suspenders (documented, matching the repo's habit of
# stating intent even where the trigger already enforces it), not
# load-bearing the way the fast-tier guards in ci.yml are (those ARE
# load-bearing: their shared `on:` admits a fourth event, `schedule`, that
# they must exclude; this file was never given that event at all).
#
# --- Trigger reasoning, event by event ---------------------------------------
#   push (branch, e.g. main)   -> ref is refs/heads/main, matches neither
#                                  this file's `tags:` filter -> the
#                                  workflow does not even start. Same for
#                                  any other branch push.
#   pull_request (incl. forks) -> not a trigger in this file AT ALL -> a
#                                  fork PR has no code path to a job that
#                                  can push an image, by construction, not
#                                  by a guard that could be misconfigured
#                                  or bypassed.
#   push (tag matching v*)     -> triggers; the publish job's `if:` below
#                                  is also true -> builds and pushes.
#   workflow_dispatch          -> triggers; same `if:` true -> a human can
#                                  re-run a publish (e.g. to pick up a base
#                                  image security fix) without cutting a
#                                  new tag. Review round 2 (N2) correction:
#                                  this is not always "off a branch" the
#                                  way the sentence above used to imply --
#                                  a manual dispatch CAN target an existing
#                                  TAG ref too (the workflow_dispatch UI
#                                  lets the operator pick any ref). In that
#                                  case `github.ref_name` is that tag and
#                                  `github.event_name` is still
#                                  `workflow_dispatch`, not `push` -- the
#                                  `android-release` job's release-attach
#                                  step below deliberately guards on
#                                  `github.event_name == 'push'`
#                                  specifically, so a dispatch-on-a-tag run
#                                  still builds/verifies the APK but does
#                                  NOT attach it to that tag's release
#                                  (only an actual tag push does). This is
#                                  a real, intentional restriction, not an
#                                  oversight -- broadening it is a
#                                  follow-up if manually re-attaching to
#                                  an existing release ever becomes a
#                                  wanted operation.
#   schedule                   -> not a trigger in this file; the nightly
#                                  verify-stack cron stays exactly where it
#                                  is, in ci.yml, untouched.
#
# --- Second deliverable in this same file: the signed Android release APK --
# `android-release` (below, second job) builds, signs and verifies
# `app/`'s release APK and attaches it to the GitHub Release for the same
# tag the `publish` job above builds images for -- so an operator who pulls
# a version gets matching images and app in one place. It shares this
# file's `on:` (same tag-push/workflow_dispatch trigger, for the reason
# already argued above) and needs its own, WIDER job-level `permissions:`
# override (`contents: write`, to create/attach to the release -- the
# `publish` job's own permission grant, by contrast, is `packages: write`
# only; `agent-binaries` below shares this exact same `contents: write`
# override, for the same reason). See that job's own comments for the full
# signing-secret and fail-closed reasoning
# (app/README.md's "Release build, signing, distribution" section, WP
# 4b.9, is the design this job must not weaken).
#
# --- Third deliverable: cross-compiled vault-agent binaries -----------------
# `agent-binaries` (below, third job) is the one piece of this project that
# runs on an end user's own gaming PC rather than in a container or on an
# app store, and until this job existed it had NO downloadable artefact at
# all -- agent/README.md's own build instructions assumed a Go toolchain and
# a manual cross-compile. It cross-builds the three ADR-0005 targets
# (windows/amd64, linux/amd64, linux/arm64), generates a SHA256SUMS file, and
# attaches all of it to the SAME tag's GitHub Release that `android-release`
# (below) also publishes to -- `publish`, above, pushes images to GHCR, a
# different destination entirely; it never touches the Release object.
# `needs: android-release` (not `publish` directly, though it
# transitively requires `publish` to have succeeded via android-release's own
# `needs:`): both this job and `android-release` attach assets to the SAME
# release object via `softprops/action-gh-release`, and that action creates
# the release on its FIRST invocation for a tag if none exists yet -- two
# jobs racing to create the same release concurrently is exactly the kind of
# problem that only shows up once, non-deterministically, on whichever tag
# push loses the race. Chaining `needs:` serializes the two release-writing
# jobs instead: android-release always runs (and either attaches the APK or
# cleanly no-ops, per its own signing-secret gate) before agent-binaries ever
# calls the same action, so exactly one of them ever creates the release, in
# a fixed order, every time.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Job-level `permissions:` below adds `packages: write` for the one job that
# needs it; this top-level default stays read-only, matching ci.yml's own
# "only the read access every job below actually needs" rule -- nothing
# broadens the default for a job that never asks for it.
permissions:
  contents: read

# Queue, don't cancel: unlike ci.yml's fast tier (where cancelling a stale
# run on the same PR/branch is exactly what you want), cancelling a publish
# mid-push risks leaving a partially-uploaded multi-arch manifest for a tag
# someone may already be trying to pull. A second push to the SAME tag is an
# unusual, deliberate action (re-running workflow_dispatch, or force-moving
# a tag) -- let it queue behind the first instead of racing it.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Review round 2 (S6) -- CONFIRM BEFORE THE FIRST TAG, do not assume: a
# package pushed to GHCR for the first time via `GITHUB_TOKEN` can land
# PRIVATE by default (an org- or account-level GHCR setting, not anything
# this workflow controls), independent of the repo's own public/private
# status -- now specifically the (round 4: now-existing, transfer complete)
# `steamhangar` ORG's own default. The recorded decision
# (docs/WORKPACKAGES.md WP 5.5) says these images should be public. If the
# org default is still "private" the first time this workflow runs,
# `docker pull` 401s for every outside puller and reads exactly like a
# broken auth setup rather than a visibility switch nobody flipped yet.
# Check each package's visibility in the GitHub package settings UI after
# the very first successful publish, before announcing anything
# (docs/WORKPACKAGES.md WP 5.6 already gates announcement on other
# conditions -- add this one). Not applicable to the `android-release` or
# `agent-binaries` jobs below (this note predates `agent-binaries`, but the
# same reasoning covers it unchanged): a GitHub Release asset on a public
# repo is public by construction, with no separate per-package visibility
# switch to flip.
jobs:
  # WP VER-1: ONE version string and commit for every artifact this run
  # builds -- the four images (build args VAULT_VERSION/VAULT_COMMIT, baked
  # as VAULT_BUILD_VERSION/VAULT_BUILD_COMMIT) and the vault-agent binaries
  # (-ldflags -X main.version/main.commit). Computed once here instead of
  # per job, so the images and the binaries cannot disagree.
  #   v* tag ref (push, or a dispatch on a tag): the tag without its `v`,
  #     e.g. v0.1.0-rc8 -> 0.1.0-rc8 -- the string docker/metadata-action's
  #     `type=semver,pattern={{version}}` tags the images with; the publish
  #     job checks that equality before it builds.
  #   any other ref (a workflow_dispatch rehearsal off a branch):
  #     dev-<short sha>, so a rehearsal build never claims a release.
  # The grammar check matches vault_api.build_info() (api/vault_api/
  # __init__.py), which falls back to its base version on anything else.
  # api/tests/test_ver_1_build_version.py runs this script with bash for
  # the tag, branch and invalid-tag cases.
  build-version:
    name: build-version / version and commit for every artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # No checkout, no token use: it only reads the run's own context.
    permissions: {}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Compute build version and commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Byte ranges in the grammar below, whatever the runner's locale.
          export LC_ALL=C
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *)            version="dev-${GITHUB_SHA:0:7}" ;;
          esac
          commit="$GITHUB_SHA"
          if ! [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,63}$ ]]; then
            printf '::error::build version %q is not 1-64 characters of [0-9A-Za-z._+-] starting with a letter or digit\n' "$version" >&2
            exit 1
          fi
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::GITHUB_SHA %q is not a 40-character commit id\n' "$commit" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "build version: ${version}, commit: ${commit}"

  publish:
    name: publish / ${{ matrix.image }} (ghcr.io)
    runs-on: ubuntu-latest
    needs: build-version
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    # WP SEC-FIX-2 (S2): one output PER IMAGE, read by agent-binaries to
    # append the digests to the release body. A matrix job's outputs are not
    # merged across legs; with a distinct name per leg each one survives
    # (GitHub's documented pattern for matrix outputs). Empty on any run
    # that is not a v* tag push, because nothing is pushed then.
    outputs:
      pin_vault_core: ${{ steps.pin.outputs.pin_vault_core }}
      pin_vault_api: ${{ steps.pin.outputs.pin_vault_api }}
      pin_vault_dns: ${{ steps.pin.outputs.pin_vault_dns }}
      pin_vault_proxy: ${{ steps.pin.outputs.pin_vault_proxy }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # vault-core: stock nginx:alpine base, nothing arch-specific in
          # core/Dockerfile (verified by reading it in full) -- builds both.
          - image: vault-core
            context: core
            dockerfile: core/Dockerfile
            platforms: linux/amd64,linux/arm64
          # vault-api: NOT arm64-capable, and this is a Dockerfile fact, not
          # a CI choice. api/Dockerfile's "fetch SteamPrefill" stage
          # hardcodes STEAMPREFILL_ARCHIVE=SteamPrefill-3.7.1-linux-x64.zip
          # (an x86_64 self-contained .NET build) with a SHA-256 pinned to
          # exactly those bytes; upstream also publishes a linux-arm64.zip
          # under the same release (api/Dockerfile's own comment names all
          # four platform assets), but selecting it would need an
          # ARG/TARGETARCH-driven URL+hash switch inside api/Dockerfile
          # itself -- out of this package's .github/workflows/-only
          # footprint (flagged in this package's own report as a follow-up
          # for whoever owns api/Dockerfile next). Publishing this one image
          # amd64-only, honestly, beats shipping a manifest whose arm64
          # entry silently doesn't exist or silently runs the wrong bytes.
          - image: vault-api
            context: .
            dockerfile: api/Dockerfile
            platforms: linux/amd64
          # vault-dns: plain Alpine + dnsmasq/gettext-envsubst apk packages,
          # nothing arch-specific -- builds both.
          - image: vault-dns
            context: dns
            dockerfile: dns/Dockerfile
            platforms: linux/amd64,linux/arm64
          # vault-proxy: plain Alpine + tinyproxy apk package, nothing
          # arch-specific -- builds both.
          - image: vault-proxy
            context: deploy/proxy
            dockerfile: deploy/proxy/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      # WP SEC-FIX-2 (P1): this job holds a write token, so the checkout
      # must not leave it in .git/config for every later step (and every
      # third-party action) to read. No step here pushes via git: releases
      # go through the REST API (softprops, gh), images through buildx.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU cross-build, not a native arm64 runner: GitHub-hosted Linux
      # arm64 runners exist but are not available to every account tier for
      # free, and this repo has no evidence of that entitlement -- QEMU
      # emulation costs build minutes instead of money and needs no runner
      # selection beyond `ubuntu-latest`, at the price of being slower per
      # arm64 layer than a native runner would be. Only requested for images
      # that actually declare an arm64 platform above -- vault-api's matrix
      # entry has none, so this step (and its emulation-registration cost)
      # is skipped for it entirely rather than run and do nothing.
      - name: Set up QEMU (arm64 emulation for cross-building)
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Review round 3 -- B2 resolved, mechanism replaced. The operator's
      # answer: a GitHub organisation named `steamhangar`, target
      # `ghcr.io/steamhangar/<image>` (e.g. `ghcr.io/steamhangar/vault-core`).
      # This IS the original 2026-08-09 decision (`ghcr.io/steamvault/*`,
      # under a to-be-created org, docs/WORKPACKAGES.md WP 5.5) carried
      # through the WP RN-1 product rename -- read the path below as that
      # same decision under the new name, not as a second deviation from it.
      #
      # Round 2's `github.repository`-derived path is GONE, not merely
      # adjusted: it was justified as surviving a future org move without
      # needing this file edited, but it does not survive THIS move
      # usefully -- and this is no longer a hypothetical. Round 4: the
      # transfer has happened. Verified via the GitHub API (not asserted):
      # this repository's `full_name` is `steamhangar/steamhangar`, its
      # `owner` is `steamhangar` with `type: Organization`, public, default
      # branch `main` -- the org and the repo carry the same word. So
      # `github.repository` IS, today, `steamhangar/steamhangar`; lowercased
      # and appended with `/<image>`, the derivation this file used to use
      # WOULD publish to `ghcr.io/steamhangar/steamhangar/vault-core` --
      # the doubled segment nobody would guess and nobody asked for, now a
      # measured fact about this exact repository rather than a future risk.
      # A derivation is the right tool when the target keeps moving in a
      # way a formula can track; here the target was a DECIDED, fixed
      # value from the moment the operator picked it, and the formula's own
      # output diverged from that decision the instant the move it was
      # built to survive actually happened. An explicit value is the right
      # tool once the value itself is the decision -- which is exactly what
      # `vars.GHCR_NAMESPACE`'s fallback below is set to.
      #
      # Mechanism: `vars.GHCR_NAMESPACE`, a repository (or org) Actions
      # variable, with a literal fallback -- not a workflow `env:` constant,
      # not a `workflow_dispatch` input:
      #   - (a) the day the org is renamed again: the operator updates the
      #     `GHCR_NAMESPACE` variable in GitHub's own Settings -> Secrets
      #     and variables -> Actions -> Variables UI. No file edit, no PR,
      #     no redeploy of this workflow -- the next tag push picks it up
      #     automatically. A hardcoded `env:` constant would recreate this
      #     exact package's own B2 finding in a new form: a literal that
      #     silently drifts from reality until someone remembers this file
      #     exists and edits it.
      #   - a `workflow_dispatch` input was considered and rejected: it can
      #     only affect a MANUAL run. This workflow's primary, load-bearing
      #     trigger is a tag PUSH, which carries no dispatch input at all --
      #     an input-only override would leave the actual release path with
      #     no escape hatch, solving the wrong trigger.
      #   - (b) a fork publishes under ITS OWN namespace by setting its own
      #     `GHCR_NAMESPACE` repository variable -- zero changes to this
      #     file. A fork that does NOT set it inherits the literal fallback
      #     below (`ghcr.io/steamhangar`) and its push then fails with a
      #     permission-denied response from GHCR (a fork has no
      #     `packages: write` grant on the upstream org's namespace) --
      #     diagnosable from the error text (it names the exact rejected
      #     namespace), not a silent wrong-destination push and not a
      #     mystery.
      #
      # Round 4: the transfer is DONE, not merely planned -- confirmed via
      # the GitHub API immediately before this edit (see above: `full_name
      # steamhangar/steamhangar`, `owner.type Organization`, public). This
      # file's own remote (`git remote -v`) already resolves to
      # `https://github.com/steamhangar/steamhangar.git`. What used to be a
      # forward-looking "do not tag before the transfer completes" warning
      # is retired -- that condition is already satisfied. Two things are
      # still worth confirming before the FIRST tag, both already-diagnosable
      # rather than silent if missed:
      #   - the `steamhangar` org must permit GitHub Actions to run at all
      #     (an org-level setting, checked once in the org's own Settings ->
      #     Actions page) -- if disabled, this workflow simply never starts,
      #     visibly, on the Actions tab, not a mid-job failure.
      #   - the S6 note above this job already covers the other residual:
      #     a package pushed to GHCR for the first time via `GITHUB_TOKEN`
      #     may still need a one-time visibility flip from private to
      #     public in the org's package settings -- unrelated to whether the
      #     transfer itself succeeded, and unrelated to this namespace
      #     mechanism specifically (it would apply the same way under the
      #     old `github.repository`-derived path too).
      #
      # Parity, literally (pre-freeze project review, finding S1): every
      # `image:` line in `deploy/compose.yaml` now reads
      # `ghcr.io/steamhangar/<image>:${VAULT_IMAGE_TAG:-<release>}` -- the
      # exact reference this job pushes under the literal fallback below,
      # so `docker compose pull` on a stock checkout fetches what a tag push
      # published, with no name translation in between. Before S1 the
      # compose file named the bare `steamhangar/vault-*` (Docker Hub's
      # namespace, which nobody publishes to) and the "parity" claimed here
      # was "strip `ghcr.io/` and you get compose's tag" -- a guessing rule,
      # not a pull that works. Pinned by api/tests/test_version_pin.py,
      # whose image-line regex requires the `ghcr.io/steamhangar/` prefix.
      # An operator who overrides `GHCR_NAMESPACE` (a fork) must edit the
      # compose `image:` lines to match, or set them via a
      # compose.override.yaml -- there is deliberately no second variable
      # for the registry on the compose side.
      # Round 4 nitpick: normalised through `tr` rather than documented as
      # "must be lowercase" -- GHCR rejects any uppercase byte in the image
      # path, and an operator typing `ghcr.io/SteamHangar` into the
      # Variables UI (a natural capitalisation, matching how the org's
      # display name actually reads) would otherwise get a push REJECTION
      # from GHCR with no normalisation anywhere in between, rather than
      # the path they clearly intended. The literal fallback
      # (`ghcr.io/steamhangar`) is already lowercase and passes through
      # this unchanged either way.
      - name: Resolve ghcr.io namespace
        id: base
        run: |
          echo "base=$(printf '%s' '${{ vars.GHCR_NAMESPACE || 'ghcr.io/steamhangar' }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # type=sha always resolves (even on a workflow_dispatch run off a
      # branch, where the two semver patterns below match nothing and are
      # silently skipped) -- every build gets at least one tag regardless of
      # trigger. The semver patterns only ever populate on an actual
      # `vX.Y.Z` tag push, the one ref shape this file's own
      # `on.push.tags` filter admits in the first place.
      #
      # `flavor: latest=false` is load-bearing, not decorative: this
      # action's own default is `latest=auto` (pinned source at this SHA,
      # `src/flavor.ts`'s `latest: 'auto'` default; `procSemver` sets
      # `latest = true` for a non-prerelease semver ref; `generateTags`
      # then emits `${prefix}latest`), so WITHOUT this line a `vX.Y.Z` tag
      # push would silently also publish a floating `latest` tag for all
      # four images -- review round 1 caught this by tracing the pinned
      # source plus the pinned action's own README ("Latest tag" section,
      # same conclusion from an independent source). With this line, no
      # `latest` tag is emitted anywhere in this file: the two semver
      # patterns below and the sha fallback are the only tags this job
      # ever produces. Note `{{major}}.{{minor}}` is NOT itself immutable
      # -- it is a deliberately moving alias (v1.2.3 then v1.2.4 both
      # claim `1.2`), same as any project's "latest patch in this minor"
      # convention; only `{{version}}` and the `sha-` tag are immutable.
      # `flavor: latest=false` closes the one truly floating, no-version-
      # information tag, not every tag that can ever repoint.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.base.outputs.base }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      # WP VER-1: on a release tag, the version baked into the image must be
      # the same string the image is tagged with. A tag metadata-action does
      # not read as semver (it then emits only the sha- tag) fails here,
      # before anything is built or pushed.
      - name: Check the baked version matches the image tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_VERSION: ${{ needs.build-version.outputs.version }}
        run: |
          set -eu
          if [ "$META_VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::metadata-action version '${META_VERSION}' differs from the build version '${BUILD_VERSION}'" >&2
            exit 1
          fi

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          # WP SEC-FIX-2 (P2): only a v* tag publishes. workflow_dispatch
          # from a branch still builds every platform -- the rehearsal stays
          # useful -- but pushes nothing, so a branch can never overwrite or
          # add a sha-* tag on ghcr.io. Dispatching on a v* tag ref
          # (github.ref = refs/tags/v...) publishes exactly like a tag push.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # WP VER-1: every Dockerfile declares these two ARGs and bakes
          # them as VAULT_BUILD_VERSION/VAULT_BUILD_COMMIT (see the
          # build-version job). ci.yml's image-build passes the same KEYS
          # with ci-<sha> values; api/tests/test_ci_image_build.py pins that.
          build-args: |
            VAULT_VERSION=${{ needs.build-version.outputs.version }}
            VAULT_COMMIT=${{ needs.build-version.outputs.commit }}

      # Review round 2 (S3): a green build here proves buildx SUCCEEDED,
      # not that what got pushed is what was declared -- exactly the gap
      # the vault-api arm64 finding above lives in (that build also
      # exits 0; the broken part is inside the image, invisible to
      # buildx). Two independent, cheap checks, matching
      # docs/LEARNINGS.md's WP 1.9 rule ("verified by inspection is not
      # verified... every binary that ships in an image needs at least a
      # credential-free smoke RUN"):
      #   1. the pushed manifest list's own platform set, read back from
      #      the registry (not from this job's memory of what it asked
      #      for), must equal `matrix.platforms` exactly -- catches a
      #      partial/dropped-platform push.
      #   2. for vault-api specifically, actually EXECUTE the one
      #      arch-sensitive binary this image ships (SteamPrefill) inside
      #      the just-pushed image, per declared platform -- this is the
      #      check that would have caught the finding above by construction
      #      if it were still live, and keeps catching it if a future edit
      #      ever re-adds arm64 to this image's platform list without also
      #      fixing api/Dockerfile's hardcoded linux-x64 archive. Check 1
      #      alone would NOT catch that regression -- buildx still writes a
      #      correctly-labelled arm64 manifest entry even though the bytes
      #      inside are amd64 (measured directly: this package extracted
      #      and ran the arm64 build's copy of the binary, `file` reported
      #      "ELF 64-bit LSB pie executable, x86-64", and executing it
      #      under a real aarch64 container failed with `exec: no such
      #      file or directory` -- NOT the more commonly quoted `Exec
      #      format error`; a guard grepping for the latter would miss this
      #      exact failure).
      # Both registry checks below read the PUSHED image back by digest, so
      # they share the push gate above: on a dispatch build there is
      # nothing in the registry to verify (WP SEC-FIX-2, P2).
      - name: Verify pushed manifest matches declared platforms
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          REF="${{ steps.base.outputs.base }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          EXPECTED="$(printf '%s' '${{ matrix.platforms }}' | tr ',' '\n' | sort)"
          # `select(.platform.os != "unknown")`: found and fixed during this
          # package's own verification, before ever pushing anything for
          # real -- build-push-action's default provenance attestation adds
          # its OWN extra `.manifests[]` entry to the pushed index, carrying
          # `platform: {"os":"unknown","architecture":"unknown"}` and a
          # `vnd.docker.reference.type: attestation-manifest` annotation
          # (confirmed against a synthetic fixture modelling that exact
          # shape, and against docker/buildx's own issue tracker/docs for
          # the convention). Without this filter, EVERY successful
          # multi-platform publish would fail this check, because the raw
          # manifest list always has one more entry than `matrix.platforms`
          # lists -- this guard would have shipped permanently red. Round 4
          # nitpick, confirmed by the reviewer's own throwaway-registry run:
          # this holds even for vault-api's single-platform push -- ONE
          # `unknown/unknown` attestation entry rides along regardless of
          # how many real platforms are declared, so the filter is not a
          # multi-arch-only concern.
          #
          # This whole check is COUPLED to `docker/build-push-action`'s
          # default of attaching a provenance attestation (this file passes
          # no `provenance:`/`sbom:` input, so that default applies). If a
          # future edit adds `provenance: false` (e.g. chasing a smaller
          # push or faster job, unrelated to this guard), the pushed
          # single-platform ref stops being an index at all -- `.manifests`
          # is then simply absent, and `jq`'s `.manifests[]` raises "Cannot
          # iterate over null" instead of returning an empty/short list,
          # which fails this step for a reason that has nothing to do with
          # the platform check this step exists to make. Read that failure
          # as "provenance got turned off," not as a platform mismatch, and
          # either keep provenance on or rewrite this check's assumption
          # about the raw manifest's shape to match.
          ACTUAL="$(docker buildx imagetools inspect "$REF" --raw | jq -r '.manifests[] | select(.platform.os != "unknown") | .platform | "\(.os)/\(.architecture)"' | sort)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::pushed manifest platforms [$ACTUAL] do not match declared matrix.platforms [$EXPECTED] for $REF" >&2
            exit 1
          fi
          echo "Manifest platforms verified against the registry: $ACTUAL"

      - name: Smoke-run SteamPrefill inside the pushed image (vault-api only)
        if: matrix.image == 'vault-api' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          REF="${{ steps.base.outputs.base }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          for PLATFORM in $(printf '%s' "${{ matrix.platforms }}" | tr ',' ' '); do
            echo "=== $PLATFORM ==="
            docker run --rm --platform "$PLATFORM" --entrypoint /opt/steamprefill/SteamPrefill "$REF" --version
          done

      # Review round 2 (S5): softened. A digest is retrievable from the
      # registry at any time (`docker buildx imagetools inspect`, or the
      # GHCR web UI) regardless of whether this step exists -- this step
      # only makes it CONVENIENT (one place, in the job summary, no extra
      # command), it does not "let an operator pin past" anything that was
      # otherwise unreachable. Threat-model §8's actual finding is about
      # `deploy/compose.yaml`'s own `${VAULT_IMAGE_TAG:-0.1.0}` mutable
      # tag, which this package correctly does not touch -- so §8 stays
      # DOCUMENTED, not closed, by anything in this file. What this file
      # DOES genuinely improve on §8, now that `flavor: latest=false`
      # above is real rather than aspirational: every tag this job itself
      # publishes is a real version or a commit-derived sha, never a
      # no-information floating tag -- a narrower, but true, claim.
      - name: Record published digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "### ${{ matrix.image }} (${{ matrix.platforms }})"
            echo ""
            echo "- tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- pin by digest: \`${{ steps.base.outputs.base }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record build (dispatch -- nothing pushed)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          {
            echo "### ${{ matrix.image }} (${{ matrix.platforms }}) -- built, NOT pushed"
            echo ""
            echo "Not a v* tag ref, so the image was built for every declared"
            echo "platform and discarded. Only a tag push publishes."
          } >> "$GITHUB_STEP_SUMMARY"

      # WP SEC-FIX-2 (S2): hand this leg's digest pin to agent-binaries,
      # which appends all four to the release body. Output name derived
      # from the image (vault-core -> pin_vault_core), matching the job's
      # `outputs:` block above.
      - name: Export digest pin for the release body
        id: pin
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ matrix.image }}
          PIN: ${{ steps.base.outputs.base }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -eu
          case "$PIN" in
            *@sha256:?*) ;;
            *) echo "::error::no sha256 digest for ${IMAGE}: ${PIN}" >&2; exit 1 ;;
          esac
          echo "pin_$(printf '%s' "$IMAGE" | tr '-' '_')=${PIN}" >> "$GITHUB_OUTPUT"

  # --- Second deliverable: the signed Android release APK ---------------------
  # See this file's header for why this job shares the `publish` job's file
  # and trigger. app/README.md's "Release build, signing, distribution"
  # section (WP 4b.9) is the design this job wires CI secrets into, not a
  # design this job is free to reinterpret:
  #   - app/app/build.gradle.kts reads four values, properties-file first,
  #     then env-var fallback: storeFile/VAULT_RELEASE_STORE_FILE,
  #     storePassword/VAULT_RELEASE_STORE_PASSWORD, keyAlias/
  #     VAULT_RELEASE_KEY_ALIAS, keyPassword/VAULT_RELEASE_KEY_PASSWORD
  #     (`releaseSigningValue`, same file). No `keystore.properties` exists
  #     in this checkout (gitignored, never committed), so the env-var path
  #     is the ONLY path a CI runner can use -- exactly the "CI-style
  #     fallback" app/README.md documents this mechanism for.
  #   - `gradle.taskGraph.whenReady` in that same file already refuses
  #     `assembleRelease` (and the other release-packaging tasks) with a
  #     `GradleException` when any of the four values is blank -- this job
  #     deliberately leans on that EXISTING, already-reviewed guard instead
  #     of re-implementing its four-way completeness check in YAML; see the
  #     "Check for release signing secret" step below for exactly what this
  #     job checks on its own (one secret, not four) and why that split is
  #     still safe.
  android-release:
    name: android-release / signed APK -> GitHub Release
    runs-on: ubuntu-latest
    # Review round 2 (N1): this job's own header comment already claims
    # "an operator who pulls a version gets matching images and app in one
    # place" -- `needs: publish` makes that literally true instead of
    # merely aspirational. Without it the two jobs would run independently
    # off the same tag, so a release could end up carrying a signed APK
    # with no matching images (or vice versa) if one job failed and the
    # other didn't. `publish` uses `fail-fast: false` across its own
    # four-image matrix, so this job only starts once EVERY image has
    # either succeeded or the whole matrix has finished trying.
    needs: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # WIDER than the `publish` job above (which only ever adds
    # `packages: write`) -- `contents: write` is what lets this job
    # create/attach to a GitHub Release. Scoped to this job alone; the
    # workflow's top-level `permissions:` stays `contents: read`, matching
    # ci.yml's own "only the read access every job actually needs" rule for
    # the default. (`agent-binaries`, below, needs the identical override
    # for the identical reason -- this is no longer the only job in the
    # file that widens beyond `publish`'s grant, just the first of two.)
    permissions:
      contents: write
    # WP SEC-FIX-2 (S1): the four ANDROID_* signing secrets live in the
    # `release` Environment, not in repository secrets (setup:
    # app/README.md, "CI signing secrets"). That Environment's deployment
    # rule admits only v* tags, so a job running on any other ref is not
    # allowed to enter it and never receives its secrets. The job only
    # ASKS for the environment on a v* tag ref: on a workflow_dispatch from
    # a branch it runs without one, sees no ANDROID_KEYSTORE_B64, and takes
    # the green "not configured" skip below -- instead of failing on the
    # protection rule and taking agent-binaries' rehearsal down with it.
    # Either way a branch run cannot read the keystore: requesting
    # `release` from a branch fails the rule before any step runs, and
    # not requesting it means its secrets are never in scope. This holds
    # only once the secrets are REMOVED from repository secrets.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    # Exposes whether a real (secret-backed) signed build ran, for
    # `agent-binaries` to read via `needs.android-release.outputs.configured`
    # -- see that job's own "Attach vault-agent binaries" step for why it
    # needs to know this (S2 fix, reviewer round 1: avoids asking
    # `softprops/action-gh-release` to `generate_release_notes` twice against
    # an already-created release, which the action's own update path would
    # otherwise append rather than skip).
    outputs:
      configured: ${{ steps.signing_check.outputs.configured }}
      # WP SEC-FIX-2 (S5): the signing certificate's SHA-256, for the
      # release body (agent-binaries). Empty when no APK was built.
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
    timeout-minutes: 30
    steps:
      # WP SEC-FIX-2 (P1): this job holds a write token, so the checkout
      # must not leave it in .git/config for every later step (and every
      # third-party action) to read. No step here pushes via git: releases
      # go through the REST API (softprops, gh), images through buildx.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Four `release` Environment secrets back the four build.gradle.kts env vars
      # above (the operator creates these; this job only consumes them):
      #   ANDROID_KEYSTORE_B64      -- base64 of the release .jks/.keystore
      #                                file's raw bytes (there is no
      #                                "keystore" env var in build.gradle.kts
      #                                itself -- VAULT_RELEASE_STORE_FILE
      #                                wants a FILE PATH, so this secret is
      #                                decoded to a temp file below and that
      #                                path, not a secret, becomes
      #                                VAULT_RELEASE_STORE_FILE).
      #   ANDROID_KEYSTORE_PASSWORD -> VAULT_RELEASE_STORE_PASSWORD
      #   ANDROID_KEY_ALIAS         -> VAULT_RELEASE_KEY_ALIAS (this one
      #                                is not actually confidential -- it
      #                                ends up inside the APK's own
      #                                certificate, readable by anyone who
      #                                downloads the release -- but it is
      #                                still an Environment secret rather
      #                                than a literal in this file, so
      #                                nothing about which alias this
      #                                project signs with is hardcoded here)
      #   ANDROID_KEY_PASSWORD      -> VAULT_RELEASE_KEY_PASSWORD
      #
      # Gating mechanism, and why: GitHub Actions does not reliably permit
      # the `secrets` context inside a job-level `if:` condition, and
      # relying on it there would make this job's very existence depend on
      # a context expression whose evaluability is not guaranteed across
      # every plan/runner combination. Instead: one step maps the ONE
      # secret that matters for "is this configured at all"
      # (ANDROID_KEYSTORE_B64) into a plain env var, checks it in a normal
      # `run:` shell conditional (no `secrets` context anywhere near an
      # `if:`), and republishes the answer as a step OUTPUT
      # (`$GITHUB_OUTPUT`, not a secret) that every later step's `if:`
      # reads instead. Only ANDROID_KEYSTORE_B64 gates the skip decision,
      # deliberately not all four: if it is absent, nothing has been set up
      # yet and this is the ordinary, expected, GREEN skip below. If it is
      # PRESENT but one of the other three is missing or wrong, that is a
      # genuine misconfiguration, not "not set up" -- and the existing
      # `gradle.taskGraph.whenReady` guard in app/app/build.gradle.kts
      # already turns that into a loud, red `GradleException` failure on
      # its own (its blank-value check runs on all four independently of
      # anything this job does), so this job does not need to duplicate
      # that four-way completeness check to get a fail-loud outcome either
      # way -- it only needs to decide whether to attempt the build at all.
      - name: Check for release signing secret
        id: signing_check
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          echo "configured=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEYSTORE" != "true" ]; then
            {
              echo "### Android release APK -- SKIPPED"
              echo ""
              echo "\`ANDROID_KEYSTORE_B64\` is not available to this run, so"
              echo "no release keystore is available. No APK was built, signed,"
              echo "or attached to this release -- this is the intended"
              echo "fail-closed behaviour (app/README.md, \"Release build,"
              echo "signing, distribution\", WP 4b.9): an unsigned APK is never"
              echo "published as a release asset."
              echo ""
              echo "Signed builds run only on a v* tag push. To enable them, set"
              echo "these four secrets in the \`release\` Environment (not as"
              echo "repository secrets): \`ANDROID_KEYSTORE_B64\`,"
              echo "\`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\`,"
              echo "\`ANDROID_KEY_PASSWORD\` (app/README.md, \"CI signing secrets\")."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # App S5 (pre-freeze project review), workflow half. The APK's
      # versionName/versionCode no longer have to be hand-bumped in
      # app/app/build.gradle.kts for every release: that file reads
      # VAULT_RELEASE_VERSION_NAME / VAULT_RELEASE_VERSION_CODE from the
      # environment, falling back to its own literals when they are unset
      # (a local `gradlew assembleRelease` keeps working unchanged). Here:
      #   - VAULT_RELEASE_VERSION_NAME = the tag with the leading `v`
      #     stripped, so tag `v0.1.0-rc1` ships as versionName `0.1.0-rc1`
      #     -- the same value the `publish` job's `type=semver,
      #     pattern={{version}}` image tag resolves to, so the APK and the
      #     images an operator pulls agree on one version string. Same
      #     `/` -> `-` sanitisation as agent-binaries' own version step
      #     below (a workflow_dispatch off a slashed branch ref must not
      #     put a path separator into a filename).
      #   - VAULT_RELEASE_VERSION_CODE = `github.run_number`: strictly
      #     increasing per workflow run on this repository, never reused,
      #     so every published APK installs as an UPDATE over the previous
      #     one (Android refuses a same-or-lower versionCode). Caveat:
      #     renaming this workflow, or deleting and recreating it, restarts
      #     run_number at 1 and the next APK is then rejected as a downgrade
      #     (app/README.md "Release version comes from the environment").
      #     A re-run of the same tag gets a higher code, which is correct:
      #     it is a different build.
      # `tag` (with the `v`, sanitised) is what the APK's release-asset
      # filename below uses, matching the `vault-agent-v1.2.3-...` naming
      # on the same release page.
      - name: Compute release version (sanitized)
        if: steps.signing_check.outputs.configured == 'true'
        id: version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME//\//-}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 (temurin)
        if: steps.signing_check.outputs.configured == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          # No `cache: gradle` here, unlike ci.yml's android-tests job:
          # this job runs once per release tag, not on every push/PR, so
          # the cache's main benefit (avoiding a cold dependency download
          # on a hot path) does not apply the same way, and keeping this
          # job's moving parts to a minimum matters more than shaving a
          # release build's runtime. (It would not have been a secret-
          # handling concern either way -- the decoded keystore below lives
          # under $RUNNER_TEMP, which setup-java's cache never touches --
          # this is a simplicity choice, not a safety one.)

      # Decodes to $RUNNER_TEMP, never into the checked-out working tree
      # (app/ or anywhere under $GITHUB_WORKSPACE): $RUNNER_TEMP is a
      # per-job scratch directory outside the workspace, so the decoded
      # keystore can never be picked up by a later `actions/upload-artifact`
      # step scoped to the workspace (this job has none anyway -- the only
      # thing it ever uploads is the one named APK path, via the release
      # step below) and is never written under app/.gradle or ~/.gradle
      # either, so it cannot end up in a Gradle build-cache entry. The
      # secret is piped through `base64 -d` with no intermediate `echo` of
      # its own value to stdout -- nothing about the keystore's bytes is
      # ever written to a log, and GitHub's own log redaction would mask
      # the exact secret string besides. No step in this job sets `set -x`
      # or passes `--debug`/`--verbose` to anything that would echo it.
      - name: Decode release keystore (to a temp path outside the workspace)
        if: steps.signing_check.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vault-android-release.jks"

      - name: gradlew assembleRelease (signed)
        if: steps.signing_check.outputs.configured == 'true'
        working-directory: app
        env:
          # The file PATH is not a secret -- only the bytes at that path
          # are. The three values below ARE the Environment secrets, mapped
          # 1:1 onto the env-var names app/app/build.gradle.kts's
          # `releaseSigningValue` already reads.
          VAULT_RELEASE_STORE_FILE: ${{ runner.temp }}/vault-android-release.jks
          VAULT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VAULT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VAULT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # App S5, see the "Compute release version" step above.
          VAULT_RELEASE_VERSION_NAME: ${{ steps.version.outputs.version }}
          VAULT_RELEASE_VERSION_CODE: ${{ github.run_number }}
        # bash, not `./gradlew` -- ci.yml's own android-tests job comment
        # documents why: the checked-out gradlew file carries no executable
        # bit (git blob mode 100644), so `./gradlew` alone fails with
        # Permission denied on this Linux runner. No `--debug`/`--verbose`:
        # Gradle's own debug logging can echo resolved property/env values,
        # which is exactly the kind of incidental leak this step must not
        # invite.
        run: bash gradlew assembleRelease --console=plain

      # `apksigner`, not `jarsigner` -- app/README.md's own verified note:
      # this build produces no v1/JAR signature at all, only v2, so
      # `jarsigner -verify` is the wrong tool for what this project ships.
      # Resolves the build-tools directory by highest version present
      # rather than hardcoding e.g. "35.0.0": ci.yml's android-tests job
      # measured that version on the runner image as of its own writing,
      # but a future runner-image bump could change it, and this step
      # should not silently start looking in the wrong place when that
      # happens.
      - name: Verify APK signature (apksigner)
        if: steps.signing_check.outputs.configured == 'true'
        id: verify
        run: |
          set -eu
          TRANSCRIPT="$RUNNER_TEMP/apksigner-verify.txt"
          CERTS="$RUNNER_TEMP/apksigner-certs.txt"
          # WP CI-FIX-3: on ANY failure in this step, repeat apksigner's
          # verdict, scheme summary and signer lines as check-run
          # annotations -- readable through the public API without a token,
          # unlike the job log. They carry only the public certificate DN
          # and fingerprints. rc10 refused to publish with "found 0" and
          # nothing token-free said why.
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then sh .github/scripts/apk-cert-digest.sh annotate "$TRANSCRIPT" "$CERTS" || true; fi; exit "$rc"' EXIT
          APK_PATH="app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH does not exist -- assembleRelease did not produce the expected signed artefact." >&2
            exit 1
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          # 2>&1: a refused APK reports its ERROR lines on stderr, and those
          # belong in the transcript the trap above annotates.
          "$APKSIGNER" verify --verbose "$APK_PATH" > "$TRANSCRIPT" 2>&1
          cat "$TRANSCRIPT"
          if ! grep -qx 'Verifies' "$TRANSCRIPT"; then
            echo "::error::apksigner did not report 'Verifies' -- refusing to publish this APK." >&2
            exit 1
          fi
          if ! grep -qx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$TRANSCRIPT"; then
            echo "::error::apksigner did not confirm the v2 signing scheme -- refusing to publish this APK." >&2
            exit 1
          fi
          # WP SEC-FIX-2 (S5): publish WHICH certificate signed the APK, so
          # users can check a download (and a keystore swap between
          # releases is visible). Exactly one signer is expected.
          "$APKSIGNER" verify --print-certs "$APK_PATH" > "$CERTS" 2>&1
          cat "$CERTS"
          # The label in front of the digest varies by build-tools version
          # and signature scheme ("Signer #1", "Signer (minSdkVersion=..,
          # maxSdkVersion=..)" for a v3.x block, "V2 Signer:" on current
          # build-tools), and one certificate may be listed once per block.
          # What must hold: every listed digest is the SAME certificate.
          # v0.1.0-rc1 failed on a "Signer #1"-only pattern, v0.1.0-rc10 on
          # a "^Signer"-anchored one; the parser now lives in a script with
          # fixture tests (api/tests/test_ci_fix_3_apk_cert_digest.py).
          if ! CERT_SHA256="$(sh .github/scripts/apk-cert-digest.sh digest "$CERTS")"; then
            echo "::error::no single signing certificate found -- refusing to publish this APK." >&2
            exit 1
          fi
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          {
            echo "### Android release APK -- signed and verified"
            echo ""
            echo "- \`Verifies\`"
            echo "- \`Verified using v2 scheme (APK Signature Scheme v2): true\`"
            echo "- signing certificate SHA-256: \`${CERT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Review round 2 (N4) -- recorded as a follow-up, deliberately NOT
      # built here: this job verifies the APK is SIGNED and verifies WHICH
      # signing scheme, but nothing anywhere in this pipeline verifies
      # WHICH CERTIFICATE signed it against a previously-published value.
      # An accidental keystore swap between releases (wrong file decoded,
      # wrong secret rotated in) would still pass every check above and
      # produce a validly-signed APK that Android will refuse to install
      # as an update over an existing install -- the one Android
      # signing-related mistake that is unrecoverable for users already on
      # a prior release (there is no "re-sign and everyone gets the fix"
      # path once that happens). A future hardening step would extract the
      # signing certificate's SHA-256 fingerprint from the verified APK
      # (`apksigner verify --print-certs`) and compare it against a
      # fingerprint pinned from the FIRST real release, failing loudly on
      # a mismatch -- not implemented in this package, since there is no
      # first real release yet to pin against.
      # WP SEC-FIX-2 (S5) did the first half: the verify step now extracts
      # that fingerprint and publishes it (run summary + release body). The
      # pinned COMPARISON is still open until the first signed release.
      #
      # Pre-freeze project review, N4: the asset is named after the
      # release, not after Gradle's build variant. `app-release.apk` says
      # nothing about which version a user downloaded, and a release page
      # that already carries `vault-agent-v1.2.3-linux-amd64` next to it
      # should carry `steamhangar-app-v1.2.3.apk`, not a file that is
      # byte-different on every release under an identical name. Renamed
      # IN PLACE (same directory, still inside the workspace) rather than
      # via softprops' own naming (which has none -- `files:` uploads under
      # the basename it finds). The verify step above already proved the
      # file exists and is signed; this only changes its name.
      - name: Rename APK to its release-asset name
        if: steps.signing_check.outputs.configured == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          mv app/app/build/outputs/apk/release/app-release.apk \
             "app/app/build/outputs/apk/release/steamhangar-app-${TAG}.apk"

      # Pre-freeze project review, P2: does this tag's release already
      # exist? Read from the GitHub API (not inferred from which job ran
      # first), so that RE-pushing the same tag -- a rehearsal tag is
      # exactly the thing that gets re-pushed -- does not re-enter
      # `softprops/action-gh-release`'s update path with
      # `generate_release_notes: true` and append a second copy of the
      # generated notes to the existing body. `gh` and `GH_TOKEN` are the
      # runner's preinstalled CLI and this job's own GITHUB_TOKEN. Only
      # HTTP 404 means "no release yet"; any other failure (rate limit,
      # outage, a token without `contents` scope) fails this step loudly
      # rather than being read as "does not exist" and quietly producing
      # the duplicate this step exists to prevent. Same tag-push-only gate
      # as the attach step below -- a branch-ref workflow_dispatch has no
      # release tag to look up.
      - name: Check whether this tag's release already exists
        if: steps.signing_check.outputs.configured == 'true' && github.event_name == 'push'
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          # Actions runs this as `bash -e`: a bare `out="$(gh api ...)"` would
          # abort the step on the 404 path (first push of every tag) before
          # `rc` is read. The `|| rc=$?` keeps the failing exit code out of
          # errexit's reach so the branches below decide.
          rc=0
          out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id 2>&1)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release for ${GITHUB_REF_NAME} exists (id ${out}) -- notes will not be regenerated"
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no release for ${GITHUB_REF_NAME} yet -- it will be created with generated notes"
          else
            echo "::error::could not determine whether a release for ${GITHUB_REF_NAME} exists: ${out}" >&2
            exit 1
          fi

      # Only on an actual tag push (not a branch-ref workflow_dispatch run,
      # which has no release tag to attach to). `github.ref_name` is the
      # tag itself (e.g. "v1.2.3") on a `refs/tags/v1.2.3` push.
      #
      # `prerelease` / `make_latest` (pre-freeze project review, B2): a tag
      # with a `-` in it (`v0.1.0-rc1`, `v1.2.0-beta.2` -- semver's
      # pre-release separator) is published as a PRE-RELEASE and does NOT
      # become the repository's "Latest release"; a plain `vX.Y.Z` is a
      # full release and does. Without these two lines the action's
      # defaults (`prerelease: false`, `make_latest: true`) would have put
      # the first rc on the front page as the latest stable release.
      # Deliberately the same two expressions on BOTH release-writing steps
      # in this file (agent-binaries' below too): the action's update path
      # re-applies these fields, so a step that omitted them would flip a
      # pre-release back to latest on its own later run.
      - name: Attach signed APK to the GitHub Release
        if: steps.signing_check.outputs.configured == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          # P2: generate notes only when this step is the one CREATING the
          # release (see the pre-check step above). The earlier "known
          # follow-up" note that used to sit here -- an unconditional
          # `true` re-appending notes on every re-push of the same tag --
          # is what that step closes.
          generate_release_notes: ${{ steps.release_check.outputs.exists != 'true' }}
          fail_on_unmatched_files: true
          files: app/app/build/outputs/apk/release/steamhangar-app-${{ steps.version.outputs.tag }}.apk

      # Runs on every outcome, including a failed verify/build step above
      # (`if: always()`), so the decoded private keystore never survives
      # past this job regardless of how it ends. `rm -f` on a path that was
      # never created (the skipped-signing case) is a harmless no-op, not
      # an error.
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vault-android-release.jks"

  # --- Third deliverable: cross-compiled vault-agent binaries ------------------
  # See this file's header ("Third deliverable") for why this job exists and
  # why it depends on `android-release` rather than `publish` directly. The
  # targets and the CGO_ENABLED=0 requirement both come from agent/README.md
  # ("Go port (production)" -> "Cross-compile matrix") and ADR-0005 ("vault-
  # agent ships as a Go binary"), not from anything invented in this file:
  # windows/amd64 (the WP 2.6 Scheduled Task installer's target),
  # linux/amd64 (Linux desktops and the Steam Deck -- see agent/README.md's
  # "Steam Deck walkthrough", which explicitly calls the Deck x86_64, not
  # ARM64), and linux/arm64 (ADR-0005's own text: "SteamOS devices ... ARM64"
  # -- a general ARM64 SteamOS/Steam-Machine-class device, confirmed a real,
  # already-built-and-documented target and not this package's invention).
  agent-binaries:
    name: agent-binaries / cross-compiled vault-agent -> GitHub Release
    runs-on: ubuntu-latest
    # `publish` is listed only so its per-image digest outputs are readable
    # here (WP SEC-FIX-2, S2); the ordering still comes from android-release,
    # which itself needs publish.
    # build-version (WP VER-1) supplies the -ldflags version and commit.
    needs: [build-version, publish, android-release]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # WIDER than the default `contents: read` at the workflow level, scoped
    # to this job alone -- same shape as `android-release`'s own override,
    # for the same reason: attaching release assets needs `contents: write`.
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      # WP SEC-FIX-2 (P1): this job holds a write token, so the checkout
      # must not leave it in .git/config for every later step (and every
      # third-party action) to read. No step here pushes via git: releases
      # go through the REST API (softprops, gh), images through buildx.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WP SEC-FIX-2: go.mod's `go 1.25.0` is a MINIMUM, but handed to
      # setup-go via go-version-file it is an exact version, and
      # check-latest cannot lift an exact pin. Release binaries would ship
      # 1.25.0's stdlib without the later 1.25.x security fixes. Derive the
      # minor line from go.mod (still the single source) and ask for the
      # newest patch of it.
      - name: Derive Go release line from go.mod
        id: gover
        shell: bash
        run: |
          set -eu
          line="$(sed -n 's/^go[[:space:]]\{1,\}\([0-9]\{1,\}\.[0-9]\{1,\}\).*/\1/p' agent/go/go.mod)"
          if [ -z "$line" ]; then
            echo "::error::no go directive found in agent/go/go.mod" >&2
            exit 1
          fi
          echo "line=${line}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gover.outputs.line }}.x
          check-latest: true

      # Reviewer round 1 (S4): `github.ref_name` is safe to use RAW only on
      # an actual tag push -- this file's own `on.push.tags: ["v*"]` filter
      # cannot match a ref containing "/", so a real release tag is always
      # one clean path segment. `workflow_dispatch`, though, can run off any
      # branch, and this job's own `if:` deliberately admits that event (the
      # one rehearsal path available before a real tag exists) -- and a
      # branch name containing "/" (e.g. this repo's own
      # "claude/projekt-ueberblick-planung-b90aa8"-style names) turns
      # "vault-agent-<ref>-linux-amd64" into a path with a subdirectory
      # component. `go build -o` then silently CREATES that subdirectory
      # instead of erroring, and the next step's `file` check fails on a
      # path it can't open -- reported as "does not report the expected
      # architecture", which looks like an S3-class arch mismatch and is
      # actually a naming bug. Measured directly against a real slashed ref
      # name (see this package's own report for the transcript); sanitized
      # once here, in one step, rather than repeating the substitution in
      # every later step that names a file.
      - name: Compute release version (sanitized)
        id: version
        run: |
          set -eu
          version="${GITHUB_REF_NAME//\//-}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # CGO_ENABLED=0 is REQUIRED, not cosmetic -- agent/README.md's own
      # "Cross-compile matrix" section measured this directly (WP 2.2 review
      # finding S3): building linux/amd64 *from* a linux/amd64 host without
      # it silently produces a dynamically-linked binary (Go auto-enables
      # cgo whenever GOOS/GOARCH match the build host and a C toolchain is
      # present), which contradicts ADR-0005's "one static binary per
      # target, no runtime dependencies" premise -- the whole point of
      # shipping Go instead of a PyInstaller bundle for exactly this
      # audience's machines. GitHub's `ubuntu-latest` runner has gcc
      # preinstalled, so this is not a hypothetical here: this job's own
      # runner is a linux/amd64 host, i.e. the one GOOS/GOARCH pair in this
      # matrix where the silent-cgo trap can actually fire. Re-verified for
      # this job specifically (not just trusted from the README) -- see
      # this package's own report for the `ldd`/`file` transcript.
      #
      # Naming: `vault-agent-<version>-<os>-<arch>[.exe]`, e.g.
      # `vault-agent-v1.2.3-windows-amd64.exe` or
      # `vault-agent-v1.2.3-linux-arm64` -- a stranger maps a filename to a
      # platform by reading the two tokens after the version literally as
      # Go's own GOOS and GOARCH names (not a marketing name like "Deck" or
      # "Windows 11"), with `.exe` as the one additional, Windows-only
      # signal. `VERSION` is the sanitized tag from the step above (e.g.
      # "v1.2.3", including the leading "v") -- deliberately NOT stripped of
      # its "v" the way the `publish` job's semver-pattern image tags are:
      # those tags exist to satisfy Docker tag conventions, this filename
      # exists so a human can look at the GitHub Release page (whose own
      # `tag_name` is also "v1.2.3", unstripped) and see the exact same
      # string in both places.
      #
      # WP VER-1: `-X main.version` / `-X main.commit` set what
      # `vault-agent --version` prints (agent/go/cmd/vault-agent/version.go;
      # unset, a source build says `dev`). BUILD_VERSION is the build-version
      # job's string WITHOUT the `v` (0.1.0-rc8), the same one the images
      # report -- the filename keeps the `v`, as explained above. `go build`
      # ignores -X for a symbol that does not exist, so main_test.go's
      # TestLdflagsSetVersionAndCommit builds with these exact flags, and the
      # step after the architecture check runs the linux/amd64 binary.
      - name: Cross-compile vault-agent (CGO_ENABLED=0, static binaries)
        working-directory: agent/go
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_VERSION: ${{ needs.build-version.outputs.version }}
          BUILD_COMMIT: ${{ needs.build-version.outputs.commit }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/dist"
          build() {
            goos="$1"; goarch="$2"; ext="$3"
            name="vault-agent-${VERSION}-${goos}-${goarch}${ext}"
            echo "=== building ${name} (GOOS=${goos} GOARCH=${goarch}) ==="
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -ldflags "-X main.version=${BUILD_VERSION} -X main.commit=${BUILD_COMMIT}" \
              -o "$GITHUB_WORKSPACE/dist/${name}" ./cmd/vault-agent
          }
          build windows amd64 .exe
          build linux   amd64 ""
          build linux   arm64 ""
          ls -l "$GITHUB_WORKSPACE/dist"

      # The WP CI-3 lesson, applied in the direction this package was warned
      # about ("do not repeat it in the other direction"): a green `go
      # build` only proves the compiler accepted the GOOS/GOARCH pair, not
      # that the bytes it produced actually match. `file`'s own architecture
      # string is checked against each binary's name -- an amd64 binary
      # (windows or linux) must report "x86-64", the arm64 one must report
      # "ARM aarch64". Both substrings were confirmed by actually running
      # `file` against this job's own build output before this check was
      # written (see this package's report).
      - name: Verify cross-compiled binary architectures (file)
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          check() {
            path="$1"; expect="$2"
            got="$(file -b "$path")"
            echo "${path}: ${got}"
            case "$got" in
              *"$expect"*) ;;
              *)
                echo "::error::${path} does not report the expected architecture ('${expect}'); got: ${got}" >&2
                exit 1
                ;;
            esac
          }
          check "vault-agent-${VERSION}-windows-amd64.exe" "x86-64"
          check "vault-agent-${VERSION}-linux-amd64"       "x86-64"
          check "vault-agent-${VERSION}-linux-arm64"       "ARM aarch64"

      # WP VER-1: the one binary this linux/amd64 runner can execute must
      # report exactly the build version and commit -- proof the -X flags
      # reached the variables, not just that the linker accepted them.
      - name: Verify the stamped version (vault-agent --version)
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_VERSION: ${{ needs.build-version.outputs.version }}
          BUILD_COMMIT: ${{ needs.build-version.outputs.commit }}
        run: |
          set -eu
          got="$("./vault-agent-${VERSION}-linux-amd64" --version)"
          want="vault-agent ${BUILD_VERSION} (commit ${BUILD_COMMIT})"
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::vault-agent --version printed '${got}', expected '${want}'" >&2
            exit 1
          fi

      # Why checksums matter for THIS binary specifically, not as boilerplate:
      # `hosts apply` edits the machine's hosts file and requires
      # Administrator/root to do so (see agent/README.md's "Hosts-file mode"
      # section). A user who is about to run something elevated, sight
      # unseen, needs a way to confirm the bytes they downloaded are the
      # bytes this workflow actually built -- without that, "download an
      # .exe from the internet and run it as Administrator" is exactly the
      # instruction every security guide tells people not to follow blindly.
      # `sha256sum -c SHA256SUMS` (run from inside the same directory the
      # binaries were downloaded into) is the whole verification story.
      - name: Generate checksums (SHA256SUMS)
        working-directory: dist
        run: |
          set -eu
          # WP SEC-FIX-2 (S3): the packaging scripts and systemd units are
          # release assets too (agent/README.md verifies them against this
          # file), so they are copied flat into dist/ and checksummed with
          # the binaries. The two units are named vault-agent-report.*, so
          # the vault-agent-* glob (here and in the attach step's `files:`)
          # already covers them.
          cp "$GITHUB_WORKSPACE"/agent/packaging/windows/*.ps1 .
          cp "$GITHUB_WORKSPACE"/agent/packaging/systemd/vault-agent-report.service \
             "$GITHUB_WORKSPACE"/agent/packaging/systemd/vault-agent-report.timer .
          sha256sum vault-agent-* ./*.ps1 > SHA256SUMS
          sed -i 's#  \./#  #' SHA256SUMS
          cat SHA256SUMS

      - name: Record build summary
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### vault-agent binaries (${VERSION})"
            echo ""
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Same tag-push-only gate as `android-release`'s own APK-attach step
      # above, and for the identical reason: a `workflow_dispatch` run off a
      # branch ref has no release to attach to. `tag_name` deliberately uses
      # the RAW `github.ref_name` here, not the sanitized `steps.version`
      # output -- this field must equal the real tag exactly for
      # `softprops/action-gh-release` to find/create the right release; the
      # sanitization above exists only to keep filenames on the filesystem
      # sane, never to change which tag this attaches to.
      #
      # `generate_release_notes` (S2 fix, reviewer round 1; extended by the
      # pre-freeze review's P2): reading the pinned action's own source, its
      # update path is `body = workflowBody || existingReleaseBody`, and
      # then -- when `generate_release_notes` is truthy and `body` is
      # non-empty -- it APPENDS the generated notes to whatever body it
      # just resolved. Two ways to hit that append: (1) `android-release`
      # already created this release in this same run (the keystore-
      # configured case) -- `needs.android-release.outputs.configured`
      # tells us that; (2) a RE-push of the same tag, where the release
      # exists from an earlier run whichever job created it then -- the
      # pre-check step below asks the GitHub API. Notes are generated only
      # when NEITHER applies, so exactly one step ever generates notes for
      # a given tag, across runs, matching the "exactly one of them ever
      # creates the release" invariant `needs: android-release` already
      # establishes within a run.
      #
      # `fail_on_unmatched_files: true`: without it, a glob that stops
      # matching anything (e.g. a future rename of the `dist/` naming
      # convention that nobody updated here) attaches nothing and this step
      # still reports success -- exactly the silent-success failure class
      # this project's own review history keeps flagging elsewhere.
      #
      # `prerelease` / `make_latest`: same two expressions as
      # android-release's attach step, for the reason given there (B2).
      - name: Check whether this tag's release already exists
        if: github.event_name == 'push'
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Same script as android-release's own pre-check (see the comment
        # there for the HTTP-404-only reading of "does not exist").
        run: |
          set -u
          # Actions runs this as `bash -e`: a bare `out="$(gh api ...)"` would
          # abort the step on the 404 path (first push of every tag) before
          # `rc` is read. The `|| rc=$?` keeps the failing exit code out of
          # errexit's reach so the branches below decide.
          rc=0
          out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id 2>&1)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release for ${GITHUB_REF_NAME} exists (id ${out}) -- notes will not be regenerated"
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no release for ${GITHUB_REF_NAME} yet -- it will be created with generated notes"
          else
            echo "::error::could not determine whether a release for ${GITHUB_REF_NAME} exists: ${out}" >&2
            exit 1
          fi

      - name: Attach vault-agent binaries to the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: ${{ needs.android-release.outputs.configured != 'true' && steps.release_check.outputs.exists != 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/vault-agent-*
            dist/*.ps1
            dist/SHA256SUMS

      # WP SEC-FIX-2 (S2/S5): deploy/README.md promises that the digest you
      # run is the digest the release page lists. This step makes the page
      # list them: the four image pins (from `publish`'s per-image outputs)
      # and the APK signing certificate (from android-release) are APPENDED
      # to the existing body -- generated notes and anything a maintainer
      # wrote stay untouched. The block is fenced by two HTML comment
      # markers; a re-run of the same tag (which rebuilds and may produce
      # new digests) drops only the earlier fenced block before appending
      # the current one, so the page never lists stale digests twice.
      # Runs last, after every attach step, so the release exists.
      - name: Append image digests and APK certificate to the release body
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN_CORE: ${{ needs.publish.outputs.pin_vault_core }}
          PIN_API: ${{ needs.publish.outputs.pin_vault_api }}
          PIN_DNS: ${{ needs.publish.outputs.pin_vault_dns }}
          PIN_PROXY: ${{ needs.publish.outputs.pin_vault_proxy }}
          APK_CERT: ${{ needs.android-release.outputs.cert_sha256 }}
        run: |
          set -eu
          for pin in "$PIN_CORE" "$PIN_API" "$PIN_DNS" "$PIN_PROXY"; do
            case "$pin" in
              */*@sha256:?*) ;;
              *) echo "::error::missing or malformed image digest pin: '${pin}'" >&2; exit 1 ;;
            esac
          done
          notes="$RUNNER_TEMP/release-notes.md"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > "$notes"
          # Re-run safe: drop the previous verify block, but only when the
          # markers are balanced (0/0 or 1/1) -- an unbalanced pair would
          # make the sed range delete eat the rest of a hand-edited body.
          n_start="$(grep -c '^<!-- steamhangar:verify:start -->$' "$notes" || true)"
          n_end="$(grep -c '^<!-- steamhangar:verify:end -->$' "$notes" || true)"
          if [ "$n_start" != "$n_end" ] || [ "$n_start" -gt 1 ]; then
            echo "::error::release body has unbalanced or duplicated verify markers (start=${n_start}, end=${n_end}); fix the release notes by hand" >&2
            exit 1
          fi
          sed -i '/^<!-- steamhangar:verify:start -->$/,/^<!-- steamhangar:verify:end -->$/d' "$notes"
          # Strip trailing blank lines so re-runs don't pile up empty lines.
          sed -i -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' "$notes"
          {
            echo ""
            echo "<!-- steamhangar:verify:start -->"
            echo "## Verify this release"
            echo ""
            echo "Image digests pushed by this release's workflow run. Pin one in"
            echo "compose with \`image: <line>\` to run exactly this build:"
            echo ""
            echo '```'
            printf '%s\n' "$PIN_CORE" "$PIN_API" "$PIN_DNS" "$PIN_PROXY"
            echo '```'
            echo ""
            if [ -n "$APK_CERT" ]; then
              echo "Android APK signing certificate SHA-256: \`${APK_CERT}\`"
            else
              echo "No signed Android APK in this release."
            fi
            echo ""
            echo "vault-agent binaries, packaging scripts and systemd units: \`SHA256SUMS\`."
            echo "<!-- steamhangar:verify:end -->"
          } >> "$notes"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
