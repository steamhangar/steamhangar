blank_issues_enabled: false
contact_links:
  - name: Ask a question / discuss an idea
    url: https://github.com/steamhangar/steamhangar/discussions
    about: >
      For open-ended questions, deployment help, or an idea you'd like to
      talk through before writing it up as a feature request.
  - name: Report a security vulnerability
    url: https://github.com/steamhangar/steamhangar/security/advisories/new
    about: >
      Do NOT open a public issue for a security vulnerability. Use GitHub's
      private vulnerability reporting instead (see CONTRIBUTING.md).
