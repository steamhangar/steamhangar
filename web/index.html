<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SteamHangar</title>
<!--
  WP 4a.1 — app shell scaffold. No-build vanilla SPA (ES modules, no
  bundler — Phase 4a stack decision, docs/WORKPACKAGES.md): every script
  below is loaded as-is, and the Content-Security-Policy vault-api sends
  (see api/vault_api/webui.py) is self-only with no 'unsafe-inline' —
  which is why there is no inline <script> or <style="..."> attribute
  anywhere in this file. Theme tokens, the status-icon system and the
  toast component are ported from docs/design/vault-app-mockup.html
  (round 7, frozen design source of truth); see
  docs/design/vault-app-mockup-NOTES.md for the rationale behind each.
-->
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <span class="brand">SteamHangar</span>
    <!-- Bell + panel (WP 4a.7, web/js/components/notifications.js). Lives
         in the app-shell topbar rather than the mockup's Library-header
         placement so it is reachable from every view without editing
         web/js/views/library.js. -->
    <button type="button" class="iconbtn" id="btn-notifs" aria-label="Notifications, no unread">
      <span class="npip" id="npip" aria-hidden="true">0</span>
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 2.6a5 5 0 0 0-5 5c0 4.2-1.4 5.6-1.4 5.6h12.8S15 11.8 15 7.6a5 5 0 0 0-5-5Z"/><path d="M8.4 16.4a1.9 1.9 0 0 0 3.2 0"/></svg>
    </button>
  </header>

  <!-- Shell banners. ONE .banner-wrap holds every shell banner because at
       BP-L it owns the single "banner" grid area (css/app.css); each banner
       toggles its own .banner-slot and js/lib/banner-wrap.js shows the
       wrap while any slot is shown (WP WEB-FIX-2; third slot WEB-FIX-5). -->
  <div class="banner-wrap" id="banner-wrap" hidden>
    <!-- Connection-lost banner (WP WEB-FIX-2, web/js/components/
         connection-banner.js): shown after a NETWORK/SERVER poll-failure
         streak of >= 20 s, cleared by the next successful poll. Not a live
         region itself; transitions are announced once via #view-announcer. -->
    <div class="banner-slot" id="conn-banner" hidden>
      <div class="banner">
        <span class="glyph" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 2.6 18.4 17H1.6L10 2.6Z"/><path d="M10 8v3.6M10 14.1v.1"/></svg>
        </span>
        <div class="body">
          <span id="conn-banner-text"></span>
        </div>
      </div>
    </div>
    <!-- Bypass banner (WP 4a.7, web/js/components/bypass-banner.js). Same
         app-shell placement reasoning as the bell above; hidden by default,
         shown/toggled purely via the `hidden` attribute so it takes no
         layout space at all when nobody is bypass_suspected. -->
    <div class="banner-slot" id="bypass-banner-wrap" hidden>
      <div class="banner">
        <span class="glyph" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 2.6 18.4 17H1.6L10 2.6Z"/><path d="M10 8v3.6M10 14.1v.1"/></svg>
        </span>
        <div class="body">
          <span id="bypass-banner-text"></span>
          <div class="acts">
            <button type="button" id="bypass-details">Details</button>
            <button type="button" class="mute" id="bypass-dismiss">Dismiss</button>
          </div>
        </div>
      </div>
    </div>
    <!-- "Desktop site" hint (WP WEB-FIX-5, web/js/components/
         desktop-site-hint.js): shown when a phone renders the page on a
         desktop-wide layout viewport (lib/desktop-site-hint.js has the
         rule). A labelled region, not a live region. The text and the close
         button's aria-label are set by that module only (one source). -->
    <div class="banner-slot" id="desktop-hint" role="region" aria-label="Display hint" hidden>
      <div class="banner">
        <span class="glyph" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="7.6"/><path d="M10 9v4.6M10 6.3v.1"/></svg>
        </span>
        <div class="body">
          <span id="desktop-hint-text"></span>
        </div>
        <button type="button" class="banner-x" id="desktop-hint-close">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- D-11 (WP 4e.1): <nav> now precedes <main> in DOM/reading/focus order
       — the rail is visually first once BP-L (css/app.css) turns this into
       a sticky left rail, so reading/focus order should be too. Visual
       order at every width BELOW BP-L is unaffected: css/app.css's `.nav{
       order:1 }` keeps it pinned at the bottom exactly as before this
       change. app.js finds nav buttons via `data-view`, not DOM position,
       so no JS changed. -->
  <nav class="nav" aria-label="Primary">
    <!-- Rail head (WP 4e.6): vault name. Invisible below BP-L (css/app.css's
         unconditional `.rail-head{ display:none }`) — populated once by
         js/components/rail-panel.js, never toggled via [hidden]. Empty text
         is the honest "not known yet" state; see that module and
         js/lib/rail-content.js for the degrade rules. -->
    <div class="rail-head" id="rail-head">
      <p class="rail-vault-name" id="rail-vault-name"></p>
    </div>
    <button type="button" class="nav-btn" data-view="library">
      <span class="nav-ic" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.6" y="2.6" width="7" height="7" rx="1.8"/><rect x="12.4" y="2.6" width="7" height="7" rx="1.8"/><rect x="2.6" y="12.4" width="7" height="7" rx="1.8"/><rect x="12.4" y="12.4" width="7" height="7" rx="1.8"/></svg>
      </span>
      <span class="nav-lb">Library</span>
    </button>
    <button type="button" class="nav-btn" data-view="downloads">
      <!-- Queue-count pip: scaffolded here (WP 4a.1), populated by
           web/js/views/downloads.js (WP 4a.5) — it is the WP that owns the
           jobs data the count comes from. Hidden (no "on" class) until a
           job is actually queued/running/paused. -->
      <span class="nav-pip" id="nav-pip" aria-hidden="true">0</span>
      <span class="nav-ic" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 2.8v11.4"/><path d="m6.4 9.8 4.6 4.6 4.6-4.6"/><path d="M3.4 18.6h15.2"/></svg>
      </span>
      <span class="nav-lb">Downloads</span>
    </button>
    <button type="button" class="nav-btn" data-view="settings">
      <span class="nav-ic" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="11" cy="11" r="5.9"/>
          <circle cx="11" cy="11" r="2.5"/>
          <path d="M11 5.1V2.9M11 19.1v-2.2M16.9 11h2.2M2.9 11h2.2"/>
          <path d="m15.17 6.83 1.56-1.56M5.27 16.73l1.56-1.56M15.17 15.17l1.56 1.56M5.27 5.27l1.56 1.56"/>
        </svg>
      </span>
      <span class="nav-lb">Settings</span>
    </button>
    <!-- Rail foot (WP 4e.6): cache used/free space. Same invisibility
         posture as the head above (unconditional display:none below BP-L,
         never [hidden]-toggled). js/components/rail-panel.js rebuilds
         #rail-cache's children on every store "cache" tick; empty means
         "not known yet", never a fabricated zero. -->
    <div class="rail-foot" id="rail-foot">
      <div class="rail-cache" id="rail-cache"></div>
      <!-- Optional version line (coordinator addition, WP 4e.7): GET
           /v1/settings's top-level `server_version` string, sibling of
           `readonly` (js/lib/rail-content.js's versionFromSettings). Empty
           text is the honest "absent/blank/malformed" state — all three
           degrade the same way, never a fallback string. -->
      <p class="rail-version" id="rail-version"></p>
    </div>
  </nav>

  <!-- WP WEB-FIX-1 (S2): NO aria-live on <main> — a live region spanning
       the whole view root would announce every navigation's full DOM
       swap AND every poll tick's patched values (job progress, sizes) to
       a screen reader. Navigation is announced once, by title, through
       #view-announcer below (js/app.js renderView). -->
  <main id="view-root" class="view-root" tabindex="-1"></main>

  <!-- Suggestions panel (WP 4h.2, js/components/decision-panel.js): a
       right-hand column at BP-XL (>=1800px), a collapsible card below that
       width (docs/PROJECT_PLAN.md:1867-1869 — the operator-ratified plan
       item, not the narrower "BP-XL only" a first brief draft assumed; see
       docs/WORKPACKAGES.md D-16). ONE element, ONE DOM position (last child
       of #app, after <main> — satisfies D-14's "no new focusable content
       between the filter row and the first library card" by construction,
       since this comes later than all of it) — but DOM position is NOT the
       same as VISUAL position below BP-L (Opus review blocker B1, WP 4h.2
       fix round): #app becomes a CSS grid at BP-L with a named area map,
       and this element needs an EXPLICIT grid-area there (css/app.css's
       BP-L block) or it auto-places into whichever cell the grid finds
       first vacant, landing above the library or inside the rail's own
       column depending on the bypass banner's visibility — measured live,
       see that block's own comment for the full story and numbers. Which
       of the two presentations it looks like is decided purely by CSS
       (the BP-L block's explicit row, the BP-XL block's column), never by
       this file or by js/components/decision-panel.js. `hidden` by default
       (Library-view-only, and genuinely nothing to show before the first
       "games" poll lands); js/components/decision-panel.js toggles it,
       never removes/re-inserts the node. -->
  <aside class="decision-panel" id="decision-panel" hidden aria-label="Suggestions">
    <div class="dp-head">
      <h2 class="dp-title">Suggestions</h2>
      <div class="dp-acts">
        <button type="button" class="iconbtn dp-collapse" id="dp-collapse" aria-expanded="false" aria-label="Expand suggestions">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5.5 7.5 5 5 5-5"/></svg>
        </button>
        <button type="button" class="iconbtn dp-dismiss" id="dp-dismiss" aria-label="Dismiss suggestions">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9"/></svg>
        </button>
      </div>
    </div>
    <div class="dp-body" id="dp-body"></div>
  </aside>
</div>

<!-- Navigation announcer (WP WEB-FIX-1, S2): same role="status"/polite
     pattern as #toast below, but visually hidden (.sr-only, css/theme.css)
     — js/app.js writes the new view's title here once per navigation, so
     assistive tech hears "Downloads", not the whole re-rendered view. Must
     exist in the static markup (not be created by JS) so the live region
     is registered before its first update. -->
<div id="view-announcer" class="sr-only" role="status" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite">
  <span class="toast-key" aria-hidden="true"></span>
  <span id="toast-text" class="toast-text"></span>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
