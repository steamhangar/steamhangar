# SteamHangar vault-core -- GOLDEN upstream rate include (WP TH-1a).
#
# Not read by nginx: the container renders /etc/nginx/vault-upstream-rate.conf
# at start (core/docker/27-vault-upstream-rate.sh). The directives below are
# exactly that render when VAULT_UPSTREAM_RATE is empty (no cap) -- comments
# aside, core/tests/test-template-invariants.sh asserts the two are
# identical. Until NGINX-DUP-1 this file was the native rig's include
# (core/nginx/vault-upstream-rate.conf). See core/README.md "Upstream rate cap".
map $time_iso8601 $vault_upstream_rate {
    default 0;
}
