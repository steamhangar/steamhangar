# SteamHangar vault-core -- NATIVE upstream rate include (WP TH-1a).
#
# Included by core/nginx/nginx.conf (`include vault-upstream-rate.conf;`,
# resolved against this directory). The native dev/test rig has no cap: the
# directives below are exactly what core/docker/27-vault-upstream-rate.sh
# renders in the container when VAULT_UPSTREAM_RATE is empty -- comments
# aside, core/docker/check-config-drift.sh asserts the two are identical.
# A capped render is container-only (generated from env at start); see
# core/README.md "Upstream rate cap".
map $time_iso8601 $vault_upstream_rate {
    default 0;
}
