# Regression fixture for B1 (review fix): reproduces nginx setting
# $upstream_status to a comma-separated retry list (e.g. "502, 200") when
# proxy_next_upstream retries a failed backend against a working one, and
# proves the store-path guard below still stores the eventually-successful
# body instead of silently discarding it.
#
# Not a copy of core/nginx/nginx.conf as a whole -- just the one map block
# under test, isolated against two local throwaway backends instead of the
# real Steam CDN (which cannot be made to fail on demand). Started by
# core/tests/test-core.ps1 on its own dedicated port/prefix, never on port
# 80, so it never conflicts with the PoC or vault-core instances.
#
# IMPORTANT: if core/nginx/nginx.conf's `map $upstream_status
# $vault_store_path { ... }` block ever changes, update the copy below to
# match, or this regression test silently stops testing the real fix.

worker_processes  1;
pid        logs/nginx.pid;
error_log  logs/error.log warn;

events { worker_connections 32; }

http {
    default_type application/octet-stream;
    client_body_temp_path tmp/client_body;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;
    proxy_temp_path       tmp/proxy;

    # Minimal custom format: the default "combined" log format has no
    # upstream_status field at all, which would make the "502, 200" retry
    # list this test asserts on invisible in the log no matter what nginx
    # actually did internally.
    log_format retrytest 'upstream_status=$upstream_status status=$status';
    access_log logs/access.log retrytest;

    # Two local throwaway backends (started by test-core.ps1 as PowerShell
    # background jobs, see Start-FakeHttpBackend): 127.0.0.1:18101 always
    # answers 502, 127.0.0.1:18102 always answers 200 with a fixed body.
    upstream retry_backends {
        server 127.0.0.1:18101 max_fails=0;
        server 127.0.0.1:18102 max_fails=0;
    }

    # --- Kept in sync with core/nginx/nginx.conf's $vault_store_path map ---
    map $upstream_status $vault_store_path {
        200          "$document_root$uri";
        "~, 200$"    "$document_root$uri";
        default      "";
    }
    # -------------------------------------------------------------------

    server {
        listen 18096;
        root cache;

        location /depot/ {
            try_files $uri @miss;
        }

        location @miss {
            proxy_pass http://retry_backends;
            # Deliberately NOT production's retry policy (WP CORE-FIX-2:
            # no `error`, tries 2): this rig needs a retry from a 502
            # backend to a 200 one to produce "502, 200". Only the
            # $vault_store_path map above is kept in sync with nginx.conf.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_store $vault_store_path;
            proxy_store_access user:rw group:r all:r;
        }
    }
}
