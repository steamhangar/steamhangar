## SteamHangar Android app — version catalog (WP 4b.1).
##
## Repo rule (docs/LEARNINGS.md / CLAUDE.md): pinned versions only, no
## dynamic ranges ("latest.release", "+") anywhere in the build. Every
## entry below is a single, exact, released version.
##
## Compatibility notes:
## - AGP 8.7.3 requires Gradle 8.9+ (bootstrap here is Gradle 8.10.2 — OK).
## - Kotlin 2.0.21 is the last 2.0.x patch; the Compose compiler Gradle
##   plugin version below is pinned to match it exactly (required — the
##   Compose compiler plugin version must equal the Kotlin version it
##   compiles with as of Kotlin 2.0's K2-based compiler plugin model).
## - Compose BOM 2024.10.01 is contemporaneous with Kotlin 2.0.21/AGP 8.7.3
##   (chosen over a newer BOM to avoid pulling compileSdk/AGP features this
##   toolchain combination does not support).
##
## WP 4b.2 additions (API client + connectivity profiles):
## - kotlinx-serialization-json 1.7.3 and kotlinx-coroutines-core 1.9.0 are
##   both the latest patch contemporaneous with Kotlin 2.0.21 (K2 plugin
##   model — same reasoning as the Compose compiler plugin above).
## - OkHttp 4.12.0 is the current stable 4.x line (5.x was still
##   pre-release as of this WP) — plain Java, no extra Kotlin coroutines
##   adapter needed for the suspend wrapper this WP writes by hand.
##   mockwebserver is pinned to the SAME version, test-only.
## - okhttp-tls 4.12.0 (test-only, same version again) added for the
##   Opus-review redirect-leak pin: VaultApiClientTest needs a real HTTPS
##   MockWebServer (HeldCertificate/HandshakeCertificates) to construct a
##   PublicDomainProfile pointed at it and prove an https->http redirect
##   never reaches a second server.
## - androidx.security:security-crypto 1.1.0-alpha06 is pinned over the
##   older stable 1.0.0 specifically for the `MasterKey` builder API used
##   in EncryptedCredentialStore.kt — 1.0.0's `MasterKeys` helper is
##   deprecated in favour of it. This WAS a documented exception to
##   "stable only" (no GA 1.1.0 existed at WP 4b.2's time), not an
##   oversight.
##
##   WP 4b.9 carry-over re-check (docs/WORKPACKAGES.md Phase 4b header):
##   a GA release now EXISTS -- androidx.security:security-crypto:1.1.0
##   (Google's Maven metadata, dl.google.com/dl/android/maven2/androidx/
##   security/security-crypto/maven-metadata.xml: <release>1.1.0</release>,
##   lastUpdated 2025-07-30), and its classes.jar carries the identical
##   API surface this app depends on --
##   androidx.security.crypto.{MasterKey, MasterKey$Builder,
##   EncryptedSharedPreferences} are all present, verified by downloading
##   the 1.1.0 .aar and listing classes.jar (not just trusting the version
##   number, per docs/LEARNINGS.md's "verify empirically" rule). This is
##   NOT bumped here -- the WP 4b.9 brief is explicit ("report, recommend,
##   do not silently bump a security dependency") and bumping a
##   credential-storage dependency deserves its own reviewed change, not a
##   drive-by inside a packaging/carry-over WP.
##
##   RECOMMENDATION: bump to 1.1.0 in a dedicated follow-up change once a
##   device/emulator is available to re-run EncryptedCredentialStore
##   against a real Android Keystore on the new artifact before trusting
##   it in production (this environment has never been able to exercise
##   that path at all -- see app/README.md's "No instrumented test of
##   EncryptedCredentialStore" note, unchanged by this finding). The
##   change itself is expected to be a one-line version bump with no
##   source changes (class list unchanged), but "expected" is not
##   "verified on-device", and a credential-storage dependency is exactly
##   the wrong place to skip that step.
##
## WP 4b.3 addition (Steam identity — OpenID + GetOwnedGames on-device):
## - androidx.browser 1.8.0 is the current stable release, used ONLY for
##   CustomTabsIntent to launch Valve's OpenID login page. No other new
##   runtime dependency — OpenID verification and the Steam Web API calls
##   reuse the already-pinned OkHttp 4.12.0.
##
## WP 4b.4 addition (Library view — cover art):
## - io.coil-kt:coil-compose 2.7.0 (latest stable 2.x release; Coil 3.x
##   requires a Kotlin Multiplatform-oriented rewrite and a newer Kotlin
##   than the 2.0.21 pinned here) for Steam CDN cover-art loading. Chosen
##   over a hand-rolled OkHttp+BitmapFactory loader (the brief's other
##   option) because a correct hand-rolled version would have to reinvent
##   request de-duplication, an LRU memory+disk cache, and Compose
##   lifecycle-aware cancellation — Coil already solves all three, is the
##   de-facto standard for this exact job, and (per its own POM) only
##   requires OkHttp >= 3.12, so it resolves against the project's pinned
##   OkHttp 4.12.0 rather than forcing a second copy in. Cover art is
##   fetched from Valve's CDN directly (not through VaultApiClient's
##   profile-scoped OkHttpClient/CleartextPolicyInterceptor), so Coil's own
##   default HTTP stack is used, not the vault-api one.
## - androidx.lifecycle:lifecycle-runtime-compose, pinned to the SAME
##   2.8.7 already used by lifecycle-runtime-ktx (it was already resolving
##   transitively at that exact version via other androidx artifacts;
##   declared directly here rather than relied on implicitly, since
##   `LibraryScreen.kt` imports its `LocalLifecycleOwner` directly -- the
##   non-deprecated replacement for `androidx.compose.ui.platform.LocalLifecycleOwner`).
##
## WP 4b.8 additions (notifications via WorkManager):
## - androidx.work:work-runtime-ktx 2.9.1 is the latest stable 2.9.x
##   release (2.10.x's floor requires a newer AGP/compileSdk combination
##   than this project's pinned AGP 8.7.3 bootstrap) -- provides
##   `CoroutineWorker`/`PeriodicWorkRequestBuilder`/`WorkManager`, the
##   WorkManager APIs the brief specifically asks for (pinned
##   PeriodicWorkRequest at the 15-minute floor, NETWORK_CONNECTED
##   constraint). No `androidx.work:work-testing` dependency was added: it
##   requires Robolectric or an instrumented device to drive
##   `TestListenableWorkerBuilder`, neither of which exists in this
##   environment (app/README.md's "No instrumented tests") -- see
##   `NotificationPollWorker.kt`'s kdoc for the honest device-test list this
##   leaves, and `NotificationPollLogic.kt` for the pure decision core that
##   IS unit-tested instead.
## - androidx.lifecycle:lifecycle-process, pinned to the SAME 2.8.7 already
##   used for lifecycle-runtime-ktx/-compose above -- provides
##   `ProcessLifecycleOwner`, the "process-lifecycle check" the WP 4b.8
##   brief names as sufficient for the foreground-notification-suppression
##   rule (`NotificationPollWorker.kt`).
##
## WP APP-TEST-1 additions (library screenshot tests, TEST classpath only --
## nothing below reaches the APK):
## - org.robolectric:robolectric 4.14.1 is the first line that knows SDK 35
##   (`DefaultSdkProvider`: android-all 15 / 12650502, required Java 17 --
##   checked in the robolectric-4.14.1 source, so the CI job's Temurin 17
##   is enough). Contemporaneous with the Compose BOM 2024.10.01 pinned
##   above; 4.15+ (June 2025 onward) is not needed for anything here.
## - io.github.takahirom.roborazzi:roborazzi 1.32.2 (Nov 2024, same month
##   as Robolectric 4.14.1) -- its POM targets kotlin-stdlib 1.9.22 and
##   espresso-core 3.5.1, its AAR declares minCompileSdk=1, so it resolves
##   against Kotlin 2.0.21 / compileSdk 35 without forcing anything newer
##   (POMs checked; 1.43.0 still targets 1.9.22, 1.49.0 moved to 2.0.21 --
##   nothing from those lines is needed here). Only the core artifact: the test
##   calls `SemanticsNodeInteraction.captureRoboImage` and picks
##   record/verify per image itself, so neither the Roborazzi Gradle
##   plugin nor roborazzi-compose / roborazzi-junit-rule is used.
## - androidx.compose.ui:ui-test-junit4 comes from the SAME Compose BOM
##   (1.7.5), never its own version.

