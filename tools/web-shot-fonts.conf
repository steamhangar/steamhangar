<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Self-contained fontconfig for tools/web-shot.mjs (WP WEB-GOLDENS-1).

  Screenshot goldens are only comparable when every machine resolves the
  app's font stack (web/css/theme.css: Roboto / Segoe UI / system-ui /
  sans-serif, Roboto Mono / monospace) to the SAME installed fonts with the
  SAME rasterizer settings. This file does not include /etc/fonts/fonts.conf
  on purpose: a host's conf.d (hinting style, LCD filter, aliases; the
  devbox maps sans-serif to Liberation Mono) would otherwise leak into the
  pixels. Everything the renderer needs is spelled out here, and the only
  font package required is fonts-liberation (CI installs exactly that); no
  other installed font is admitted (selectfont below).
  Note for editors: XML forbids a double hyphen inside a comment; a broken
  file is silently ignored by fontconfig (system config wins), so run
  `FONTCONFIG_FILE=$PWD/tools/web-shot-fonts.conf fc-match 'sans\-serif'`
  after a change and expect Liberation Sans (fc-match parses an unescaped
  hyphen as the family/size separator; Chromium passes the CSS names
  verbatim; a relative FONTCONFIG_FILE is looked up under /etc/fonts, not
  the working directory). `fc-list : family` must print exactly Liberation
  Sans, Serif and Mono.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!--
    Only the three Liberation families exist for the renderer. The dirs
    above hold whatever the host installed (a GitHub runner has DejaVu,
    Noto and more; the devbox has nothing but Liberation), and Chromium
    asks fontconfig for a fallback whenever a glyph is missing from
    Liberation: CI drew the kit's grip (U+22EE) from a runner font while
    the devbox drew a missing-glyph box, a real pixel difference. Accepting
    only these families makes such a glyph a missing-glyph box everywhere.
    Liberation Sans Narrow is rejected too: Debian 12's fonts-liberation
    1.07 ships it, the CI runner's package does not (CI goldens drew the
    condensed brand in Liberation Sans Bold, the devbox in Narrow), so the
    condensed stack now renders in Liberation Sans on both.
  -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="scalable"><bool>true</bool></patelt></pattern>
      <pattern><patelt name="scalable"><bool>false</bool></patelt></pattern>
    </rejectfont>
    <acceptfont>
      <pattern><patelt name="family"><string>Liberation Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Mono</string></patelt></pattern>
    </acceptfont>
  </selectfont>

  <!--
    Rasterizer settings, fixed. Hinting is OFF: the font files and the
    FreeType library differ between the devbox (Debian 12) and CI (Ubuntu
    24.04), and hinting is the part of rasterization that depends most on
    both (glyph programs, interpreter version), moving stems by whole
    pixels. Unhinted, a glyph is its outline sampled with grey coverage.
    Grey antialiasing only (no subpixel/LCD), no embedded bitmaps.
    Residual edge noise is what png-diff.mjs absorbs in aa-tolerant mode.
  -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Every family the stylesheet names, plus the generics, to Liberation. -->
  <alias binding="strong"><family>Roboto</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI Variable Text</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Roboto Condensed</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Roboto Mono</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>Cascadia Mono</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>SFMono-Regular</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
